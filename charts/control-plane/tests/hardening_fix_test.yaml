suite: pod hardening of the control plane
templates:
  - web.yaml
  - controller.yaml
  - router.yaml
values:
  - values/required.yaml
release:
  name: c
  namespace: ci-accelerator
tests:
  # Settings no other test asserted: a regression here passed the suite.
  - it: keeps the web from gaining privileges
    template: web.yaml
    documentIndex: 0
    asserts:
      - equal: { path: "spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation", value: false }
      - equal: { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }
  - it: runs the controller with the RuntimeDefault seccomp profile
    template: controller.yaml
    documentIndex: 0
    asserts:
      - equal: { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }
      - equal: { path: "spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation", value: false }
  - it: drops every capability of the router and gives it an hour-long token
    template: router.yaml
    documentIndex: 0
    set:
      router.enabled: true
      jobs.namespace: ci-jobs
    asserts:
      - equal: { path: "spec.template.spec.containers[0].securityContext.capabilities.drop", value: [ALL] }
      - equal: { path: "spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation", value: false }
      - equal: { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }
      - contains:
          path: spec.template.spec.volumes
          content:
            name: token
            projected:
              defaultMode: 0444
              sources:
                - serviceAccountToken:
                    audience: ci-accelerator-controller
                    expirationSeconds: 3600
                    path: token
