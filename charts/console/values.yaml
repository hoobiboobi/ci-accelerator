# The ci-accelerator console: one pod that reads every daemon's build
# history and the CI jobs' pods into its own store (SQLite on a volume),
# and serves its pages and a read-only JSON API on a ClusterIP Service.
#
# Without sign-in (signIn.enabled false, the default) the pages and the API
# show everything to whoever reaches them: do not expose them outside the
# cluster. With it, each person signs in through GitLab.

# -- The switch the box uses (console.enabled). It has a default here so that
# `helm upgrade --reuse-values` from a box without the console keeps it
# off. Installed on its own, this chart ignores it.
enabled: false

nameOverride: ""
fullnameOverride: ""
# -- Labels for every object; they cannot override the chart's own labels.
commonLabels: {}

image:
  repository: ghcr.io/hoobiboobi/ci-accelerator-console
  # -- Default: v<appVersion>.
  tag: ""
  # -- When set, the image is pulled by digest (tag is kept for readability).
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

gitlab:
  # -- URLs of the GitLab instances whose jobs the runners take, exactly as the
  # runners have them (gitlabUrl, slash included): every build's trace id
  # carries a hash of that string.
  urls: []
  # -- Or read them from a ConfigMap key (comma-separated). Rendered with tpl.
  urlsFrom:
    configMap: ""
    key: urls
  # -- A token that can read the projects' jobs (read_api): a Secret's key.
  # The console reads with it the pipelines' jobs (how long each waited for
  # a runner and ran, jobs of other runners) while its pages are in use,
  # once per finished pipeline; GitLab's comparison of two commits, which
  # settles "files or node"; and the end of a job's log on request. Without
  # it, job times come from the job pods and "files or node" stays unclear.
  # Not with sign-in: GitLab is then read with each person's own token.
  token:
    existingSecret: ""
    key: token

# -- The runners' S3 cache (GitLab's cache: keyword): the console lists its
# folders now and then and shows each project's cache size and key count
# on the Nodes page, with a warning when the bucket has no lifecycle rule
# (the runners never delete a cache). Either the folders
# here (a Secret with the keys accesskey and secretkey per folder; keys
# that may only read are enough), or a ConfigMap with them as JSON (the
# box writes one). The console may read only the Secrets named here.
caches:
  stores: []
  # - server: s3.example.com   # host[:port]
  #   bucket: ci-cache
  #   region: eu-1
  #   path: ci-accelerator/993196           # the runners' cache Path
  #   gitlabUrl: https://gitlab.com/         # exactly as the runners have it
  #   existingSecret: runner-cache-read
  #   insecure: false                        # true: plain http
  #   pathStyle: true                        # default: path style except AWS
  # -- Or the name of a ConfigMap whose key holds the list (fields server,
  # bucket, region, path, instance, secret, insecure, pathStyle); the Role
  # to read its Secrets is then the writer's to make. Rendered with tpl.
  fromConfigMap: ""
  # -- The ConfigMap's key with the list.
  key: caches.json
  # -- How often the folders are listed.
  every: 10m

# -- Sign-in through GitLab. Each person signs in with a GitLab the runners
# serve and sees the projects whose jobs GitLab lets them read (Reporter or
# more, or public pipelines); GitLab is read with their own token. GitLab
# never calls the console: the browser carries the redirects.
signIn:
  enabled: false
  # -- Where browsers reach the console: https (an Ingress or a gateway you
  # add), or http only on localhost (a port-forward). Default:
  # global.console.url. Rendered with tpl.
  url: ""
  # -- A Secret holding 32 random bytes in base64 (openssl rand -base64 32);
  # it seals each session's GitLab token. Changing it signs everyone out.
  sessionKey:
    existingSecret: ""
    key: key
  # -- One OAuth application per GitLab (User or Group Settings >
  # Applications, or Admin > Applications on your own GitLab):
  # confidential, scopes openid and read_api, redirect URI
  # <url>/auth/callback/<id> (the NOTES and the console's log print it).
  #   url: exactly as the runners have it; may be left empty when the
  #        console serves one GitLab
  #   existingSecret: a Secret with the keys client-id and client-secret
  #   admins: GitLab usernames who see everything (builds of no known
  #        project, the JSON API)
  gitlab: []
  # - url: https://gitlab.com/
  #   existingSecret: console-gitlab-oauth
  #   admins: [alice]

daemons:
  # -- host:port of the BuildKit chart's headless Service; every address it
  # resolves to is a daemon. Rendered with tpl.
  discover: ""
  # -- Name in the daemons' certificate. Default: the host of discover.
  serverName: ""
  # -- Port of the disk probe next to each daemon (the buildkit chart's
  # diskProbe), for the free space on the Nodes page. 0: not read.
  diskProbePort: 0

# -- The client certificate the console presents to the daemons. Either a
# Secret with ca.crt, tls.crt and tls.key, or one cert-manager issues from
# the daemons' CA.
tls:
  existingSecret: ""
  certManager:
    # -- Default: global.tls.issuerRef. Rendered with tpl.
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    duration: 8760h
    renewBeforePercentage: 33

jobs:
  # -- Namespace of the CI job pods, read for job names, pipelines and
  # commits. Empty: builds are kept without them. Rendered with tpl.
  namespace: ""
  # -- A Role and RoleBinding there that let the console get, list and watch
  # pods. Without them, give that access some other way.
  rbac:
    create: true

retention:
  # -- Days builds are kept in full (steps, reasons). Each image's daily
  # figures (builds by outcome, build times) are kept a year regardless. At 150 pipelines a day
  # with 15 image builds each, a project takes about 0.25 GB per 30 days.
  days: 30
  # -- Days the steps' output is kept.
  outputDays: 7

# -- The store. SQLite needs block storage (ReadWriteOnce): never NFS or
# another shared file system.
persistence:
  size: 10Gi
  storageClass: ""
  existingClaim: ""

# -- The port of the pages and the JSON API (Service <release>-console,
# served by the web's pods).
service:
  port: 8080

# The pages run in their own pods (the web), apart from the controller,
# which holds the store, the collector and the sessions. The web keeps
# nothing: any number of its pods can run, and it reads everything from the
# controller's API.
web:
  # -- Pods serving the pages.
  replicas: 2
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 256Mi
  # -- Placement of the web's pods; empty: the controller's (nodeSelector,
  # tolerations, affinity below).
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}

# The controller's API, which the web reads over HTTPS (Service
# <release>-console-api). Callers prove themselves with a ServiceAccount
# token the controller checks with Kubernetes (TokenReview).
api:
  # -- The API's port.
  port: 8443
  # -- Cluster domain in the API certificate's names.
  clusterDomain: cluster.local
  tls:
    # -- Secret with the API's server certificate (tls.crt, tls.key, and
    # ca.crt that it chains to); empty: issued by cert-manager from the
    # daemons' CA (server auth only). Needed with tls.existingSecret.
    existingSecret: ""

# Who may connect to the console. CI jobs and their builds (RUN steps share
# the daemons' network) run untrusted code in the same cluster, and without
# sign-in the console shows every project to whoever reaches it. Needs a
# CNI that enforces NetworkPolicy. kubectl port-forward keeps working.
networkPolicy:
  # -- Render a NetworkPolicy that admits connections from every namespace
  # except this one, the jobs namespace and deniedNamespaces, and from pods
  # of this namespace except deniedComponents. Only ingress is limited.
  enabled: false
  # -- More namespaces whose pods may not connect (the jobs namespace is
  # always one when jobs.namespace is set). Rendered with tpl.
  deniedNamespaces: []
  # -- Pods of this namespace whose ci-accelerator.io/component label is one
  # of these may not connect: the daemons, whose network every build shares.
  deniedComponents:
    - buildkit
  # -- More NetworkPolicyPeer entries that may connect, e.g. an ipBlock with
  # the node addresses when the Ingress controller runs on the host network.
  extraFrom: []

# -- The controller's resources (the web's are under web.resources).
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 1Gi

# -- Placement of the controller (and of the web unless web.* says
# otherwise).
nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}

global:
  tls:
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
