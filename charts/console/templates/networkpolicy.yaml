{{- /* Read with dig: values reused from 0.2.1 (--reuse-values) have no networkPolicy. */}}
{{- $np := default (dict) .Values.networkPolicy }}
{{- if dig "enabled" false $np }}
{{- $denied := list .Release.Namespace }}
{{- with include "console.jobsNamespace" . }}{{ $denied = append $denied . }}{{ end }}
{{- range (dig "deniedNamespaces" (list) $np) }}{{ $denied = append $denied (tpl . $) }}{{ end }}
# Who may open the console. CI jobs and their builds run untrusted code in
# the same cluster, and without sign-in the console shows every project to
# whoever reaches it: the jobs namespace and the daemons (RUN steps share
# their network) are kept out; Ingress controllers and other namespaces,
# and kubectl port-forward (it enters the pod from the node), still reach
# it. Only ingress is limited: the console's own connections (daemons, the
# API server, GitLab, S3) stay open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        # Every namespace but this one and the denied ones.
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  {{- toYaml (uniq $denied) | nindent 18 }}
        # This namespace, but not the denied components.
        - podSelector:
            {{- with (dig "deniedComponents" (list "buildkit") $np) }}
            matchExpressions:
              - key: ci-accelerator.io/component
                operator: NotIn
                values:
                  {{- toYaml . | nindent 18 }}
            {{- else }}
            {}
            {{- end }}
        {{- with (dig "extraFrom" (list) $np) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
