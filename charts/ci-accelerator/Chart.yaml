apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 0.1.0
# The buildkit release the daemons run.
appVersion: "v0.33.1"
kubeVersion: ">=1.34.0-0"
home: https://github.com/hoobiboobi/ci-accelerator
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
annotations:
  artifacthub.io/license: Apache-2.0
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (the gitlab-runner
# archive checked against a pinned sha256).
dependencies:
  - name: buildkit
    version: 0.1.0
    repository: file://../buildkit
  - name: gitlab-runner
    version: 0.93.0
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
