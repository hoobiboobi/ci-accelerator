{{- /* Read with dig: a release upgraded with --reuse-values from a box
     without the console has no console values. */}}
{{- if dig "console" "enabled" false .Values.AsMap }}
# The runner's GitLab URL for the console: the trace ids it reads carry a
# hash of exactly this string.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-console-gitlab
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ci-accelerator.labels" . | nindent 4 }}
data:
  urls: {{ index .Values "gitlab-runner" "gitlabUrl" | quote }}
{{- end }}
