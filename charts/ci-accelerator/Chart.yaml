apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 0.4.0
# The box's own version (its control plane's image); the daemons' BuildKit version is in charts/buildkit.
appVersion: "0.4.0"
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.34.2
    - name: ci-accelerator
      image: ghcr.io/hoobiboobi/ci-accelerator:v0.4.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: gitlab-runner
      image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.4.2
  artifacthub.io/links: |
    - name: Website and documentation
      url: https://ci-accelerator.io/docs/
    - name: Try it on one machine
      url: https://ci-accelerator.io/docs/#try-it-on-one-machine
    - name: GitOps (Flux, Argo CD)
      url: https://ci-accelerator.io/docs/gitops/
    - name: Changelog
      url: https://ci-accelerator.io/changelog/
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
  # The release's changes, for Artifact Hub's version page; rewrite with each release (docs/releasing.md).
  artifacthub.io/changes: |
    - kind: added
      description: "The CI component builds from a git context (context-source: git): the build job checks nothing out, the build node fetches the pipeline's commit itself"
    - kind: changed
      description: The console reads a git context's commit as the build context and tells submodules from files in GitLab's comparison of commits
    - kind: security
      description: BuildKit v0.34.2 (GHSA-2fqp-xg6f-v7gj, a daemon panic on a git source resolved twice; GHSA-w26x-xg27-7qjc, extended attributes set outside the state directory)
    - kind: fixed
      description: "The CI component's summary no longer fails a job after a good build (SIGPIPE under pipefail); timeout-minutes must be a whole number"
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (third-party
# archives checked against pinned sha256 sums).
dependencies:
  - name: buildkit
    version: 0.4.0
    repository: file://../buildkit
  - name: control-plane
    version: 0.4.0
    repository: file://../control-plane
    condition: control-plane.enabled
  - name: gitlab-runner
    version: 0.93.0
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
