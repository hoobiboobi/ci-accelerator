# The ci-accelerator control plane: the controller, which reads every
# daemon's build history and the CI jobs' pods into its own store (SQLite
# on a volume), and the web, which serves the console (its pages and a
# read-only JSON API) on a ClusterIP Service.
#
# Without sign-in (signIn.enabled false, the default) the console shows
# everything to whoever reaches it: do not expose it outside the cluster.
# With it, each person signs in through GitLab.

# -- The switch the box uses (control-plane.enabled). Installed on its own,
# this chart ignores it.
enabled: false

# -- Name of the app (app.kubernetes.io/name). Default: control-plane.
nameOverride: ""
# -- Prefix of every object's name. Default: the release name, so objects
# are <release>-controller and <release>-web.
fullnameOverride: ""
# -- Labels for every object; they cannot override the chart's own labels.
commonLabels: {}

# The image of every role (controller, web, and the daemons' disk probe).
image:
  repository: ghcr.io/hoobiboobi/ci-accelerator
  # -- Default: v<appVersion>.
  tag: ""
  # -- When set, the image is pulled by digest (tag is kept for readability).
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

gitlab:
  # -- URLs of the GitLab instances whose jobs the runners take, exactly as the
  # runners have them (gitlabUrl, slash included): every build's trace id
  # carries a hash of that string.
  urls: []
  # -- Or read them from a ConfigMap key (comma-separated). Rendered with tpl.
  urlsFrom:
    configMap: ""
    key: urls
  # -- A token that can read the projects' jobs (read_api): a Secret's key.
  # The controller reads with it the pipelines' jobs (how long each waited
  # for a runner and ran, jobs of other runners) while the console's pages
  # are in use, once per finished pipeline; GitLab's comparison of two
  # commits, which settles "files or node"; and the end of a job's log on
  # request. Without it, job times come from the job pods and "files or
  # node" stays unclear. Not with sign-in: GitLab is then read with each
  # person's own token.
  token:
    existingSecret: ""
    key: token

# -- The runners' S3 cache (GitLab's cache: keyword): the controller lists
# its folders now and then, and the console shows each project's cache size
# and key count on the Nodes page, with a warning when the bucket has no
# lifecycle rule (the runners never delete a cache). Either the folders
# here (a Secret with the keys accesskey and secretkey per folder; keys
# that may only read are enough), or a ConfigMap with them as JSON (the
# box writes one). The controller may read only the Secrets named here.
caches:
  stores: []
  # - server: s3.example.com   # host[:port]
  #   bucket: ci-cache
  #   region: eu-1
  #   path: ci-accelerator/993196           # the runners' cache Path
  #   gitlabUrl: https://gitlab.com/         # exactly as the runners have it
  #   existingSecret: runner-cache-read
  #   insecure: false                        # true: plain http
  #   pathStyle: true                        # default: path style except AWS
  # -- Or the name of a ConfigMap whose key holds the list (fields server,
  # bucket, region, path, instance, secret, insecure, pathStyle); the Role
  # to read its Secrets is then the writer's to make. Rendered with tpl.
  fromConfigMap: ""
  # -- The ConfigMap's key with the list.
  key: caches.json
  # -- How often the folders are listed.
  every: 10m

# -- Sign-in through GitLab. Each person signs in with a GitLab the runners
# serve and sees the projects whose jobs GitLab lets them read (Reporter or
# more, or public pipelines); GitLab is read with their own token. GitLab
# never calls the console: the browser carries the redirects.
signIn:
  enabled: false
  # -- Where browsers reach the console: https (an Ingress or a gateway you
  # add), or http only on localhost (a port-forward). Default:
  # global.console.url. Rendered with tpl.
  url: ""
  # -- A Secret holding 32 random bytes in base64 (openssl rand -base64 32);
  # it seals each session's GitLab token. Changing it signs everyone out.
  sessionKey:
    existingSecret: ""
    key: key
  # -- One OAuth application per GitLab (User or Group Settings >
  # Applications, or Admin > Applications on your own GitLab):
  # confidential, scopes openid and read_api, redirect URI
  # <url>/auth/callback/<id> (the NOTES and the controller's log print it).
  #   url: exactly as the runners have it; may be left empty when the
  #        console serves one GitLab
  #   existingSecret: a Secret with the keys client-id and client-secret
  #   admins: GitLab usernames who see everything (builds of no known
  #        project, the JSON API)
  gitlab: []
  # - url: https://gitlab.com/
  #   existingSecret: console-gitlab-oauth
  #   admins: [alice]

daemons:
  # -- host:port of the BuildKit chart's headless Service; every address it
  # resolves to is a daemon. Rendered with tpl.
  discover: ""
  # -- Name in the daemons' certificate. Default: the host of discover.
  serverName: ""


# The certificates: the controller's client certificate for the daemons
# and its API's server certificate, both from the daemons' CA.
tls:
  # -- Secret with the controller's client certificate (ca.crt, tls.crt,
  # tls.key) signed by the daemons' CA; empty: issued by cert-manager.
  existingSecret: ""
  certManager:
    # -- Default: global.tls.issuerRef. Rendered with tpl.
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    duration: 8760h
    renewBeforePercentage: 33

jobs:
  # -- Namespace of the CI job pods, read for job names, pipelines and
  # commits. Empty: builds are kept without them. Rendered with tpl.
  namespace: ""
  # -- A Role and RoleBinding there that let the controller get, list and
  # watch pods. Without them, give that access some other way.
  rbac:
    create: true

retention:
  # -- Days builds are kept in full (steps, reasons). Each image's daily
  # figures (builds by outcome, build times) are kept a year regardless. At 150 pipelines a day
  # with 15 image builds each, a project takes about 0.25 GB per 30 days.
  days: 30
  # -- Days the steps' output is kept.
  outputDays: 7

# The roles' own logs (kubectl logs): one JSON object per line. Never in
# them: tokens, cookies, query strings, build arguments, step output.
log:
  # -- The least important events logged: error, warn, info (a line per
  # stored build, job start and end, routed connection, sign-in) or debug
  # (also every request, GitLab call and API call: for a while, to find
  # something out). Each role's logLevel overrides it.
  level: info
  # -- json, or text (key=value) for reading by eye.
  format: json

# The controller (Deployment <release>-controller, one pod): the store, the
# collector, the job-pod watch, the sessions and every GitLab token. The
# web reads it over its API.
controller:
  # -- The store. SQLite needs block storage (ReadWriteOnce): never NFS or
  # another shared file system. The claim <release>-controller-data is kept
  # when the release is removed.
  persistence:
    size: 10Gi
    storageClass: ""
    existingClaim: ""
  # The controller's API, which the web reads over HTTPS (Service
  # <release>-controller). Callers prove themselves with a ServiceAccount
  # token the controller checks with Kubernetes (TokenReview).
  api:
    # -- The API's port.
    port: 8443
    # -- Cluster domain in the API certificate's names.
    clusterDomain: cluster.local
    tls:
      # -- Secret with the API's server certificate (tls.crt, tls.key, and
      # ca.crt that it chains to) for the name <release>-controller;
      # empty: issued by cert-manager from the daemons' CA (server auth
      # only). Needed with tls.existingSecret.
      existingSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}
  # -- The controller's log level; empty: log.level.
  logLevel: ""

# The web (Deployment and Service <release>-web): the console's pages and
# its JSON API. It keeps nothing, so any number of its pods can run.
web:
  # -- Pods serving the pages.
  replicas: 2
  # -- The port of the pages and the JSON API.
  port: 8080
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}
  # -- The web's log level; empty: log.level.
  logLevel: ""

# The build router (DaemonSet on the build nodes and Service
# <release>-router): CI jobs connect to it instead of to the daemons'
# Service, and it sends each job to the daemon where its project built
# before, else to the project's daemon by a hash that every router agrees
# on, so the jobs of a pipeline share one daemon's cache and steps. It
# passes the bytes through: the job and the daemon keep their mutual TLS
# (the daemons' certificate must name the router's Service), the router
# holds no key. It knows a job by its pod's address; a connection from
# another pod goes to its own node's daemon.
router:
  # -- Run the router; default: global.router.enabled (the box sets it).
  # The runners then use tcp://<release>-router.<namespace>.svc:1234, and
  # the daemons' certificate must name that Service (the buildkit chart
  # does with global.router.service).
  enabled: null
  # -- The port of /livez and /readyz.
  healthPort: 8080
  # -- How the Service picks a router: PreferSameNode (the job's node, any
  # other when it has none ready), Local (the job's node only) or Cluster.
  routing: PreferSameNode
  # -- Keep a job's builds in its zone (topology.kubernetes.io/zone of the
  # daemons' nodes): a project then warms up once per zone. false: every
  # daemon is one zone (zones close enough that crossing them costs
  # nothing, or one zone label per node).
  zones: true
  # -- When no daemon of the job's zone is ready: true sends the job to
  # another zone's daemon, false refuses the connection.
  crossZone: true
  # -- Skip a daemon running this many builds when another one is free; 0:
  # never (a busy warm daemon is usually still faster than a cold one).
  overloadBuilds: 0
  # -- Days a build keeps its project warm on its node (at most
  # retention.days: older builds are gone).
  warmDays: 7
  # -- Seconds open connections (running builds) may finish when a router
  # stops; the pod's grace period is this plus preStopSleepSeconds and 10.
  drainSeconds: 300
  # -- Seconds a stopping router keeps accepting while the Service drops it.
  preStopSleepSeconds: 5
  # -- PriorityClass of the router pods; the box gives them the daemons'.
  priorityClassName: ""
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 256Mi
  # -- Merged over global.buildNodes.selector.
  nodeSelector: {}
  # -- Appended to global.buildNodes.tolerations.
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  # -- Namespaces whose pods may connect to the router; default: the jobs
  # namespace. Rendered with tpl.
  clientNamespaces: []
  # -- The router's log level; empty: log.level.
  logLevel: ""

# Who may connect. CI jobs and their builds (RUN steps share the daemons'
# network) run untrusted code in the same cluster, and without sign-in the
# console shows every project to whoever reaches it. Needs a CNI that
# enforces NetworkPolicy. kubectl port-forward keeps working.
networkPolicy:
  # -- Render the NetworkPolicies: the web admits connections from every
  # namespace except this one, the jobs namespace and deniedNamespaces, and
  # from pods of this namespace except deniedComponents; the controller
  # admits only the web and the routers; the routers admit only their
  # clients' namespaces. Only ingress is limited.
  enabled: false
  # -- More namespaces whose pods may not reach the web (the jobs namespace
  # is always one when jobs.namespace is set). Rendered with tpl.
  deniedNamespaces: []
  # -- Pods of this namespace whose ci-accelerator.io/component label is one
  # of these may not reach the web: the daemons, whose network every build
  # shares.
  deniedComponents:
    - buildkit
  # -- More NetworkPolicyPeer entries that may reach the web, e.g. an
  # ipBlock with the node addresses when the Ingress controller runs on the
  # host network.
  extraFrom: []

global:
  # The build router, shared with the buildkit chart (the box sets it).
  router:
    enabled: false
    # -- The router's Service, for the daemons' certificate; when set it
    # must be this chart's <prefix>-router. Rendered with tpl.
    service: ""
  # Dedicated build nodes (label and taint them before install); the router
  # runs there, next to the daemons and the CI jobs.
  buildNodes:
    # -- false: ignore selector/tolerations below and run on any Linux node.
    enabled: true
    selector:
      ci-accelerator.io/node-role: build
    tolerations:
      - key: ci-accelerator.io/node-role
        operator: Equal
        value: build
        effect: NoSchedule
  tls:
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
  console:
    # -- Where browsers reach the console; the default of signIn.url.
    url: ""
