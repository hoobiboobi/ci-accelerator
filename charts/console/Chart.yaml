apiVersion: v2
name: console
description: >-
  Collects the build history of BuildKit daemons and the CI jobs around it,
  and explains every build: what came from cache, what came from another
  job, and why a step was rebuilt.
type: application
version: 0.2.1
# The console image is released with the charts and tagged v<appVersion>.
appVersion: "0.2.1"
kubeVersion: ">=1.34.0-0"
home: https://github.com/hoobiboobi/ci-accelerator
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: console
      image: ghcr.io/hoobiboobi/ci-accelerator-console:v0.2.1
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/hoobiboobi/ci-accelerator#the-console
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
