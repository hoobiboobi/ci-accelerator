suite: the build router
templates:
  - router.yaml
  - controller.yaml
  - networkpolicy.yaml
values:
  - values/required.yaml
release:
  name: box
  namespace: ci-accelerator
set:
  router.enabled: true
  jobs.namespace: ci-jobs
tests:
  - it: is off unless enabled
    template: router.yaml
    set:
      router.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
  - it: needs the jobs namespace (it knows a job by its pod)
    template: controller.yaml
    set:
      jobs.namespace: ""
    asserts:
      - failedTemplate:
          errorPattern: the router knows each CI job by its pod
  - it: refuses the jobs' port for health
    template: controller.yaml
    set:
      router.healthPort: 1234
    asserts:
      - failedTemplate:
          errorPattern: router.healthPort must not be 1234
  - it: refuses a warmth window longer than builds are kept
    template: controller.yaml
    set:
      router.warmDays: 40
    asserts:
      - failedTemplate:
          errorPattern: router.warmDays \(40\) cannot exceed retention.days \(30\)
  - it: gives the controller the warmth window
    template: controller.yaml
    set:
      router.warmDays: 3
    asserts:
      - contains: { path: "spec.template.spec.containers[0].args", content: "-warm-for=72h" }
  - it: runs with global.router.enabled when router.enabled is not set
    template: router.yaml
    set:
      router.enabled: null
      global.router.enabled: true
    asserts:
      - hasDocuments: { count: 7 }
  - it: refuses a router Service name the daemons' certificate would not carry
    template: controller.yaml
    set:
      global.router.enabled: true
      global.router.service: other-router
    asserts:
      - failedTemplate:
          errorPattern: global.router.service \(other-router\) names another Service than the router's, box-router
  - it: accepts the router's own Service name
    template: controller.yaml
    set:
      global.router.enabled: true
      global.router.service: "{{ .Release.Name }}-router"
    asserts:
      - notFailedTemplate: {}

  - it: runs on every build node, passing the jobs through to the daemons
    template: router.yaml
    documentSelector: { path: kind, value: DaemonSet }
    asserts:
      - equal: { path: metadata.name, value: box-router }
      - equal: { path: 'spec.template.metadata.labels["ci-accelerator.io/component"]', value: router }
      - equal: { path: spec.template.spec.nodeSelector, value: { ci-accelerator.io/node-role: build, kubernetes.io/os: linux } }
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - router
            - -listen=:1234
            - -health=:8080
            - -daemons-service=buildkit-headless
            - -namespace=ci-accelerator
            - -daemon-port=1234
            - -jobs-namespace=ci-jobs
            - -gitlab-url=https://gitlab.example.com/
            - -controller=https://box-controller.ci-accelerator.svc:8443
            - -controller-ca=/api-tls/ca.crt
            - -token-file=/var/run/secrets/ci-accelerator/token
            - -zones=true
            - -cross-zone=true
            - -overload=0
            - -drain=300s
            - -log-level=info
            - -log-format=json
      # The pod's grace covers the drain: running builds finish.
      - equal: { path: spec.template.spec.terminationGracePeriodSeconds, value: 315 }
      - equal: { path: 'spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds', value: 5 }
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.httpGet.path', value: /readyz }
      - equal: { path: 'spec.template.spec.containers[0].env[0].valueFrom.fieldRef.fieldPath', value: spec.nodeName }
      # No key, no certificate: only the CA of the controller's API and a
      # token for the controller's audience.
      - equal: { path: 'spec.template.spec.volumes[0].secret.items', value: [{ key: ca.crt, path: ca.crt }] }
      - equal: { path: 'spec.template.spec.volumes[1].projected.sources[0].serviceAccountToken.audience', value: ci-accelerator-controller }
      - lengthEqual: { path: spec.template.spec.volumes, count: 2 }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: 'spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem', value: true }
  - it: follows the settings
    template: router.yaml
    documentSelector: { path: kind, value: DaemonSet }
    set:
      router.crossZone: false
      router.zones: false
      router.overloadBuilds: 6
      router.warmDays: 3
      router.drainSeconds: 1200
      router.preStopSleepSeconds: 0
      router.priorityClassName: builds
      router.nodeSelector: { pool: ci }
      router.tolerations: [{ key: x, operator: Exists }]
      gitlab.urlsFrom.configMap: urls
    asserts:
      - contains: { path: "spec.template.spec.containers[0].args", content: "-cross-zone=false" }
      - contains: { path: "spec.template.spec.containers[0].args", content: "-zones=false" }
      - contains: { path: "spec.template.spec.containers[0].args", content: "-overload=6" }
      - contains: { path: "spec.template.spec.containers[0].args", content: "-drain=1200s" }
      - equal: { path: spec.template.spec.terminationGracePeriodSeconds, value: 1210 }
      - notExists: { path: 'spec.template.spec.containers[0].lifecycle' }
      - equal: { path: spec.template.spec.priorityClassName, value: builds }
      - equal: { path: spec.template.spec.nodeSelector, value: { ci-accelerator.io/node-role: build, kubernetes.io/os: linux, pool: ci } }
      - lengthEqual: { path: spec.template.spec.tolerations, count: 2 }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GITLAB_URLS, valueFrom: { configMapKeyRef: { name: urls, key: urls } } }
  - it: runs on any Linux node when the build nodes are off
    template: router.yaml
    documentSelector: { path: kind, value: DaemonSet }
    set:
      global.buildNodes.enabled: false
    asserts:
      - equal: { path: spec.template.spec.nodeSelector, value: { kubernetes.io/os: linux } }
      - notExists: { path: spec.template.spec.tolerations }

  - it: serves the jobs from their own node by default
    template: router.yaml
    documentSelector: { path: kind, value: Service }
    asserts:
      - equal: { path: metadata.name, value: box-router }
      - equal: { path: spec.trafficDistribution, value: PreferSameNode }
      - equal: { path: spec.internalTrafficPolicy, value: Cluster }
      - equal: { path: 'spec.ports[0].appProtocol', value: tls }
      - equal: { path: 'spec.selector["app.kubernetes.io/component"]', value: router }
  - it: keeps a job on its own node with Local
    template: router.yaml
    documentSelector: { path: kind, value: Service }
    set:
      router.routing: Local
    asserts:
      - equal: { path: spec.internalTrafficPolicy, value: Local }
      - notExists: { path: spec.trafficDistribution }

  - it: may read EndpointSlices of the daemons' namespace only
    template: router.yaml
    documentIndex: 3
    asserts:
      - isKind: { of: Role }
      - equal: { path: metadata.name, value: box-router-daemons }
      - equal: { path: metadata.namespace, value: ci-accelerator }
      - equal: { path: rules, value: [{ apiGroups: [discovery.k8s.io], resources: [endpointslices], verbs: [get, list, watch] }] }
  - it: may read the jobs namespace's pods only
    template: router.yaml
    documentIndex: 5
    asserts:
      - isKind: { of: Role }
      - equal: { path: metadata.name, value: box-router-jobs }
      - equal: { path: metadata.namespace, value: ci-jobs }
      - equal: { path: rules, value: [{ apiGroups: [""], resources: [pods], verbs: [get, list, watch] }] }

  - it: lets the routers call the controller
    template: controller.yaml
    asserts:
      - contains: { path: "spec.template.spec.containers[0].args", content: "-api-allow-router=ci-accelerator/box-router" }
  - it: lets no router call the controller without the router
    template: controller.yaml
    set:
      router.enabled: false
    asserts:
      - notContains: { path: "spec.template.spec.containers[0].args", content: "-api-allow-router=ci-accelerator/box-router" }
  - it: admits the routers to the controller's API and the jobs to the routers
    template: networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].from
          content: { podSelector: { matchLabels: { app.kubernetes.io/name: control-plane, app.kubernetes.io/instance: box, app.kubernetes.io/component: router } } }
        documentSelector: { path: metadata.name, value: box-controller }
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchExpressions[0].values
          value: [ci-jobs]
        documentSelector: { path: metadata.name, value: box-router }
      - equal: { path: 'spec.ingress[0].ports', value: [{ port: tcp, protocol: TCP }] }
        documentSelector: { path: metadata.name, value: box-router }
  - it: admits the namespaces named instead
    template: networkpolicy.yaml
    documentSelector: { path: metadata.name, value: box-router }
    set:
      networkPolicy.enabled: true
      router.clientNamespaces: ["{{ .Release.Namespace }}-builds", other]
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchExpressions[0].values
          value: [ci-accelerator-builds, other]
