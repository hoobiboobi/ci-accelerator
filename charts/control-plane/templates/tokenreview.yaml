{{- $name := printf "%s-%s-tokenreview" .Release.Namespace (include "control-plane.controllerName" .) }}
# The controller asks Kubernetes whose ServiceAccount token a caller of its
# API sent (TokenReview): nothing else cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "control-plane.labels" (dict "root" . "role" "controller") | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "control-plane.labels" (dict "root" . "role" "controller") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "control-plane.controllerName" . }}
    namespace: {{ .Release.Namespace }}
