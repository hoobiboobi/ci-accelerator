# Values fragment for the official gitlab-runner Helm chart that sends CI jobs
# to the buildkit daemons of this project. Tested with chart 0.93.0 and
# runner 19.4.1 (see README.md next to this file).
#
#   helm upgrade --install gitlab-runner gitlab-runner \
#     --repo https://charts.gitlab.io --version 0.93.0 \
#     -n ci-accelerator -f integrations/gitlab-runner/values.yaml -f my-values.yaml
#
# Replace the names marked ADJUST if your buildkit release is not
# "ci-accelerator" in namespace "ci-accelerator" with jobs in
# "ci-accelerator-jobs". runners.config is one TOML string: Helm does not
# merge it with yours, so keep every line below if you write your own.

# 19.4.0 lists pod events on every poll and overloaded API servers; 19.4.1
# fixes that. The chart 0.93.0 default would be 19.4.0.
image:
  tag: alpine-v19.4.1

# ADJUST: your GitLab.
gitlabUrl: https://gitlab.example.com/

runners:
  # ADJUST: a Secret in the runner's namespace with the runner authentication
  # token (runner-token: glrt-...) and an empty runner-registration-token key
  # (the chart mounts both).
  secret: gitlab-runner-token
  # Job pods run untrusted code: keep them out of the namespace of the
  # runner and the daemons. Its Pod Security level can be "baseline".
  # ADJUST.
  jobNamespace: ci-accelerator-jobs
  # Optional S3 cache for `cache:` in .gitlab-ci.yml (the box does this with
  # gitlab-runner.runners.cache). A Secret with the keys accesskey and
  # secretkey, mounted by the chart:
  # cache:
  #   secretName: runner-cache
  # then, at the end of config below (ADJUST the names):
  #   [runners.cache]
  #     Type = "s3"
  #     Path = "ci-accelerator/<first 6 hex of sha256 of the GitLab URL>"
  #     Shared = true
  #     MaxUploadedArchiveSize = 4831838208
  #     [runners.cache.s3]
  #       ServerAddress = "s3.example.com"
  #       BucketName = "ci-cache"
  #       BucketLocation = "eu-1"
  # and "TRANSFER_METER_FREQUENCY=5s" in environment, so job logs show the
  # cache's size. See docs/runner-cache.md (lifecycle rule, layout).
  config: |
    [[runners]]
      # The contract with the CI component: where the daemons are and where
      # the client certificate is mounted. Job variables of the same name
      # override these.
      # ADJUST: tcp://<buildkit fullname>.<buildkit namespace>.svc:1234
      environment = [
        "BUILDKIT_REMOTE_ADDR=tcp://ci-accelerator-buildkit.ci-accelerator.svc:1234",
        "BUILDKIT_TLS_DIR=/certs",
        # ADJUST: with the console, its address, so each job prints its page:
        # "CI_ACCELERATOR_CONSOLE_URL=https://console.example.com",
      ]
      # Every job gets its own trace, without changes to .gitlab-ci.yml:
      # buildctl reads TRACEPARENT. trace-id = scheme 01, 3 bytes for this
      # GitLab (from gitlabUrl), the pipeline id and the job id (6 bytes each);
      # span-id = the job id. A job's trace is found from its ids, a pipeline's
      # traces by the ci.pipeline.id attribute. Ids outside 1..2^48-1 or not
      # numbers set nothing; a job's own TRACEPARENT is kept.
      pre_build_script = '''
      # ci-accelerator: one trace per job (scheme 01: GitLab, pipeline, job)
      if [ -z "${TRACEPARENT:-}" ] && [ "${CI_PIPELINE_ID:-x}" -gt 0 ] 2>/dev/null && [ "${CI_JOB_ID:-x}" -gt 0 ] 2>/dev/null && [ "$CI_PIPELINE_ID" -le 281474976710655 ] && [ "$CI_JOB_ID" -le 281474976710655 ]; then
        export TRACEPARENT="00-01{{ .Values.gitlabUrl | sha256sum | trunc 6 }}$(printf '%012x%012x' "$CI_PIPELINE_ID" "$CI_JOB_ID")-$(printf '%016x' "$CI_JOB_ID")-01"
      fi
      export OTEL_RESOURCE_ATTRIBUTES="${OTEL_RESOURCE_ATTRIBUTES:+$OTEL_RESOURCE_ATTRIBUTES,}ci.pipeline.id=${CI_PIPELINE_ID:-},ci.job.id=${CI_JOB_ID:-},ci.project.path=${CI_PROJECT_PATH:-}"
      # ci-accelerator: this job's page in the console, when its address is set
      if [ -n "${CI_ACCELERATOR_CONSOLE_URL:-}" ] && [ "${CI_JOB_ID:-x}" -gt 0 ] 2>/dev/null; then
        echo "ci-accelerator: why this job's builds take their time: ${CI_ACCELERATOR_CONSOLE_URL%/}/jobs/{{ .Values.gitlabUrl | sha256sum | trunc 6 }}/$CI_JOB_ID"
      fi
      '''
      [runners.kubernetes]
        namespace = "{{ default .Release.Namespace .Values.runners.jobNamespace }}"
        image = "alpine:3.22"
        pull_policy = "if-not-present"
        # The job only drives buildctl; the build runs in the daemon.
        cpu_request = "50m"
        memory_request = "64Mi"
        memory_limit = "512Mi"
        helper_cpu_request = "10m"
        helper_memory_request = "32Mi"
        helper_memory_limit = "256Mi"
        service_cpu_request = "10m"
        service_memory_request = "32Mi"
        # Jobs run untrusted code: no Kubernetes API token in their pods.
        automount_service_account_token = false
        # On the build nodes, next to a daemon: the buildkit Service prefers
        # the daemon on the client's node, whose cache is warm.
        # The executor picks the helper image's architecture from
        # kubernetes.io/arch here and assumes amd64 without it, so jobs on
        # arm64 nodes would fail to pull it. ADJUST: arm64 build nodes.
        [runners.kubernetes.node_selector]
          "ci-accelerator.io/node-role" = "build"
          "kubernetes.io/arch" = "amd64"
        [runners.kubernetes.node_tolerations]
          "ci-accelerator.io/node-role=build" = "NoSchedule"
        [runners.kubernetes.pod_labels]
          "ci-accelerator.io/component" = "ci-job"
        # Job data from GitLab's CI variables on the job pod, for tools that
        # show builds by pipeline and job (the runner adds the job id, name,
        # URL, ref, commit and project id itself). An unset variable gives an
        # empty value; values are expanded once, never as templates.
        [runners.kubernetes.pod_annotations]
          "ci-accelerator.io/pipeline-id" = "$CI_PIPELINE_ID"
          "ci-accelerator.io/pipeline-source" = "$CI_PIPELINE_SOURCE"
          "ci-accelerator.io/pipeline-created-at" = "$CI_PIPELINE_CREATED_AT"
          "ci-accelerator.io/project-path" = "$CI_PROJECT_PATH"
          "ci-accelerator.io/job-stage" = "$CI_JOB_STAGE"
          "ci-accelerator.io/job-started-at" = "$CI_JOB_STARTED_AT"
          "ci-accelerator.io/commit-title" = "$CI_COMMIT_TITLE"
          "ci-accelerator.io/commit-author" = "$CI_COMMIT_AUTHOR"
          "ci-accelerator.io/merge-request-iid" = "$CI_MERGE_REQUEST_IID"
        # The client certificate cert-manager issues into the jobs namespace
        # (buildkit chart: tls.client.namespaces).
        # ADJUST: <buildkit fullname>-client
        [[runners.kubernetes.volumes.secret]]
          name = "ci-accelerator-buildkit-client"
          mount_path = "/certs"
          read_only = true

# The chart's default Role grants everything on core resources in the jobs
# namespace. These are the permissions the Kubernetes executor needs with its
# default feature flags (docs: executors/kubernetes, "Configure runner API
# permissions"); the chart creates them in runners.jobNamespace.
rbac:
  create: true
  rules:
    - resources: ["pods"]
      verbs: ["create", "delete", "get", "list", "watch"]
    - resources: ["pods/attach", "pods/exec"]
      verbs: ["create", "delete", "get", "patch"]
    - resources: ["pods/log"]
      verbs: ["get", "list"]
    - resources: ["secrets"]
      verbs: ["create", "delete", "get", "update"]
    - resources: ["serviceaccounts"]
      verbs: ["get"]
    - resources: ["services"]
      verbs: ["create", "get"]
    - resources: ["events"]
      verbs: ["list"]
