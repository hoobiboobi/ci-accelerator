suite: services
templates:
  - service.yaml
values:
  - values/tls.yaml
release:
  name: bk
  namespace: ci-accelerator
tests:
  - it: exposes grpc on 1234 as ClusterIP by default
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: bk-buildkit
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - name: grpc
              port: 1234
              targetPort: grpc
              protocol: TCP
              appProtocol: tls

  # Own node's daemon (warm cache), and another node's daemon instead of a
  # failed build when it is not ready.
  - it: prefers the same node with fallback by default
    documentIndex: 0
    asserts:
      - equal:
          path: spec.trafficDistribution
          value: PreferSameNode
      - equal:
          path: spec.internalTrafficPolicy
          value: Cluster

  # Local silently overrides trafficDistribution, so never render both.
  - it: renders strict node-local routing without trafficDistribution
    documentIndex: 0
    set:
      service.routing: Local
    asserts:
      - equal:
          path: spec.internalTrafficPolicy
          value: Local
      - notExists:
          path: spec.trafficDistribution

  - it: renders plain cluster-wide routing
    documentIndex: 0
    set:
      service.routing: Cluster
    asserts:
      - equal:
          path: spec.internalTrafficPolicy
          value: Cluster
      - notExists:
          path: spec.trafficDistribution

  - it: does not set externalTrafficPolicy or a node port on ClusterIP
    documentIndex: 0
    set:
      service.nodePort: 31234
    asserts:
      - notExists:
          path: spec.externalTrafficPolicy
      - notExists:
          path: spec.ports[0].nodePort

  - it: renders a fixed NodePort with its external policy
    documentIndex: 0
    set:
      service.type: NodePort
      service.nodePort: 31234
      service.externalTrafficPolicy: Local
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 31234
      - equal:
          path: spec.externalTrafficPolicy
          value: Local

  - it: lets Kubernetes pick the node port when unset
    documentIndex: 0
    set:
      service.type: NodePort
    asserts:
      - notExists:
          path: spec.ports[0].nodePort

  - it: rejects an unknown routing mode
    set:
      service.routing: Sticky
    asserts:
      - failedTemplate:
          errorPattern: routing

  - it: passes Service annotations through
    documentIndex: 0
    set:
      service.annotations:
        example.com/lb: internal
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/lb: internal

  - it: always creates the headless discovery Service on the container port
    documentIndex: 1
    set:
      service.port: 4321
    asserts:
      - equal:
          path: metadata.name
          value: bk-buildkit-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports
          value:
            - name: grpc
              port: 1234
              targetPort: grpc
              protocol: TCP
              appProtocol: tls

  # Service names are DNS labels: at most 63 characters.
  - it: keeps the headless Service name valid for long release names
    documentIndex: 1
    release:
      name: a-very-long-release-name-for-a-shared-build-farm-xyz
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
      - matchRegex:
          path: metadata.name
          pattern: '-headless$'

  - it: selects only this release's daemons
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: buildkit
            app.kubernetes.io/instance: bk
