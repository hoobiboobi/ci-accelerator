apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 0.2.4
# The box's own version (its console); the daemons' BuildKit version is in charts/buildkit.
appVersion: "0.2.4"
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.33.1
    - name: console
      image: ghcr.io/hoobiboobi/ci-accelerator-console:v0.2.4
      platforms:
        - linux/amd64
        - linux/arm64
    - name: gitlab-runner
      image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.4.1
  artifacthub.io/links: |
    - name: Website and documentation
      url: https://ci-accelerator.io/docs/
    - name: Try it on one machine
      url: https://ci-accelerator.io/docs/#try-it-on-one-machine
    - name: GitOps (Flux, Argo CD)
      url: https://ci-accelerator.io/docs/gitops/
    - name: Changelog
      url: https://ci-accelerator.io/changelog/
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
  # The release's changes, for Artifact Hub's version page; rewrite with each release (docs/releasing.md).
  artifacthub.io/changes: |
    - kind: fixed
      description: A rebuild caused by a commit is no longer blamed on the build farm when the file-reading step was deduplicated, cached or in another stage (COPY --from); the engine follows the whole ancestor cone and GitLab's commit comparison verifies it
    - kind: fixed
      description: A parallel job or retry of the same pipeline never counts as "the previous build", and a sibling's cache hit written by the same pipeline never counts as proof that files did not change
    - kind: fixed
      description: The console names a file as changed only when GitLab's comparison verified it, and never claims "another node" for a rebuild whose previous build ran on the same daemon
    - kind: fixed
      description: The Overview's "build farm" and the Nodes page's per-node counter use one definition and can no longer disagree
    - kind: fixed
      description: A chart release alone no longer restarts every daemon (the disk probe's default image tag is pinned instead of following the chart version)
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (third-party
# archives checked against pinned sha256 sums).
dependencies:
  - name: buildkit
    version: 0.2.4
    repository: file://../buildkit
  - name: console
    version: 0.2.4
    repository: file://../console
    condition: console.enabled
  - name: gitlab-runner
    version: 0.93.0
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
