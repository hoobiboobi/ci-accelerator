suite: preflight
templates:
  - daemonset.yaml
values:
  - values/tls.yaml
release:
  name: bk
  namespace: builds
# Namespace and Node are cluster-scoped; the fake client needs their mapping.
kubernetesProvider:
  scheme:
    "v1/Namespace":
      gvr:
        version: v1
        resource: namespaces
      namespaced: false
    "v1/Node":
      gvr:
        version: v1
        resource: nodes
      namespaced: false
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
tests:
  # On kind a baseline namespace gave "STATUS: deployed" and 0 pods.
  - it: fails early in a namespace that enforces baseline
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: builds
            labels:
              pod-security.kubernetes.io/enforce: baseline
    asserts:
      - failedTemplate:
          errorPattern: 'namespace "builds" enforces Pod Security level "baseline".*pod-security.kubernetes.io/enforce=privileged'

  - it: fails early in a namespace that enforces restricted
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: builds
            labels:
              pod-security.kubernetes.io/enforce: restricted
    asserts:
      - failedTemplate:
          errorPattern: 'level "restricted"'

  - it: installs into a privileged namespace
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: builds
            labels:
              pod-security.kubernetes.io/enforce: privileged
        - apiVersion: v1
          kind: Node
          metadata:
            name: build-1
            labels:
              kubernetes.io/os: linux
              ci-accelerator.io/node-role: build
    asserts:
      - isKind:
          of: DaemonSet

  # No enforce label: the cluster-wide default applies, which a chart cannot
  # read. Do not guess (NOTES warns instead).
  - it: does not block a namespace without an enforce label
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: builds
            labels:
              pod-security.kubernetes.io/warn: baseline
        - apiVersion: v1
          kind: Node
          metadata:
            name: build-1
            labels:
              kubernetes.io/os: linux
              ci-accelerator.io/node-role: build
    asserts:
      - isKind:
          of: DaemonSet

  # helm template / GitOps: lookup returns nothing.
  - it: renders when nothing can be looked up
    asserts:
      - isKind:
          of: DaemonSet

  - it: can skip the Pod Security check
    set:
      preflight.podSecurity: false
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: builds
            labels:
              pod-security.kubernetes.io/enforce: baseline
        - apiVersion: v1
          kind: Node
          metadata:
            name: build-1
            labels:
              kubernetes.io/os: linux
              ci-accelerator.io/node-role: build
    asserts:
      - isKind:
          of: DaemonSet

  # helm install --wait reported success with zero daemons when no node was
  # labelled.
  - it: fails when no node matches the build-node selector
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Node
          metadata:
            name: worker-1
            labels:
              kubernetes.io/os: linux
    asserts:
      - failedTemplate:
          errorPattern: 'no node matches the build-node selector .*ci-accelerator.io/node-role.*so no daemon would run'

  - it: requires every selector label on the same node
    set:
      nodeSelector:
        kubernetes.io/arch: arm64
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Node
          metadata:
            name: worker-1
            labels:
              kubernetes.io/os: linux
              kubernetes.io/arch: amd64
              ci-accelerator.io/node-role: build
    asserts:
      - failedTemplate:
          errorPattern: 'no node matches the build-node selector'

  - it: passes when a node carries every selector label
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Node
          metadata:
            name: worker-1
            labels:
              kubernetes.io/os: linux
        - apiVersion: v1
          kind: Node
          metadata:
            name: worker-2
            labels:
              kubernetes.io/os: linux
              ci-accelerator.io/node-role: build
    asserts:
      - isKind:
          of: DaemonSet

  - it: does not check nodes when build nodes are switched off
    set:
      global.buildNodes.enabled: false
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Node
          metadata:
            name: windows-1
            labels:
              kubernetes.io/os: windows
    asserts:
      - isKind:
          of: DaemonSet

  - it: can skip the build-node check
    set:
      preflight.buildNodes: false
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Node
          metadata:
            name: worker-1
            labels:
              kubernetes.io/os: linux
    asserts:
      - isKind:
          of: DaemonSet

  # `kubectl create secret tls` writes no ca.crt: the pods would hang in
  # ContainerCreating with the reason only in their events. (The node check is
  # off in these tests: the fake client cannot list a kind it has no object
  # of.)
  - it: refuses a TLS Secret without ca.crt and shows the command that makes one
    set:
      preflight.buildNodes: false
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: bk-tls
            namespace: builds
          data:
            tls.crt: eA==
            tls.key: eA==
    asserts:
      - failedTemplate:
          errorPattern: 'Secret builds/bk-tls \(tls.existingSecret\) has no ca.crt\..*kubectl create secret generic bk-tls -n builds --from-file=tls.crt --from-file=tls.key --from-file=ca.crt'

  - it: lists every missing TLS key
    set:
      preflight.buildNodes: false
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bk-tls
            namespace: builds
          data:
            ca.crt: eA==
    asserts:
      - failedTemplate:
          errorPattern: 'has no tls.crt, tls.key\.'

  - it: accepts a TLS Secret with all three keys
    set:
      preflight.buildNodes: false
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bk-tls
            namespace: builds
          data:
            tls.crt: eA==
            tls.key: eA==
            ca.crt: eA==
    asserts:
      - isKind:
          of: DaemonSet

  # It may be created after the chart (GitOps, external secret operators);
  # the pods wait for it.
  - it: accepts a TLS Secret that does not exist yet
    set:
      preflight.buildNodes: false
    asserts:
      - isKind:
          of: DaemonSet

  - it: does not look at Secrets in other namespaces
    set:
      preflight.buildNodes: false
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bk-tls
            namespace: elsewhere
          data:
            tls.crt: eA==
    asserts:
      - isKind:
          of: DaemonSet

  - it: can skip the TLS Secret check
    set:
      preflight.buildNodes: false
      preflight.tlsSecret: false
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bk-tls
            namespace: builds
          data:
            tls.crt: eA==
    asserts:
      - isKind:
          of: DaemonSet
