# The box: buildkit daemons on the build nodes and a gitlab-runner whose CI
# jobs use them. Set gitlab-runner.gitlabUrl and gitlab-runner.runners.secret;
# everything else has working defaults. cert-manager must be installed (the
# daemons and jobs authenticate each other with certificates it issues).

# Shared with the subcharts.
global:
  # -- Dedicated build nodes: the daemons and the CI job pods run there, so a
  # job reaches the daemon (and the cache) on its own node. Label and taint
  # them before install.
  buildNodes:
    enabled: true
    selector:
      ci-accelerator.io/node-role: build
    tolerations:
      - key: ci-accelerator.io/node-role
        operator: Equal
        value: build
        effect: NoSchedule
  tls:
    # -- cert-manager issuer for daemon and client certificates. Empty name:
    # a CA dedicated to this release is created (see buildkit.tls).
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
  jobs:
    # -- Namespace of the CI job pods. They run untrusted code, so they get
    # their own namespace, apart from the runner and the daemons. Keep
    # gitlab-runner.runners.jobNamespace equal to it.
    namespace: ci-accelerator-jobs
    # -- CPU architecture of the build nodes (kubernetes.io/arch). The
    # runner picks its helper image by it.
    architecture: amd64
  console:
    # -- The console's address as users reach it (https://...). When set,
    # every job prints the link to its page in its log. Empty: no link.
    url: ""

# Install-time checks against the live cluster. Skipped by `helm template`
# and by GitOps tools that render offline.
preflight:
  # -- Fail if gitlab-runner.runners.secret exists but lacks a key the
  # runner chart mounts (runner-token, and runner-registration-token, which
  # may be empty), or if runner-token does not look like a token (e.g. a
  # copied placeholder). A Secret that does not exist yet is not an error.
  # Needs read access to Secrets in the release namespace.
  runnerSecret: true

# The jobs namespace, created by this release (and deleted with it, together
# with everything in it).
jobsNamespace:
  # -- false: the namespace exists already (or GitOps creates it); it needs
  # the client certificate (issued here) and Pod Security "baseline".
  create: true
  # -- Pod Security level enforced for the job pods.
  podSecurity: baseline

# The daemons: charts/buildkit, see its values for everything else.
buildkit:
  tls:
    client:
      # The client certificate goes into the jobs namespace.
      namespaces:
        - "{{ .Values.global.jobs.namespace }}"
  # Clients only from the jobs namespace; builds never reach cloud
  # metadata. List the cluster's pod and Service CIDRs in
  # networkPolicy.egress.clusterCIDRs to keep builds out of the cluster.
  networkPolicy:
    enabled: true
    ingress:
      # The console (console.enabled) reads the daemons' build history.
      extraFrom:
        - podSelector:
            matchLabels:
              ci-accelerator.io/component: console
    egress:
      # The metrics and traces storage of this release stays reachable when
      # clusterCIDRs are listed.
      extraRules:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: "{{ .Release.Name }}"
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [victoria-metrics-single, vt-single]
          ports:
            - port: 8428
              protocol: TCP
            - port: 10428
              protocol: TCP
  # Metrics and traces of every daemon go to this release's VictoriaMetrics
  # and VictoriaTraces. With either switched off, point the endpoint at your
  # own OTLP backend or set it to "".
  otel:
    metricsEndpoint: 'http://{{ include "ci-accelerator.vmService" . }}.{{ .Release.Namespace }}.svc:8428/opentelemetry/v1/metrics'
    tracesEndpoint: 'http://{{ include "ci-accelerator.vtService" . }}.{{ .Release.Namespace }}.svc:10428/insert/opentelemetry/v1/traces'

# The official gitlab-runner chart. Set enabled=false to keep your own
# runner and use integrations/gitlab-runner/values.yaml with it instead.
gitlab-runner:
  enabled: true
  # 19.4.0 (the chart's default) lists pod events on every poll and
  # overloaded API servers; 19.4.1 fixes that.
  image:
    tag: alpine-v19.4.1
  # -- Required: your GitLab, e.g. https://gitlab.example.com/
  gitlabUrl: ""
  runners:
    # -- Required: a Secret in this release's namespace with the runner
    # authentication token (runner-token: glrt-...) and an empty
    # runner-registration-token key.
    secret: ""
    # -- Keep equal to global.jobs.namespace.
    jobNamespace: ci-accelerator-jobs
    # The same job settings as integrations/gitlab-runner/values.yaml, with
    # the names filled in from this release (make validate compares them).
    # Rendered by the runner chart with tpl, which sees this chart's helpers.
    config: |
      [[runners]]
        environment = [
          "BUILDKIT_REMOTE_ADDR=tcp://{{ include "ci-accelerator.buildkitName" . }}.{{ .Release.Namespace }}.svc:1234",
          "BUILDKIT_TLS_DIR=/certs",
          {{- with dig "console" "url" "" .Values.global }}
          "CI_ACCELERATOR_CONSOLE_URL={{ . }}",
          {{- end }}
        ]
        # Every job gets its own trace, without changes to .gitlab-ci.yml:
        # buildctl reads TRACEPARENT. trace-id = scheme 01, 3 bytes for this
        # GitLab (from gitlabUrl), the pipeline id and the job id (6 bytes each);
        # span-id = the job id. A job's trace is found from its ids, a pipeline's
        # traces by the ci.pipeline.id attribute. Ids outside 1..2^48-1 or not
        # numbers set nothing; a job's own TRACEPARENT is kept.
        pre_build_script = '''
        # ci-accelerator: one trace per job (scheme 01: GitLab, pipeline, job)
        if [ -z "${TRACEPARENT:-}" ] && [ "${CI_PIPELINE_ID:-x}" -gt 0 ] 2>/dev/null && [ "${CI_JOB_ID:-x}" -gt 0 ] 2>/dev/null && [ "$CI_PIPELINE_ID" -le 281474976710655 ] && [ "$CI_JOB_ID" -le 281474976710655 ]; then
          export TRACEPARENT="00-01{{ .Values.gitlabUrl | sha256sum | trunc 6 }}$(printf '%012x%012x' "$CI_PIPELINE_ID" "$CI_JOB_ID")-$(printf '%016x' "$CI_JOB_ID")-01"
        fi
        export OTEL_RESOURCE_ATTRIBUTES="${OTEL_RESOURCE_ATTRIBUTES:+$OTEL_RESOURCE_ATTRIBUTES,}ci.pipeline.id=${CI_PIPELINE_ID:-},ci.job.id=${CI_JOB_ID:-},ci.project.path=${CI_PROJECT_PATH:-}"
        # ci-accelerator: this job's page in the console, when its address is set
        if [ -n "${CI_ACCELERATOR_CONSOLE_URL:-}" ] && [ "${CI_JOB_ID:-x}" -gt 0 ] 2>/dev/null; then
          echo "ci-accelerator: why this job's builds take their time: ${CI_ACCELERATOR_CONSOLE_URL%/}/jobs/{{ .Values.gitlabUrl | sha256sum | trunc 6 }}/$CI_JOB_ID"
        fi
        '''
        [runners.kubernetes]
          namespace = "{{ .Values.global.jobs.namespace }}"
          image = "alpine:3.22"
          pull_policy = "if-not-present"
          cpu_request = "50m"
          memory_request = "64Mi"
          memory_limit = "512Mi"
          helper_cpu_request = "10m"
          helper_memory_request = "32Mi"
          helper_memory_limit = "256Mi"
          service_cpu_request = "10m"
          service_memory_request = "32Mi"
          automount_service_account_token = false
          [runners.kubernetes.node_selector]
          {{- with include "ci-accelerator.runnerNodeSelector" . | trim }}{{ . | nindent 6 }}{{ end }}
          [runners.kubernetes.node_tolerations]
          {{- with include "ci-accelerator.runnerTolerations" . | trim }}{{ . | nindent 6 }}{{ end }}
          [runners.kubernetes.pod_labels]
            "ci-accelerator.io/component" = "ci-job"
          # Job data from GitLab's CI variables on the job pod, for tools that
          # show builds by pipeline and job (the runner adds the job id, name,
          # URL, ref, commit and project id itself). An unset variable gives an
          # empty value; values are expanded once, never as templates.
          [runners.kubernetes.pod_annotations]
            "ci-accelerator.io/pipeline-id" = "$CI_PIPELINE_ID"
            "ci-accelerator.io/pipeline-source" = "$CI_PIPELINE_SOURCE"
            "ci-accelerator.io/pipeline-created-at" = "$CI_PIPELINE_CREATED_AT"
            "ci-accelerator.io/project-path" = "$CI_PROJECT_PATH"
            "ci-accelerator.io/job-stage" = "$CI_JOB_STAGE"
            "ci-accelerator.io/job-started-at" = "$CI_JOB_STARTED_AT"
            "ci-accelerator.io/commit-title" = "$CI_COMMIT_TITLE"
            "ci-accelerator.io/commit-author" = "$CI_COMMIT_AUTHOR"
            "ci-accelerator.io/merge-request-iid" = "$CI_MERGE_REQUEST_IID"
          [[runners.kubernetes.volumes.secret]]
            name = "{{ include "ci-accelerator.buildkitName" . }}-client"
            mount_path = "/certs"
            read_only = true
  # The permissions the Kubernetes executor needs in the jobs namespace,
  # instead of the chart's default `*` on core resources.
  rbac:
    create: true
    rules:
      - resources: ["pods"]
        verbs: ["create", "delete", "get", "list", "watch"]
      - resources: ["pods/attach", "pods/exec"]
        verbs: ["create", "delete", "get", "patch"]
      - resources: ["pods/log"]
        verbs: ["get", "list"]
      - resources: ["secrets"]
        verbs: ["create", "delete", "get", "update"]
      - resources: ["serviceaccounts"]
        verbs: ["get"]
      - resources: ["services"]
        verbs: ["create", "get"]
      - resources: ["events"]
        verbs: ["list"]

# Metrics storage (VictoriaMetrics single, v1.153.0). Daemons push over
# OTLP; nothing is scraped. Look at it with
#   kubectl port-forward svc/<release>-victoria-metrics-single-server 8428
# and http://localhost:8428/vmui. Counters arrive as deltas: query them with
# sum_over_time, not rate. Builds can reach it (see NOTES).
victoria-metrics-single:
  enabled: true
  # No scrape configuration, so no cluster-wide RBAC for service discovery
  # and no API token in the pod.
  rbac:
    create: false
  serviceAccount:
    automountToken: false
  server:
    # Pinned to the v1.153.0 index digest (2026-10-18).
    image:
      tag: v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd
    # -- How long metrics are kept (the chart's unit is months without a
    # suffix).
    retentionPeriod: 30d
    persistentVolume:
      size: 16Gi

# Traces storage (VictoriaTraces). Look at it with
#   kubectl port-forward svc/<release>-vt-single-server 10428
# and http://localhost:10428/select/vmui (Jaeger API under /select/jaeger).
victoria-traces-single:
  enabled: true
  server:
    # v0.12.0 instead of the chart's v0.11.0: it makes the delete and
    # internal endpoints POST-only (SSRF fix) and ships the trace UI.
    # Pinned to the index digest (2026-10-18).
    image:
      tag: v0.12.0@sha256:80919fcc85cc6dd87f598d20ccf42d0ab1120de8f25d4dcf08c5ea2515a496ba
    # -- How long traces are kept.
    retentionPeriod: 14d
    persistentVolume:
      size: 10Gi

# The console: reads every daemon's build history and the CI job pods, and
# explains each build. Preview: off by default, no sign-in yet (its API is a
# ClusterIP Service only). See charts/console for every value.
console:
  enabled: false
  # The runner's GitLab URL, from a ConfigMap this chart writes.
  gitlab:
    urlsFrom:
      configMap: '{{ .Release.Name }}-console-gitlab'
  daemons:
    discover: '{{ include "ci-accelerator.buildkitHeadless" . }}.{{ .Release.Namespace }}.svc:1234'
  tls:
    # With buildkit.tls.source=existingSecret, set console.tls.existingSecret
    # (a client certificate from the daemons' CA).
    existingSecret: ""
    certManager:
      issuerRef:
        name: '{{ include "ci-accelerator.issuerName" . }}'
  jobs:
    namespace: '{{ .Values.global.jobs.namespace }}'
