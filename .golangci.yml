# golangci-lint v2 (make go-lint): the analyzers that find bugs and dead
# code. errcheck is off for now: of its 50 findings (2026-11-09) almost all
# are deferred Close and Rollback calls whose errors change nothing.
# staticcheck's quick fixes (QF) are refactoring suggestions, not findings.
version: "2"
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*"]
