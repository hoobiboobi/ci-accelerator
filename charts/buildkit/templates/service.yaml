{{- $svc := .Values.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "buildkit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkit.labels" . | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  selector:
    {{- include "buildkit.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ int64 $svc.port }}
      targetPort: grpc
      protocol: TCP
      # gRPC inside mutual TLS: meshes must pass it through, not parse it.
      appProtocol: tls
      {{- if and (eq $svc.type "NodePort") $svc.nodePort }}
      nodePort: {{ int64 $svc.nodePort }}
      {{- end }}
  {{- /* internalTrafficPolicy Local overrides trafficDistribution, so
         routing is one enum and the two are never rendered together. */}}
  {{- if eq $svc.routing "Local" }}
  internalTrafficPolicy: Local
  {{- else }}
  internalTrafficPolicy: Cluster
  {{- if eq $svc.routing "PreferSameNode" }}
  trafficDistribution: PreferSameNode
  {{- end }}
  {{- end }}
  {{- if eq $svc.type "NodePort" }}
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy }}
  {{- end }}
---
# One DNS record per ready daemon, for discovery by other ci-accelerator
# components. Not for CI jobs: they use the Service above.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "buildkit.headlessName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkit.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "buildkit.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: 1234
      targetPort: grpc
      protocol: TCP
      # gRPC inside mutual TLS: meshes must pass it through, not parse it.
      appProtocol: tls
