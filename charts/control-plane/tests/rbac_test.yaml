suite: rbac
templates:
  - rbac.yaml
values:
  - values/required.yaml
release:
  name: c
  namespace: ci-accelerator
tests:
  - it: grants nothing without a jobs namespace
    asserts:
      - hasDocuments: { count: 0 }
  - it: lets the controller read pods in the jobs namespace only
    set:
      jobs.namespace: ci-jobs
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: metadata.namespace, value: ci-jobs }
        documentIndex: 0
      - equal:
          path: rules
          value: [{ apiGroups: [""], resources: [pods], verbs: [get, list, watch] }]
        documentIndex: 0
      - equal:
          path: subjects
          value: [{ kind: ServiceAccount, name: c-controller, namespace: ci-accelerator }]
        documentIndex: 1
  - it: leaves the access to the user when told
    set:
      jobs.namespace: ci-jobs
      jobs.rbac.create: false
    asserts:
      - hasDocuments: { count: 0 }
