# Findings in the third-party images the charts run by default (the
# daemons' moby/buildkit, the box's gitlab-runner), accepted for a while:
# there is no release with the fix to move to (BuildKit v0.34.1 is its
# latest; its CNI plugins are built with Go 1.25.8), or the release that
# has it waits for the two-week rule (Renovate opens it). Not analysed for
# reachability. Each entry expires: the weekly scan (make third-party-scan)
# fails on it again, and it is looked at again then. Listed 2026-11-01 with
# trivy 0.75.0.
