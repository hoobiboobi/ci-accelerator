# e2e-only: what the 0.1.0 install of the upgrade scenario needs on top of
# box-values.yaml. 0.1.0 ran VictoriaMetrics and VictoriaTraces in the box;
# they run on the control-plane node (every kind worker is a tainted build
# node), with their default volumes from kind's local-path provisioner.
victoria-metrics-single:
  server:
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
victoria-traces-single:
  server:
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
