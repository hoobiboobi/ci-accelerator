# e2e-only: what the UPGRADE_FROM release (the last published one) needs on
# kind on top of box-values.yaml: its control plane from the published image
# on the control-plane node (every kind worker is a tainted build node), with
# a small volume from kind's local-path provisioner, and the router's zones
# off as in this tree's e2e. Rewrite this file with every release.
control-plane:
  enabled: true
  controller:
    persistence:
      size: 1Gi
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  web:
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  router:
    zones: false
