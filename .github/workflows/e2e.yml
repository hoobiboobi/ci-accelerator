# End-to-end checks on kind clusters: the scenarios in groups of about six
# minutes, each group on its own runner and cluster (setup runs in every
# group). On pull requests to main, on pushes of work-in-progress branches
# (wip/*), and on demand. The groups a change needs come from changes.yml
# (scripts/ci-changes.sh): a Go change runs the two that run the control
# plane, a chart change four, a change of the GitLab CI component also the
# fifth (component: a real GitLab boots first, about ten minutes in all),
# documentation none.
name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: ["wip/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  groups:
    name: e2e on kind (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.e2e_matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.e2e_matrix) }}
    env:
      # renovate: datasource=github-releases depName=helm/helm
      CI_HELM_VERSION: v4.3.1
      # A step's own env is not visible in its `if`.
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_HELM_VERSION }}-${{ hashFiles('Makefile') }}

      # 14 GB of disk hold four kind nodes and every image the e2e pulls only
      # without the runner's preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # kind's known issue: the default inotify limits are too low for
      # several nodes ("too many open files").
      - name: Raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512

      # Optional: anonymous Docker Hub pulls are rate-limited per IP. Set the
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to log in.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install helm, kind, kubectl, and Node for the browser checks
        run: |
          make ci-tools ui-tools
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Create the kind cluster
        run: make kind-up

      - name: Run the e2e
        env:
          E2E_LOGS: ${{ runner.temp }}/e2e-logs
          # The runner image has Chrome: the box's console is checked in it.
          E2E_UI: "1"
          SCENARIOS: ${{ matrix.scenarios }}
        run: make e2e

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ matrix.group }}
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7

  # One result under the name branch protection requires, whatever the
  # groups are: red when a group failed or when it could not be told
  # which to run; green when none was needed.
  e2e:
    name: e2e on kind
    needs: [changes, groups]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every group passed
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.groups.result }}
        run: |
          echo "changes: $CHANGES; groups: $RESULT"
          test "$CHANGES" = success
          test "$RESULT" = success -o "$RESULT" = skipped
