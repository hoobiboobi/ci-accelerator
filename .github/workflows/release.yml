# Publishes the charts (ci-accelerator, buildkit, control-plane) as OCI
# artifacts and the ci-accelerator image to ghcr.io when a version tag is
# pushed:
#   git tag -a v0.2.0 && git push origin v0.2.0
# The tag must match the charts' version (scripts/check-release-version.sh).
# Tags with a pre-release part (v0.1.0-rc.1) become GitHub pre-releases.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # the GitHub Release
      packages: write   # ghcr.io
      id-token: write   # keyless signing
    env:
      CI_HELM_VERSION: v4.3.1
      CHARTS_REPO: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-v4.3.1-${{ hashFiles('Makefile') }}

      - name: Check the tag against the charts
        id: version
        run: echo "version=$(scripts/check-release-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Install helm, kind, kubectl
        run: |
          make ci-tools
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      # The same checks as on every push; the dependencies are vendored here.
      - name: Lint, unit tests, schema validation
        run: make deps lint unittest validate

      # The GitLab CI component as the release notes publish it: the file at
      # this tag on GitHub is the one whose integrity they print, and when it
      # changed since the previous release, a real GitLab (the oldest the
      # component claims and the runner's minor) reads it from there. 0.3.1
      # shipped a component GitLab refused; a refusal stops here.
      - name: The GitLab CI component
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/ci/gitlab/build.yml
        run: |
          make component-test
          curl -fsSL "$COMPONENT_URL" -o "$RUNNER_TEMP/published.yml"
          cmp "$RUNNER_TEMP/published.yml" ci/gitlab/build.yml
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName -q '.[].tagName' | grep -v "^$GITHUB_REF_NAME\$" | head -1 || true)
          if [ -n "$prev" ] && curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$prev/ci/gitlab/build.yml" -o "$RUNNER_TEMP/previous.yml" \
              && cmp -s "$RUNNER_TEMP/previous.yml" ci/gitlab/build.yml; then
            echo "the component is the same file as in $prev, which a real GitLab read before its release"
          else
            make component-gitlab-test GITLAB=all
          fi

      # Reproducible archives: Helm 4 stamps every file with
      # SOURCE_DATE_EPOCH, and the archive's own mtime becomes the OCI
      # "created" annotation.
      - name: Package
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          mkdir -p dist
          helm package charts/buildkit charts/control-plane charts/ci-accelerator -d dist
          touch -d "@$SOURCE_DATE_EPOCH" dist/*.tgz
          cp scripts/quickstart.sh dist/
          # Names without the dist/ prefix, so `sha256sum -c SHA256SUMS` works
          # next to the downloaded release assets.
          (cd dist && sha256sum ./*.tgz ./quickstart.sh | sed 's| \./| |' | tee SHA256SUMS)
          # Every pushed artifact by digest, for signing and the release notes.
          : > dist/digests

      # Keyless signatures record the repository in Sigstore's public
      # transparency log, so only once the repository is public.
      - name: Install cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # The ci-accelerator image (the control plane's roles and the disk
      # probe), the default of the control-plane chart (v<appVersion>), for
      # amd64 and arm64: Go cross-compiles, so no emulation. Built by the
      # BuildKit release the box's daemons run, pinned by digest.
      - name: ci-accelerator image
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          scripts/build-image.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-accelerator:v$VERSION" push | tee -a dist/digests

      - name: Push to ghcr.io
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          for tgz in dist/*.tgz; do
            out=$(helm push "$tgz" "oci://$CHARTS_REPO")
            echo "$out"
            ref=$(printf '%s\n' "$out" | awk '/^Pushed:/ {print $2}')
            digest=$(printf '%s\n' "$out" | awk '/^Digest:/ {print $2}')
            echo "${ref%:*}@$digest" >> dist/digests
          done
          cat dist/digests

      # Right after the push: Artifact Hub checks a version's signature
      # once, when it first indexes the version (every half hour), and
      # never again for the same digest. 0.2.1 was indexed in the three
      # minutes the image build used to take between push and signature
      # and is shown there as unsigned for good.
      - name: Sign
        if: ${{ !github.event.repository.private }}
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io -u "$GH_ACTOR" --password-stdin
          while read -r artifact; do cosign sign --yes "$artifact"; done < dist/digests

      - name: Artifact Hub repository metadata
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras=$(make -s oras)
          printf '%s' "$GH_TOKEN" | "$oras" login ghcr.io -u "$GH_ACTOR" --password-stdin
          make artifacthub-metadata CHARTS_REPO="$CHARTS_REPO"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          {
            # What changed and what an upgrade to this version means.
            echo "## Changes"
            echo
            scripts/changelog-section.sh "$VERSION"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "helm install ci-accelerator oci://$CHARTS_REPO/ci-accelerator --version $VERSION ..."
            echo '```'
            echo
            echo "The control plane (the console's controller and web) is on by default and needs a default StorageClass (or \`control-plane.controller.persistence.storageClass\`); \`--set control-plane.enabled=false --set global.router.enabled=false\` leaves it out (the build router is part of it)."
            echo
            echo "To try it on one clean Linux machine (k3s, cert-manager and the box with its console):"
            echo
            echo '```sh'
            echo "curl -fsSLO https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/quickstart.sh"
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/SHA256SUMS | grep quickstart.sh | sha256sum -c -"
            echo "sudo bash quickstart.sh --gitlab-url https://gitlab.example.com/   # asks for the runner's token"
            echo '```'
            echo
            echo "The GitLab CI component (a job that builds and pushes on the build farm; [ci/gitlab/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/ci/gitlab/README.md)):"
            echo
            echo '```yaml'
            echo "include:"
            echo "  - remote: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/ci/gitlab/build.yml"
            echo "    integrity: sha256-$(openssl dgst -sha256 -binary ci/gitlab/build.yml | base64)"
            echo "    inputs:"
            echo "      runner-tags: [your-runner-tag]"
            echo '```'
            echo
            echo "The daemons alone: \`oci://$CHARTS_REPO/buildkit --version $VERSION\`."
            echo "The control plane alone: \`oci://$CHARTS_REPO/control-plane --version $VERSION\`, image \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-accelerator:v$VERSION\`."
            if [ "$PRIVATE" != "true" ]; then
              echo
              echo "## Verify"
              echo
              echo "Needs cosign 2.6 or newer (the signatures are Sigstore bundles). Every artifact of this release:"
              echo
              echo '```sh'
              echo "for ref in $CHARTS_REPO/buildkit:$VERSION $CHARTS_REPO/control-plane:$VERSION $CHARTS_REPO/ci-accelerator:$VERSION ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-accelerator:v$VERSION; do"
              echo "  cosign verify \$ref \\"
              echo "    --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME \\"
              echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo "done"
              echo '```'
            fi
            # The previous release, for a compare link (gh lists releases newest first;
            # this release does not exist yet). A final release compares with the
            # previous final one, so its link covers its release candidates too.
            if [[ $GITHUB_REF_NAME == *-* ]]; then pre=''; else pre='--exclude-pre-releases'; fi
            # shellcheck disable=SC2086
            prev=$(gh release list --exclude-drafts $pre --limit 50 --json tagName -q '.[].tagName' | grep -v "^$GITHUB_REF_NAME\$" | head -1 || true)
            if [ -n "$prev" ]; then
              echo
              echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
            echo
            echo "## Digests"
            echo
            echo '```'
            cat dist/digests
            echo '```'
            # The disk probe next to each daemon runs the image of the release
            # that last changed it: its own digest to pin.
            image_digest=$(sed -n "s|^ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-accelerator@||p" dist/digests | head -n 1)
            test -n "$image_digest" || { echo "no digest for the ci-accelerator image in dist/digests" >&2; exit 1; }
            probe_tag=$(sed -n 's/.*default "\(v[0-9][^"]*\)" .img\.tag.*/\1/p' charts/buildkit/templates/_helpers.tpl)
            if [ "$probe_tag" = "v$VERSION" ]; then
              probe_digest=$image_digest
            else
              probe_digest=$(sed -n "s/^$probe_tag: //p" charts/buildkit/templates/_helpers.tpl)
            fi
            test -n "$probe_digest" || { echo "no digest for the disk probe's image $probe_tag" >&2; exit 1; }
            echo
            echo "To pin the box's images by digest (README, \"Install\"): \`--set control-plane.image.digest=$image_digest\` (ci-accelerator:v$VERSION) and, for the disk probe next to each daemon (ci-accelerator:$probe_tag), \`--set buildkit.diskProbe.image.digest=$probe_digest\`. The daemons' BuildKit image is pinned by digest already."
          } > dist/notes.md
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/quickstart.sh dist/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "$(cat dist/notes.md)" \
            ${prerelease[@]+"${prerelease[@]}"}
