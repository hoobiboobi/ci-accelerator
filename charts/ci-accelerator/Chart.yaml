apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 0.3.0
# The box's own version (its control plane's image); the daemons' BuildKit version is in charts/buildkit.
appVersion: "0.3.0"
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.33.1
    - name: ci-accelerator
      image: ghcr.io/hoobiboobi/ci-accelerator:v0.3.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: gitlab-runner
      image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.4.1
  artifacthub.io/links: |
    - name: Website and documentation
      url: https://ci-accelerator.io/docs/
    - name: Try it on one machine
      url: https://ci-accelerator.io/docs/#try-it-on-one-machine
    - name: GitOps (Flux, Argo CD)
      url: https://ci-accelerator.io/docs/gitops/
    - name: Changelog
      url: https://ci-accelerator.io/changelog/
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
  # The release's changes, for Artifact Hub's version page; rewrite with each release (docs/releasing.md).
  artifacthub.io/changes: |
    - kind: changed
      description: The console is served by the control plane - a controller (one pod - the store, the sessions, every GitLab token) and a web (two pods by default) that serves the pages and keeps nothing
    - kind: changed
      description: New names - chart control-plane (was console), image ghcr.io/hoobiboobi/ci-accelerator (was ci-accelerator-console), Deployments and Services <release>-controller and <release>-web; 0.2.x installs again instead of upgrading in place (see the upgrade notes)
    - kind: security
      description: The web reads the controller's API over HTTPS with a server-auth-only certificate from the daemons' CA and proves itself with a projected ServiceAccount token checked by TokenReview; the controller's NetworkPolicy admits the web's pods only
    - kind: changed
      description: A page whose controller does not answer says so (502) instead of showing an empty console; the web rolls without a pause
    - kind: added
      description: The build router - each CI job's build goes to the node where its project built before (else the project's node by a hash every router agrees on, so a pipeline's parallel jobs share one daemon's steps); it passes the jobs' TLS through and holds no key
    - kind: added
      description: The Nodes page shows each node's cache by project, and an admin can remove what a project's builds made alone on a node
    - kind: added
      description: scripts/buildkit-certs.sh --controller and --router make the controller API's certificate and the router's names for installs without cert-manager
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (third-party
# archives checked against pinned sha256 sums).
dependencies:
  - name: buildkit
    version: 0.3.0
    repository: file://../buildkit
  - name: control-plane
    version: 0.3.0
    repository: file://../control-plane
    condition: control-plane.enabled
  - name: gitlab-runner
    version: 0.93.0
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
