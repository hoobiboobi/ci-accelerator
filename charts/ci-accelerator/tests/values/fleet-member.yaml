# prod-ap: a member of the fleet at https://hub.example.com.
# Generated by the hub from the cluster's settings (list v1); change them
# at the hub and take the new file, rather than editing this one.
# The runner's token and the S3 keys are not here: the hub sends them
# over the cluster's link once it is connected (Secrets fleet-runner-token, ...).
buildkit:
  config:
    gc:
      maxUsedSpace: "400GB"
  storage:
    hostPath:
      path: "/var/mnt/nvme/buildkit"
    type: "hostPath"
control-plane:
  fleet:
    hub:
      publicKeys: |
        -----BEGIN PUBLIC KEY-----
        MCowBQYDK2VwAyEAhub
        -----END PUBLIC KEY-----
      url: "https://hub.example.com"
    join:
      existingSecret: "fleet-join"
    name: "prod-ap"
    role: "member"
  gitlab:
    token:
      existingSecret: "fleet-gitlab-token"
gitlab-runner:
  concurrent: 40
  gitlabUrl: "https://gitlab.example.com/"
  runners:
    cache:
      s3:
        bucket: "ci-cache-prod-ap"
        region: "eu-central-1"
        server: "s3.eu-central-1.amazonaws.com"
      secretName: "fleet-s3-cache"
    secret: "fleet-runner-token"
global:
  console:
    url: "https://hub.example.com"
