suite: NOTES
templates:
  - NOTES.txt
values:
  - values/required.yaml
release:
  name: box
  namespace: ci-accelerator
tests:
  - it: names the daemons, the jobs namespace and how to build
    asserts:
      - matchRegexRaw:
          pattern: 'DaemonSet box-buildkit'
      - matchRegexRaw:
          pattern: 'CI jobs run in namespace ci-accelerator-jobs \(created by this release, Pod Security baseline; deleted with it\)'
      - matchRegexRaw:
          pattern: 'buildctl --addr "\$BUILDKIT_REMOTE_ADDR" --tlsdir "\$BUILDKIT_TLS_DIR"'

  - it: points to the fragment without its own runner
    set:
      gitlab-runner.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: 'No runner is installed: configure yours with integrations/gitlab-runner/values.yaml\n\(BUILDKIT_REMOTE_ADDR=tcp://box-buildkit.ci-accelerator.svc:1234\)'

  - it: says nothing about metrics storage by default
    asserts:
      - notMatchRegexRaw:
          pattern: Victoria

  - it: warns that the storage of 0.1.0 is gone when its values remain
    set:
      victoria-metrics-single.enabled: true
      buildkit.otel.metricsEndpoint: 'http://{{ include "ci-accelerator.vmService" . }}.{{ .Release.Namespace }}.svc:8428/opentelemetry/v1/metrics'
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: VictoriaMetrics and VictoriaTraces are no longer part of the box'
      - matchRegexRaw:
          pattern: 'set them to ""'

  - it: says the console without sign-in stays inside the cluster
    set:
      console.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: 'Sign-in is off \(console\.signIn\): it shows everything to whoever reaches\nit, so keep it inside the cluster:\n  kubectl -n ci-accelerator port-forward svc/box-console 8080'
      - matchRegexRaw:
          pattern: 'The console explains each build\.'
      - notMatchRegexRaw:
          pattern: 'preview'
      - matchRegexRaw:
          pattern: 'Without GitLab access it shows image builds, their steps and cache\nverdicts, but no job results or runner waits\. More \(README, "The console"\):\n  - a GitLab token with read_api \(console\.gitlab\.token\.existingSecret\):'
      # Without global.console.url the redirect URI shows where the address goes.
      - matchRegexRaw:
          pattern: '      <global\.console\.url>/auth/callback/051b90\n'

  - it: does not ask for a token the console already has
    set:
      console.enabled: true
      console.gitlab.token.existingSecret: console-gitlab-token
    asserts:
      - matchRegexRaw:
          pattern: 'Sign-in is off'
      - notMatchRegexRaw:
          pattern: 'console\.gitlab\.token\.existingSecret'
      - matchRegexRaw:
          pattern: 'With its GitLab token it also shows job results and runner waits'

  - it: prints the redirect URI of the runner's GitLab for sign-in
    set:
      console.enabled: true
      global.console.url: https://ci.example.com/
      console.signIn: { enabled: true, sessionKey: { existingSecret: s }, gitlab: [{ existingSecret: o }] }
    asserts:
      - matchRegexRaw:
          pattern: 'People sign in through GitLab at https://ci\.example\.com/ and see the projects whose jobs'
      - matchRegexRaw:
          pattern: '  https://gitlab\.example\.com/: https://ci\.example\.com/auth/callback/051b90\n'
      - notMatchRegexRaw:
          pattern: 'Sign-in is off'
      - notMatchRegexRaw:
          pattern: 'console\.gitlab\.token\.existingSecret'

  - it: gives the port-forward for a console on this machine
    set:
      console.enabled: true
      global.console.url: http://localhost:18081
      console.signIn: { enabled: true, sessionKey: { existingSecret: s }, gitlab: [{ existingSecret: o }] }
    asserts:
      - matchRegexRaw:
          pattern: 'http://localhost:18081 is this machine: reach the console with\n  kubectl -n ci-accelerator port-forward svc/box-console 18081:8080'
      - notMatchRegexRaw:
          pattern: 'Ingress or gateway with TLS for http://'

  # helm upgrade --reuse-values from 0.1.0 keeps a values tree without a
  # console block: the notes must still render.
  - it: renders for values reused from 0.1.0, which have no console
    set:
      console: null
    asserts:
      - notFailedTemplate: {}
      - notMatchRegexRaw:
          pattern: 'The console explains'
