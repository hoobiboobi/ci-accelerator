# The box: buildkit daemons on the build nodes and a gitlab-runner whose CI
# jobs use them. Set gitlab-runner.gitlabUrl and gitlab-runner.runners.secret;
# everything else has working defaults. For production also say where the
# cache lives (buildkit.storage: hostPath on a dedicated disk; the default
# emptyDir is emptied by every rollout). cert-manager must be installed (the
# daemons and jobs authenticate each other with certificates it issues).

# Shared with the subcharts.
global:
  # -- Dedicated build nodes: the daemons and the CI job pods run there, so a
  # job reaches the daemon (and the cache) on its own node. Label and taint
  # them before install.
  buildNodes:
    enabled: true
    selector:
      ci-accelerator.io/node-role: build
    tolerations:
      - key: ci-accelerator.io/node-role
        operator: Equal
        value: build
        effect: NoSchedule
  tls:
    # -- cert-manager issuer for daemon and client certificates. Empty name:
    # a CA dedicated to this release is created (see buildkit.tls).
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
  jobs:
    # -- Namespace of the CI job pods. They run untrusted code, so they get
    # their own namespace, apart from the runner and the daemons. Keep
    # gitlab-runner.runners.jobNamespace equal to it.
    namespace: ci-accelerator-jobs
    # -- CPU architecture of the build nodes (kubernetes.io/arch). The
    # runner picks its helper image by it.
    architecture: amd64
  console:
    # -- The console's address as users reach it (https://...). When set,
    # every job prints the link to its page in its log, and sign-in through
    # GitLab (console.signIn) uses it. Empty: no link.
    url: ""

# Install-time checks against the live cluster. Skipped by `helm template`
# and by GitOps tools that render offline.
preflight:
  # -- Fail if gitlab-runner.runners.secret exists but lacks a key the
  # runner chart mounts (runner-token, and runner-registration-token, which
  # may be empty), or if runner-token does not look like a token (e.g. a
  # copied placeholder). A Secret that does not exist yet is not an error.
  # Needs read access to Secrets in the release namespace.
  runnerSecret: true

# The jobs namespace, created by this release (and deleted with it, together
# with everything in it).
jobsNamespace:
  # -- false: the namespace exists already (or GitOps creates it); it needs
  # the client certificate (issued here) and Pod Security "baseline".
  create: true
  # -- Pod Security level enforced for the job pods.
  podSecurity: baseline

# The daemons: charts/buildkit, see its values for everything else.
buildkit:
  tls:
    client:
      # The client certificate goes into the jobs namespace.
      namespaces:
        - "{{ .Values.global.jobs.namespace }}"
  # Clients only from the jobs namespace; builds never reach cloud
  # metadata. List the cluster's pod and Service CIDRs in
  # networkPolicy.egress.clusterCIDRs to keep builds out of the cluster.
  networkPolicy:
    enabled: true
    ingress:
      # The console (console.enabled) reads the daemons' build history.
      extraFrom:
        - podSelector:
            matchLabels:
              ci-accelerator.io/component: console

# The official gitlab-runner chart. Set enabled=false to keep your own
# runner and use integrations/gitlab-runner/values.yaml with it instead.
gitlab-runner:
  enabled: true
  # 19.4.0 (the chart's default) lists pod events on every poll and
  # overloaded API servers; 19.4.1 fixes that.
  image:
    tag: alpine-v19.4.1
  # -- Required: your GitLab, e.g. https://gitlab.example.com/
  gitlabUrl: ""
  runners:
    # -- Required: a Secret in this release's namespace with the runner
    # authentication token (runner-token: glrt-...) and an empty
    # runner-registration-token key.
    secret: ""
    # -- Keep equal to global.jobs.namespace.
    jobNamespace: ci-accelerator-jobs
    # S3 cache for `cache:` in .gitlab-ci.yml (artifacts need nothing: GitLab
    # keeps them). Off while s3.server is empty. For example:
    #   cache:
    #     secretName: runner-cache   # keys accesskey and secretkey
    #     consoleSecretName: runner-cache-read   # optional: read-only keys for the console
    #     s3:
    #       server: s3.example.com
    #       bucket: ci-cache
    #       region: eu-1
    # Optional: s3.insecure (http), s3.pathStyle (true/false; default: path
    # style except on AWS), path (default <release>/<GitLab id>: every runner
    # of this release shares a project's caches), maxArchiveBytes (default
    # 4.5 GiB). The runner never deletes caches: give the bucket a lifecycle
    # rule (docs/runner-cache.md).
    cache: {}
    # The same job settings as integrations/gitlab-runner/values.yaml, with
    # the names filled in from this release (make validate compares them).
    # One text for every runner of the box (templates/_runner.tpl): the same
    # daemons, certificate, trace context, job data and placement. Rendered
    # by the runner chart with tpl, which sees this chart's helpers; the
    # runner's values are the root.
    # The template comment keeps the words "namespace =" in this text: without
    # them the runner chart sets KUBERNETES_NAMESPACE, which wins over the
    # TOML and would put the jobs into the release namespace.
    config: '{{/* namespace = global.jobs.namespace, set in the TOML */}}{{ include "ci-accelerator.runnerToml" (dict "root" . "gitlabUrl" .Values.gitlabUrl "build" true "cache" (default (dict) .Values.runners.cache)) }}'
  # The permissions the Kubernetes executor needs in the jobs namespace,
  # instead of the chart's default `*` on core resources.
  rbac:
    create: true
    rules:
      - resources: ["pods"]
        verbs: ["create", "delete", "get", "list", "watch"]
      - resources: ["pods/attach", "pods/exec"]
        verbs: ["create", "delete", "get", "patch"]
      - resources: ["pods/log"]
        verbs: ["get", "list"]
      - resources: ["secrets"]
        verbs: ["create", "delete", "get", "update"]
      - resources: ["serviceaccounts"]
        verbs: ["get"]
      - resources: ["services"]
        verbs: ["create", "get"]
      - resources: ["events"]
        verbs: ["list"]

# More runners next to the main one, any number: each tier is its own runner
# pod with its own GitLab runner, tags, job size, placement and S3 cache.
# Create the runner in GitLab first (Settings > CI/CD > Runners, or the
# API), with the tags its jobs will use, and put its token (glrt-...) into a
# Secret. For example:
#   runnerTiers:
#     deploy:
#       token:
#         existingSecret: runner-deploy     # key runner-token
#       resources:                          # each job's container
#         requests: {cpu: 250m, memory: 512Mi}
#         limits: {memory: 2Gi}
#       nodes: any                          # any node, or build: next to a daemon
#       concurrent: 4                       # jobs at once
#       cache:                              # as gitlab-runner.runners.cache
#         secretName: runner-cache-deploy
#         s3: {server: s3.example.com, bucket: ci-cache, region: eu-1}
# Optional per tier: image (default job image, alpine:3.22), manager
# (resources, nodeSelector, tolerations of the runner pod),
# terminationGracePeriodSeconds (how long a rollout waits for running jobs,
# default 3600).
runnerTiers: {}

# The console: reads every daemon's build history and the CI job pods, and
# explains each build. On by default (false keeps it off): it needs a
# volume (the default StorageClass, or console.persistence.*). Its Service
# is ClusterIP only; without sign-in (console.signIn) it shows everything
# to whoever reaches it. See charts/console for every value.
console:
  enabled: true
  # The runner's GitLab URL, from a ConfigMap this chart writes.
  gitlab:
    urlsFrom:
      configMap: '{{ .Release.Name }}-console-gitlab'
  daemons:
    discover: '{{ include "ci-accelerator.buildkitHeadless" . }}.{{ .Release.Namespace }}.svc:1234'
  tls:
    # With buildkit.tls.source=existingSecret, set console.tls.existingSecret
    # (a client certificate from the daemons' CA).
    existingSecret: ""
    certManager:
      issuerRef:
        name: '{{ include "ci-accelerator.issuerName" . }}'
  jobs:
    namespace: '{{ .Values.global.jobs.namespace }}'
  networkPolicy:
    # -- Keep the box's CI jobs and builds away from the console: the jobs
    # namespace and the daemons (RUN steps share their network) may not
    # connect; Ingress controllers in other namespaces and port-forward
    # still do. Needs a CNI that enforces NetworkPolicy; see charts/console.
    enabled: true
  # The runners' cache folders (the main runner's and the tiers'), written
  # by this chart with read access to their keys' Secrets.
  caches:
    fromConfigMap: '{{ .Release.Name }}-console-caches'
  # Sign-in through GitLab at global.console.url; each person sees the
  # projects whose jobs GitLab lets them read. A GitLab entry without a url
  # is the runner's. For example:
  #   signIn:
  #     enabled: true
  #     sessionKey: { existingSecret: console-session }
  #     gitlab:
  #       - existingSecret: console-gitlab-oauth   # client-id, client-secret
  #         admins: [alice]
  signIn:
    enabled: false
