# End-to-end checks on a kind cluster (~25 min). On pull requests to main
# and on demand; not on every push, to save Actions minutes.
name: e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI_HELM_VERSION: v4.3.0
      # A step's own env is not visible in its `if`.
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-v4.3.0-${{ hashFiles('Makefile') }}

      # 14 GB of disk hold four kind nodes and every image the e2e pulls only
      # without the runner's preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # kind's known issue: the default inotify limits are too low for
      # several nodes ("too many open files").
      - name: Raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512

      # Optional: anonymous Docker Hub pulls are rate-limited per IP. Set the
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to log in.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install helm, kind, kubectl
        run: |
          make ci-tools
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Create the kind cluster
        run: make kind-up

      - name: Run the e2e
        env:
          E2E_LOGS: ${{ runner.temp }}/e2e-logs
        run: make e2e

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
