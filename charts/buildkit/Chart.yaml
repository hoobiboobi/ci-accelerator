apiVersion: v2
name: buildkit
description: >-
  Persistent BuildKit daemons as a shared build service for CI, with probe
  and garbage-collection defaults derived from a production setup.
type: application
version: 0.3.3
# Upstream moby/buildkit release; the default image tag is derived from it.
appVersion: "v0.34.1"
# >=1.34 for Service trafficDistribution: PreferSameNode (GA in 1.35).
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
  - https://github.com/moby/buildkit
keywords:
  - buildkit
  - ci
  - docker
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.34.1
  artifacthub.io/links: |
    - name: Website and documentation
      url: https://ci-accelerator.io/docs/
    - name: Values of this chart
      url: https://ci-accelerator.io/docs/charts/buildkit/
    - name: Architecture
      url: https://ci-accelerator.io/docs/architecture/
    - name: Troubleshooting
      url: https://ci-accelerator.io/docs/troubleshooting/
    - name: support
