<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">Components and namespaces</title>
  <desc id="d">The box namespace holds the gitlab-runner manager, the build router (DaemonSet and Service &lt;release&gt;-router), the daemon DaemonSet &lt;release&gt;-buildkit with a disk probe next to each daemon, the daemons' headless Service, the control plane's Deployments &lt;release&gt;-controller and &lt;release&gt;-web, and the NetworkPolicies. The runner creates CI job pods in the jobs namespace; they connect to the router over mutual TLS, and the router passes the connection through to the daemon where the job's project is warm. cert-manager's namespace holds the release's CA, which signs the daemons' server certificate, the jobs' client certificate and the controller's certificates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a948b"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9fff"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #ece9e4; }
      .ns { font-size: 16px; font-weight: 600; }
      .ns-note { font-size: 14px; font-weight: 400; fill: #9a948b; }
      .name { font-size: 15px; font-weight: 600; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 500; }
      .sub { font-size: 14px; fill: #bab5ad; }
      .edge { font-size: 13px; fill: #9a948b; }
      .edge-accent { font-size: 13px; font-weight: 600; fill: #9a9fff; }
      .region { fill: #1c1b19; stroke: #3a3734; stroke-width: 1; }
      .card { fill: #222120; stroke: #3a3734; stroke-width: 1; }
      .card-main { fill: #222120; stroke: #9a9fff; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="960" height="640" rx="14" fill="#161514"/>

  <!-- The box namespace -->
  <text x="28" y="38"><tspan class="ns">namespace ci-accelerator</tspan><tspan class="ns-note"> · Pod Security: privileged</tspan></text>
  <rect class="region" x="20" y="52" width="548" height="568" rx="12"/>

  <rect class="card" x="40" y="72" width="508" height="52" rx="8"/>
  <text x="56" y="94" class="name">gitlab-runner (manager)</text>
  <text x="56" y="113" class="sub">polls GitLab for jobs</text>

  <rect class="card" x="40" y="140" width="508" height="52" rx="8"/>
  <text x="56" y="162" class="mono">DaemonSet + Service &lt;release&gt;-router :1234</text>
  <text x="56" y="181" class="sub">build router on every build node; holds no key</text>

  <!-- the router passes each job's connection through to a daemon -->
  <line x1="294" y1="192" x2="294" y2="240" stroke="#9a9fff" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="306" y="221" class="edge-accent">mTLS passed through</text>

  <rect class="card-main" x="40" y="244" width="508" height="122" rx="8"/>
  <text x="56" y="266" class="mono">DaemonSet &lt;release&gt;-buildkit</text>
  <text x="56" y="286" class="sub">one daemon per build node; a job's build goes to</text>
  <text x="56" y="305" class="sub">the node where its project is warm</text>
  <text x="56" y="324" class="sub">state: hostPath or emptyDir</text>
  <text x="56" y="343" class="sub">disk probe next to each daemon (:9180)</text>

  <rect class="card" x="40" y="378" width="508" height="52" rx="8"/>
  <text x="56" y="400" class="mono">Service &lt;release&gt;-buildkit-headless</text>
  <text x="56" y="419" class="sub">every daemon by name, for the controller and the routers</text>

  <rect class="card" x="40" y="442" width="508" height="76" rx="8"/>
  <text x="56" y="464" class="mono">Deployments &lt;release&gt;-controller, -web</text>
  <text x="56" y="484" class="sub">controller: store, build history, GitLab; API :8443</text>
  <text x="56" y="503" class="sub">web: the console's pages, Service &lt;release&gt;-web</text>

  <rect class="card" x="40" y="530" width="508" height="72" rx="8"/>
  <text x="56" y="552" class="name">NetworkPolicies</text>
  <text x="56" y="571" class="sub">daemons: from the routers and the controller</text>
  <text x="56" y="590" class="sub">routers: from the jobs namespace; controller: web, routers</text>

  <!-- The jobs namespace -->
  <text x="644" y="38"><tspan class="ns">namespace ci-accelerator-jobs</tspan><tspan class="ns-note"> · baseline</tspan></text>
  <rect class="region" x="640" y="52" width="300" height="190" rx="12"/>
  <rect class="card" x="660" y="72" width="260" height="150" rx="8"/>
  <text x="676" y="94" class="name">CI job pod</text>
  <text x="676" y="113" class="sub">on a build node, 50m CPU</text>
  <text x="676" y="140" class="mono">BUILDKIT_REMOTE_ADDR</text>
  <text x="676" y="162" class="mono">/certs</text>
  <text x="730" y="162" class="sub">client certificate</text>
  <text x="676" y="189" class="sub">runs buildctl and sends</text>
  <text x="676" y="207" class="sub">the build context</text>

  <!-- cert-manager's namespace -->
  <text x="648" y="384"><tspan class="ns">namespace cert-manager</tspan></text>
  <rect class="region" x="640" y="398" width="300" height="140" rx="12"/>
  <rect class="card" x="660" y="418" width="260" height="100" rx="8"/>
  <text x="676" y="441" class="name">the release’s CA</text>
  <text x="676" y="461" class="sub">CA Secret; its ClusterIssuer signs</text>
  <text x="676" y="480" class="sub">the daemons’, the jobs’ and</text>
  <text x="676" y="499" class="sub">the controller’s certificates</text>

  <!-- runner creates job pods -->
  <line x1="548" y1="98" x2="656" y2="98" stroke="#9a948b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="604" y="84" class="edge" text-anchor="middle">creates</text>
  <text x="604" y="118" class="edge" text-anchor="middle">job pods</text>

  <!-- job pods reach the router over mutual TLS -->
  <line x1="660" y1="166" x2="552" y2="166" stroke="#9a9fff" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="604" y="156" class="edge-accent" text-anchor="middle">mTLS</text>

  <!-- the CA signs the client certificate of the jobs namespace -->
  <path d="M896 418 V246" fill="none" stroke="#9a948b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="884" y="318" class="edge" text-anchor="end">client certificate</text>

  <!-- and the daemons' server certificate -->
  <path d="M660 470 H604 V300 H552" fill="none" stroke="#9a948b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="604" y="498" class="edge" text-anchor="middle">server</text>
  <text x="604" y="514" class="edge" text-anchor="middle">certificate</text>
</svg>
