# Local kind cluster for developing and testing the buildkit chart.
#
#   make kind-up      # kind create cluster + build-node taints (idempotent)
#   make kind-down
#
# Layout mirrors the production topology the chart is designed for: one
# control-plane and three workers that act as dedicated build nodes, so
# nodeSelector / tolerations / same-node routing can be exercised locally.
# Labels are set here (kubelet refuses to self-assign node-role.kubernetes.io/*
# labels, hence the chart's own domain); the taint is applied by `make kind-up`
# (kubeadm join patches are fragile across kind versions):
#
#   kubectl --context kind-buildkit taint nodes -l ci-accelerator.io/node-role=build \
#     ci-accelerator.io/node-role=build:NoSchedule --overwrite
#
# The daemons' cache lives on the kind nodes' filesystem, which is the Docker
# VM disk shared by all nodes: absolute numbers mean nothing here, only cache
# behaviour (CACHED / dedup) is testable. kind also disables kubelet's disk
# eviction thresholds, so disk-pressure behaviour cannot be tested here.
#
# Node images are pinned by digest (kind v0.33.0 release notes); override with
# `make kind-up KIND_IMAGE=kindest/node:v1.34.11@sha256:...` to test another
# Kubernetes version. A second cluster next to this one needs a copy of this
# file without apiServerPort and extraPortMappings.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: buildkit

# Fixed API port so a kubeconfig stays valid across recreations. The API server
# listens on 127.0.0.1 only (kind's default).
networking:
  apiServerPort: 6443

nodes:
  - role: control-plane
    # renovate: datasource=docker depName=kindest/node
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5

  - role: worker
    # renovate: datasource=docker depName=kindest/node
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ci-accelerator.io/node-role: build
      topology.kubernetes.io/zone: zone-a
    extraPortMappings:
      # buildkitd on this node, reachable from the host as tcp://127.0.0.1:1234
      # when the chart exposes it as NodePort 31234 (examples/kind/values.yaml).
      # 127.0.0.1 only: without TLS the daemon must not be reachable from the
      # LAN (Docker publishes on all interfaces by default).
      - containerPort: 31234
        hostPort: 1234
        listenAddress: "127.0.0.1"
        protocol: TCP

  - role: worker
    # renovate: datasource=docker depName=kindest/node
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ci-accelerator.io/node-role: build
      topology.kubernetes.io/zone: zone-b

  - role: worker
    # renovate: datasource=docker depName=kindest/node
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ci-accelerator.io/node-role: build
      topology.kubernetes.io/zone: zone-c
