suite: services
templates:
  - service.yaml
release:
  name: bk
  namespace: ci-accelerator
tests:
  - it: exposes grpc on 1234 as ClusterIP by default
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: bk-buildkit
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0]
          value:
            name: grpc
            port: 1234
            targetPort: grpc
            protocol: TCP

  # D21: own node's daemon (warm cache), fallback to another node instead of
  # failing the build when it is not ready.
  - it: prefers the same node with fallback by default
    documentIndex: 0
    asserts:
      - equal:
          path: spec.trafficDistribution
          value: PreferSameNode
      - equal:
          path: spec.internalTrafficPolicy
          value: Cluster

  # Local would silently override trafficDistribution, so never render both.
  - it: renders strict node-local routing without trafficDistribution
    documentIndex: 0
    set:
      service.routing: Local
    asserts:
      - equal:
          path: spec.internalTrafficPolicy
          value: Local
      - notExists:
          path: spec.trafficDistribution

  - it: renders plain cluster-wide routing
    documentIndex: 0
    set:
      service.routing: Cluster
    asserts:
      - equal:
          path: spec.internalTrafficPolicy
          value: Cluster
      - notExists:
          path: spec.trafficDistribution

  - it: does not set externalTrafficPolicy on ClusterIP
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.externalTrafficPolicy

  - it: renders a fixed NodePort with its external policy
    documentIndex: 0
    set:
      service.type: NodePort
      service.nodePort: 31234
      service.externalTrafficPolicy: Local
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 31234
      - equal:
          path: spec.externalTrafficPolicy
          value: Local

  - it: lets Kubernetes pick the node port when unset
    documentIndex: 0
    set:
      service.type: NodePort
    asserts:
      - notExists:
          path: spec.ports[0].nodePort

  - it: rejects an unknown routing mode
    set:
      service.routing: Sticky
    asserts:
      - failedTemplate:
          errorPattern: routing

  - it: always creates the headless discovery Service (D7)
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: bk-buildkit-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].port
          value: 1234

  - it: selects only this release's daemons
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: buildkit
            app.kubernetes.io/instance: bk
