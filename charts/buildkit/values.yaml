# Default values for the buildkit chart.
# Every key is validated by values.schema.json; unknown keys are rejected.
# The chart also refuses, at render time, combinations that would crash
# buildkitd, stall a rollout or silently delete the cache.

# -- Override the chart name used in resource names. Install-time only:
# changing it later renames every object and conflicts with the immutable
# DaemonSet selector.
nameOverride: ""
# -- Override the full resource name (<release>-<chart> by default).
# Install-time only, like nameOverride.
fullnameOverride: ""

image:
  repository: moby/buildkit
  # -- Defaults to the chart appVersion.
  tag: ""
  # -- Image index digest. The runtime pulls by digest when it is set, so
  # change or clear it together with tag (another tag with this default
  # digest is refused). Default: the digest of the appVersion tag
  # (multi-arch index).
  digest: "sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c"
  pullPolicy: IfNotPresent

# -- Image pull secrets for private mirrors of the buildkit image.
imagePullSecrets: []

# -- Labels added to every resource the chart creates (including the pods:
# changing them restarts the daemons). They cannot override the chart's own
# labels.
commonLabels: {}

# Install-time checks against the live cluster. Skipped under `helm template`
# and by GitOps tools that render offline.
preflight:
  # -- Fail if the namespace's pod-security.kubernetes.io/enforce label is set
  # to anything but privileged (no daemon pod could start). Needs read access
  # to the Namespace object, which namespace admins have. A namespace without
  # the label is not checked (the cluster default applies); NOTES warns.
  podSecurity: true
  # -- Fail if no node carries every label of the build-node selector (the
  # DaemonSet would want 0 pods while helm reports success). Needs
  # cluster-wide list access to Nodes (an installer that is only a namespace
  # admin gets Forbidden); set false then, or for node pools scaled to zero.
  buildNodes: true
  # -- With tls.source=existingSecret: fail if the Secret exists but lacks
  # tls.crt, tls.key or ca.crt (`kubectl create secret tls` writes no
  # ca.crt). A Secret that does not exist yet is not an error: the daemons
  # wait for it. Needs read access to Secrets in the release namespace.
  tlsSecret: true

# Mutual TLS on the daemons' TCP port. Always on: buildkitd runs whatever a
# connected client asks for, and RUN steps of builds share the daemon's
# network, so without client certificates any build could drive its own
# daemon. Clients need a certificate signed by the CA in ca.crt; any such
# certificate is accepted, so use a CA dedicated to these daemons.
tls:
  # -- certManager: cert-manager (installed beforehand) issues the daemon
  # certificate (Secret <fullname>-tls) and client certificates.
  # existingSecret: you provide the daemon Secret and the client
  # certificates (scripts/buildkit-certs.sh makes both).
  source: certManager
  # -- With source=existingSecret: name of a Secret in the release namespace
  # with the daemon's certificate (tls.crt, tls.key) and the CA that signs
  # client certificates (ca.crt). The server certificate must cover the
  # Service names clients use (<fullname>.<namespace>.svc).
  existingSecret: ""
  certManager:
    # -- Namespace where cert-manager's ClusterIssuers read their Secrets
    # (its --cluster-resource-namespace; by default its own namespace). With
    # an empty global.tls.issuerRef the chart puts its CA there: a
    # self-signed Issuer, the CA Certificate and its Secret. That Secret
    # (the CA key) stays after `helm uninstall`.
    clusterResourceNamespace: cert-manager
    # -- Lifetime of the daemon and client certificates. cert-manager renews
    # them after two thirds; the daemons pick up a renewed certificate only
    # when they restart (see reloader), within the remaining third.
    duration: 8760h
    # -- Lifetime of the CA the chart creates. It is renewed with the same
    # key, so certificates it signed stay valid.
    caDuration: 87600h
    # -- Cluster DNS domain, for the fully qualified Service names.
    clusterDomain: cluster.local
    # -- More names and addresses for the daemon certificate (e.g. a node
    # address for NodePort clients, or a TCP proxy's Service such as the
    # ci-accelerator build router). Names are rendered with tpl.
    extraDnsNames: []
    ipAddresses: []
  client:
    # -- Namespaces that get a client certificate in Secret
    # <fullname>-client (tls.crt, tls.key, ca.crt), e.g. the namespace of
    # the CI job pods. They must exist. With source=certManager only.
    # Entries are rendered with tpl, so a parent chart may write
    # "{{ .Values.global.<key> }}".
    namespaces: []
  # -- Annotate the DaemonSet for Stakater Reloader. buildkitd reads its
  # certificates only at start, so a renewed Secret takes effect after a
  # restart; with Reloader in the cluster that is a rolling restart (per
  # updateStrategy; nothing happens with OnDelete) as soon as the Secret
  # changes. Under Argo CD or Flux run Reloader with the flag
  # `--reload-strategy=annotations`. Without Reloader, restart the daemons
  # yourself before the old certificate expires.
  reloader: true

# Shared with other ci-accelerator charts when installed via the umbrella.
global:
  tls:
    # -- cert-manager issuer for the daemons' and the clients' certificates
    # (tls.source=certManager). Empty name: the chart creates a CA dedicated
    # to this release (see tls.certManager). Your own issuer must be dedicated
    # to these daemons too (any certificate it signs gets in) and must put
    # ca.crt into the Secrets it fills (CA or Vault issuers do, ACME does
    # not). Client certificates in other namespaces need a ClusterIssuer.
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
  # The ci-accelerator build router (the box sets it): CI jobs reach the
  # daemons through it. With it the daemons' certificate names its Service
  # and only its pods (and extraFrom) may connect, not the clients'
  # namespaces: the jobs keep their certificate, which the daemons check
  # through the router.
  router:
    enabled: false
    # -- The router's Service in this namespace. Rendered with tpl.
    service: ""
  # Dedicated build nodes: label and taint them before install.
  buildNodes:
    # -- false: ignore selector/tolerations below and run on any Linux node.
    # (A switch, because Helm merges `selector: {}` with the default
    # instead of clearing it.)
    enabled: true
    selector:
      ci-accelerator.io/node-role: build
    tolerations:
      - key: ci-accelerator.io/node-role
        operator: Equal
        value: build
        effect: NoSchedule

# Client-facing Service on :1234. A headless Service (<fullname>-headless) is
# always created for discovery by other components.
service:
  # -- ClusterIP for CI jobs in the cluster; NodePort to reach the daemons
  # from outside (every node IP; the server certificate must then also cover
  # the address clients use, or clients pass --tlsservername).
  type: ClusterIP
  port: 1234
  # -- Fixed node port when type is NodePort; must lie in the cluster's
  # service-node-port-range (default 30000-32767). Empty lets Kubernetes pick.
  nodePort: ""
  # -- How in-cluster clients reach a daemon. The cache is per daemon, so
  # staying on the client's node keeps it warm.
  #   PreferSameNode: own node's daemon; falls back to another node when it
  #                   is not ready (cold cache, build still succeeds).
  #                   Needs kube-proxy >= 1.34 on every node (or a proxy that
  #                   implements node hints); older ones silently balance
  #                   cluster-wide.
  #   Local:          own node's daemon only; no ready daemon there means no
  #                   endpoints and the build fails.
  #   Cluster:        any daemon.
  routing: PreferSameNode
  # -- externalTrafficPolicy for NodePort (Cluster or Local).
  externalTrafficPolicy: Cluster
  annotations: {}

# Who may talk to the daemons and where builds may connect. RUN steps share
# the daemon pod's network, so the egress rules below are also what every
# build can reach. Needs a CNI that enforces NetworkPolicy.
networkPolicy:
  # -- Render a NetworkPolicy for the daemon pods.
  enabled: false
  ingress:
    # -- Namespaces whose pods may connect to port 1234, in addition to
    # tls.client.namespaces.
    namespaces: []
    # -- More NetworkPolicyPeer entries for port 1234 (e.g. an ipBlock for
    # NodePort clients outside the cluster).
    extraFrom: []
  egress:
    # -- Never reachable: cloud instance metadata (node credentials) for
    # IPv4 and IPv6.
    blockedCIDRs:
      - 169.254.169.254/32
      - fd00:ec2::254/128
    # -- The cluster's pod and Service CIDRs. Listed here, the daemons and
    # every build lose access to in-cluster services (allow what they need
    # in extraRules, e.g. an in-cluster registry or the OTLP backends). The
    # API offers no way to discover them. Traffic to the node itself is
    # always allowed by Kubernetes, and whether the API server can be
    # blocked depends on the CNI.
    clusterCIDRs: []
    # -- Peers that serve DNS on port 53.
    dns:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    # -- More NetworkPolicyEgressRule entries (rendered with tpl).
    extraRules: []

# Where the daemon keeps its state (/var/lib/buildkit): the build cache.
storage:
  # -- emptyDir: the cache lives as long as the pod, on the node's root disk
  # (quick start, CI). Every rollout starts with an empty cache.
  # hostPath: the cache survives restarts and rollouts (production).
  type: emptyDir
  emptyDir:
    # -- Kubernetes quantity, e.g. "50Gi"; empty means no limit. Exceeding it
    # gets the pod evicted with ~1 s grace (running builds fail, cache lost),
    # so the chart requires an absolute config.gc.maxUsedSpace of at most 80%
    # of it whenever it is set.
    sizeLimit: ""
  hostPath:
    # -- Required with storage.type=hostPath. A directory created in advance
    # on the dedicated cache disk, as a subdirectory of the mount (e.g.
    # /var/mnt/nvme/buildkit, not /var/mnt/nvme): if the disk is not mounted,
    # the pod then fails to start instead of filling the OS disk. One release
    # per path per node (buildkitd locks the directory). The data stays after
    # `helm uninstall`.
    path: ""
    # -- Directory: the path must exist (recommended). DirectoryOrCreate:
    # kubelet creates it on whatever filesystem is there (test clusters).
    type: Directory

# Rendered into buildkitd.toml.
config:
  # -- Max concurrently running build operations per daemon: RUN, COPY/ADD
  # and source operations (image pulls, git, local context). 0 = unlimited,
  # which is buildkit's default (not the CPU count). Production ran 28 on a
  # 48-CPU daemon.
  maxParallelism: 0

  # Garbage collection, for the default policy set rendered by the chart.
  # Sizes use buildkit's binary units: "10GB" = 10 GiB, "2TB" = 2 TiB.
  # Kubernetes suffixes ("10Gi") are rejected. Percentages are of the
  # filesystem that holds the state dir, measured once at daemon start, and
  # come out at about 0.93 x N%. GC runs after builds (at most once a
  # minute), not on a timer.
  gc:
    # -- The capped policies never reclaim below this much cache. Age-based
    # policies (cache mounts, local context) still expire by age.
    reservedSpace: "10GB"
    # -- Reclaim when the cache grows above this.
    maxUsedSpace: "75%"
    # -- Reclaim when free space on the state-dir filesystem drops below this.
    # It is compared with free blocks including the filesystem's root reserve
    # (ext4: 5%), while kubelet evicts on available blocks at 10-15%. With the
    # cache on the node's root disk (emptyDir, or hostPath not on its own
    # disk) keep it at 30% or more; on a dedicated disk use an absolute size
    # (production: 400GB on a 3 TB NVMe).
    minFreeSpace: "30%"
    cacheMounts:
      # -- Keep RUN --mount=type=cache contents this long after last use
      # (buildkit's default is 48h, which makes package caches cold after a
      # weekend). Must be non-zero.
      keepDuration: "336h"
      # -- Expire cache mounts (whatever their age) only while the WHOLE
      # cache is above this size: buildkit compares policy caps with the total
      # usage, not with the filtered records. Empty: expire by age only.
      maxUsedSpace: ""

  # -- Replace the chart's GC policies entirely. Each item: filters, all,
  # keepDuration, reservedSpace, maxUsedSpace, minFreeSpace. Filters use
  # buildkit's prune syntax, e.g. "type==exec.cachemount".
  gcPolicy: []

  # -- Build history, which the controller reads (it copies each record when
  # it completes, and reads the history again after a restart). Keys: maxAge
  # (duration) and maxEntries (int). Set both, or neither: a key that is not
  # set becomes 0, not the buildkit default (48h / 50); maxEntries 0 stops
  # recording new history, and maxAge alone drops the 50-entry floor.
  # 1000 records cover about an hour of a busy farm; buildkit's own 50 last
  # minutes there.
  history:
    maxAge: 48h
    maxEntries: 1000

  # -- Container Device Interface (GPUs and other devices for RUN steps).
  # Off by default: CI builds need no devices. Requires buildkit >= v0.33.1:
  # older versions panic when a build requests a device while CDI is
  # disabled (GHSA-r456-g3gm-cvxf).
  cdi:
    enabled: false

  # buildkitd's own log ([log] in buildkitd.toml). Empty keeps buildkit's
  # defaults (text, info); set, it changes the config and restarts every
  # daemon once. debug logs every step of every build and a stack for each
  # failed call: for a while, to find something out.
  log:
    # -- error, warn, info or debug; empty: info.
    level: ""
    # -- json or text; empty: text.
    format: ""

  # -- Max concurrent connections per registry; 0 keeps the buildkit default
  # (4). Pushes that get stuck hold their slot and can hang every build on
  # the daemon (moby/buildkit#7275); the probes do not detect that.
  maxRegistryConcurrency: 0

  # -- Extra keys for the [worker.oci] table, e.g. {snapshotter: native}.
  # Values: strings, numbers, booleans or lists. The keys the chart sets
  # (enabled, gc, max-parallelism, gcpolicy) are rejected.
  workerOCI: {}

  # -- Raw TOML inserted after the top-level keys and before the chart's
  # tables: use it for top-level keys (e.g. insecure-entitlements) and new
  # tables (e.g. [registry."docker.io"]). Never repeat [grpc], [worker.oci],
  # [worker.containerd], [history], [system] or [cdi]; the chart validates the
  # result and fails the render otherwise. Do not reach into those tables
  # with dotted keys either (worker.oci.max-parallelism = 5): the chart's
  # check accepts them, buildkitd's parser does not, and the daemon fails to
  # start. Use the typed values or config.workerOCI.
  extraConfig: ""

# Metrics and traces, pushed by buildkitd over OTLP. Its debug HTTP server
# (/metrics next to pprof and cache endpoints) is never enabled: builds share
# the daemon's network and could reach it.
otel:
  # -- Full OTLP URL for metrics (with the path, e.g.
  # http://otel-collector:4318/v1/metrics). Empty: no metrics are pushed. Both endpoints are rendered with tpl, so a parent
  # chart can build them from the release name.
  metricsEndpoint: ""
  # -- Full OTLP URL for traces (e.g.
  # http://otel-collector:4318/v1/traces). Empty: no traces are exported. CI jobs join a build to their own trace by
  # setting TRACEPARENT for buildctl.
  tracesEndpoint: ""
  # -- http/protobuf (what most OTLP receivers accept over HTTP) or grpc.
  protocol: http/protobuf
  # -- Seconds between metric pushes. Counters are deltas per interval:
  # sum them over time (or convert them to cumulative in a collector).
  metricsIntervalSeconds: 60
  # -- More resource attributes for every metric and span. The chart always
  # adds k8s.namespace.name, k8s.pod.name and k8s.node.name, so each series
  # and span names its daemon.
  resourceAttributes: {}

# Probes call `buildctl debug workers` on the local unix socket with an empty
# environment (tracing variables would make buildctl wait for a trace
# backend). A busy daemon can take seconds to answer; the Kubernetes default
# timeout (1 s) restarts healthy daemons under load.
probes:
  # -- Polls often until the daemon answers, then hands over to readiness
  # (kubelet runs it right away) and liveness, which is off meanwhile, so a
  # slow start on a large cache is not killed. Budget: failureThreshold x
  # max(periodSeconds, timeoutSeconds) = 5 to 7.5 min.
  startup:
    initialDelaySeconds: 2
    periodSeconds: 2
    timeoutSeconds: 3
    failureThreshold: 150
    terminationGracePeriodSeconds: 30
  readiness:
    # -- Keep 0: kubelet runs readiness right after startup succeeds, but
    # skips that run while still inside initialDelaySeconds; the pod then
    # waits a full period.
    initialDelaySeconds: 0
    # -- A daemon that stops answering leaves the endpoints after
    # periodSeconds x failureThreshold (30 s); until then its node's jobs
    # still go to it.
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 6
    # -- Grace for a restart caused by this probe. A wedged daemon is killed
    # after this instead of the pod's terminationGracePeriodSeconds.
    terminationGracePeriodSeconds: 30

# -- Daemon resources. The small default requests keep the daemon out of
# BestEffort, which the kubelet evicts first under memory pressure; size
# them to the build load and leave kubelet and containerd headroom (an
# unlimited daemon starved a 192-core node in production). A hard CPU limit
# throttles builds. A memory limit applies to buildkitd and all RUN steps
# together, and an OOM kill takes the whole daemon with every running
# build; leave headroom above max-parallelism x the largest step. Sizes:
#   a small node (4-8 CPU, 8-16 GiB):  requests {cpu: "1", memory: 2Gi},  limits {memory: 6Gi}
#   16-32 CPU, 64 GiB:                 requests {cpu: "8", memory: 16Gi}, limits {memory: 48Gi}
#   production (48+ CPU, 192+ GiB):    requests {cpu: "48", memory: 128Gi}, limits {memory: 128Gi}
resources:
  requests:
    cpu: 500m
    memory: 512Mi

# -- Seconds a stopping daemon gets to finish running builds (it stops
# accepting new ones at once). Builds still running after this are killed.
# With maxUnavailable 1 a rollout takes up to nodes x this, so pass a helm
# `--timeout` to match. Production builds took 7-21 min: consider 1200-1800
# there. Pod evictions and node shutdowns do not honour it.
terminationGracePeriodSeconds: 300

# -- On deletion, keep serving for this long before buildkitd gets SIGTERM,
# so kube-proxy withdraws the endpoint first and no new connection is
# refused. Counts against terminationGracePeriodSeconds. 0 disables.
preStopSleepSeconds: 5

# -- A new daemon must stay ready this long before the rollout moves on to
# the next node.
minReadySeconds: 10

updateStrategy:
  # -- RollingUpdate or OnDelete. With OnDelete, Helm 4's `--wait` (kstatus)
  # waits for pods that are never replaced: use --wait=legacy or no --wait.
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    # -- Must stay 0 with storage.type=hostPath (buildkitd locks the state
    # dir, so a surge pod never starts).
    maxSurge: 0

# -- Merged over global.buildNodes.selector (and kubernetes.io/os: linux).
nodeSelector: {}
# -- Appended to global.buildNodes.tolerations.
tolerations: []
affinity: {}
# -- An existing PriorityClass for the daemons. Empty: the one this chart
# creates (priorityClass), or none if that is switched off.
priorityClassName: ""
# The daemons' own PriorityClass. Under node pressure (memory or disk) the
# kubelet evicts pods that use more than they requested in order of
# priority, so without one the daemon - every running build and, with
# emptyDir, its cache - goes as early as any CI job. Cluster-scoped, named
# <namespace>-<fullname>; creating it needs that permission.
priorityClass:
  # -- Create the PriorityClass. false: no class (or priorityClassName's).
  create: true
  # -- Above CI jobs (0), below Kubernetes' own system classes (2000000000).
  value: 1000000
  # -- Never: the daemon does not evict running CI jobs to get scheduled;
  # PreemptLowerPriority lets it.
  preemptionPolicy: Never

# A small container next to the daemon that reports the free space of the
# cache's filesystem (statfs), which BuildKit's API does not: the console
# shows it on the Nodes page against the GC limits and warns before the
# disk fills. It runs the ci-accelerator image (the control plane's);
# enable it together with the control plane (the box does). Answers plain
# HTTP on its port with numbers only (the controller reaches it like the
# daemon; builds share the pod's network and can read the numbers too). It
# also reports the node's and the daemon pod's CPU and memory, read from
# /proc and the host's cgroup filesystem (mounted read-only).
diskProbe:
  # -- Run the probe. Off here (no controller to read it); the box turns it on.
  enabled: false
  # -- Its port (GET /disk, /load, /healthz); the daemons tell it to the
  # control plane as a worker label.
  port: 9180
  # -- Its log level (debug adds a line per reading); empty: info. Set, it
  # restarts every daemon once.
  logLevel: ""
  image:
    # -- The ci-accelerator image: mirror it together with the control plane's.
    repository: ghcr.io/hoobiboobi/ci-accelerator
    # -- Default: v0.3.3, the release that last changed the probe program or
    # its image; pinned, so a chart release alone does not restart every daemon.
    tag: ""
    # -- When set, the image is pulled by digest (tag is kept for readability;
    # the release notes list the probe's). Under the default tag, the digest
    # of another release is refused.
    digest: ""
    pullPolicy: IfNotPresent
  # -- The probe's resources (it reads a few kernel files every 10 s and
  # keeps an hour of readings in memory).
  resources:
    requests: {cpu: 5m, memory: 16Mi}
    limits: {memory: 32Mi}

# -- Extra pod labels. They cannot override the selector or component labels.
podLabels: {}
podAnnotations: {}

# -- Extra environment variables for the daemon container.
extraEnv: []
