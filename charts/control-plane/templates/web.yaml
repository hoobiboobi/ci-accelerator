{{- $w := dict "root" . "role" "web" }}
{{- $v := .Values.web }}
# The pages. They keep nothing (the controller holds the store and the
# sessions), so any number of pods can serve them and a rollout is a
# rolling one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-plane.webName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" $w | nindent 4 }}
spec:
  replicas: {{ int $v.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "control-plane.selectorLabels" $w | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "control-plane.podLabels" $w | nindent 8 }}
      annotations:
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # How the controller is set up for the pages (sign-in, GitLab's
        # token, the GitLabs): a change rolls the web, which reads it at
        # start. (A web that missed it is refused by the controller and
        # starts again.)
        ci-accelerator.io/controller-setup: {{ include "control-plane.setupChecksum" . }}
    spec:
      serviceAccountName: {{ include "control-plane.webName" . }}
      # No Kubernetes API access: the web's only token is the projected one
      # the controller accepts.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "control-plane.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - web
            - -listen=:{{ int $v.port }}
            - -controller=https://{{ include "control-plane.controllerName" . }}.{{ .Release.Namespace }}.svc:{{ int .Values.controller.api.port }}
            - -controller-ca=/api-tls/ca.crt
            - -token-file=/var/run/secrets/ci-accelerator/token
            {{- include "control-plane.logArgs" (dict "root" $ "role" $v) | nindent 12 }}
          {{- with include "control-plane.signInURL" . }}
          env:
            # Where browsers reach the console: the absolute addresses of
            # the pages' link previews (in the environment, so an older
            # image that knows no such setting still starts).
            - name: CI_ACCELERATOR_PUBLIC_URL
              value: {{ . | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ int $v.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with $v.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: api-ca
              mountPath: /api-tls
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/ci-accelerator
              readOnly: true
      volumes:
        # Only the CA the controller's certificate chains to: the web never
        # sees a key.
        - name: api-ca
          secret:
            secretName: {{ include "control-plane.apiSecretName" . }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        # Proof of who the web is, for the controller only (its audience);
        # the kubelet renews it in place.
        - name: token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  audience: ci-accelerator-controller
                  expirationSeconds: 3600
                  path: token
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "control-plane.webName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" $w | nindent 4 }}
automountServiceAccountToken: false
