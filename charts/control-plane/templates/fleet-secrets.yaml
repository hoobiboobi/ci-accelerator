{{- if eq (include "control-plane.fleetRole" .) "member" }}
{{- /*
The Secrets a fleet member's controller fills: created here, empty, so its
Role needs no right to create Secrets. Their data is the controller's:
this chart never sets it, and an upgrade leaves it alone. Kept when the
release goes (they hold the delivered tokens and the member's key). A
Secret of that name made outside this release (by hand, or by an earlier
controller) is left as it is: the controller updates it in place.
*/}}
{{- $key := include "control-plane.fleetKeySecret" . }}
{{- range (include "control-plane.fleetSecretNames" . | fromYamlArray) }}
{{- $live := lookup "v1" "Secret" $.Release.Namespace . }}
{{- $a := dig "metadata" "annotations" (dict) $live }}
{{- if or (not $live) (and (eq (get $a "meta.helm.sh/release-name") $.Release.Name) (eq (get $a "meta.helm.sh/release-namespace") $.Release.Namespace)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "control-plane.labels" (dict "root" $ "role" "controller") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    ci-accelerator.io/note: {{ ternary "the fleet member's private key, made by the controller when it joined with a join token" "delivered by the fleet hub: change it there" (eq . $key) | quote }}
type: Opaque
{{- end }}
{{- end }}
{{- end }}
