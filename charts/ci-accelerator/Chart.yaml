apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 0.2.5
# The box's own version (its console); the daemons' BuildKit version is in charts/buildkit.
appVersion: "0.2.5"
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.33.1
    - name: console
      image: ghcr.io/hoobiboobi/ci-accelerator-console:v0.2.5
      platforms:
        - linux/amd64
        - linux/arm64
    - name: gitlab-runner
      image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.4.1
  artifacthub.io/links: |
    - name: Website and documentation
      url: https://ci-accelerator.io/docs/
    - name: Try it on one machine
      url: https://ci-accelerator.io/docs/#try-it-on-one-machine
    - name: GitOps (Flux, Argo CD)
      url: https://ci-accelerator.io/docs/gitops/
    - name: Changelog
      url: https://ci-accelerator.io/changelog/
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
  # The release's changes, for Artifact Hub's version page; rewrite with each release (docs/releasing.md).
  artifacthub.io/changes: |
    - kind: changed
      description: The console shows every time in the reader's time zone, with the moment in UTC on hover; the pipelines filter's dates are the reader's days
    - kind: added
      description: A job's log reads in parts from GitLab - the last 500 lines, then 500 earlier lines as often as needed, and new lines below
    - kind: added
      description: The pipeline timeline's names column can be widened (drag, double-click to fit, keys) and is remembered
    - kind: fixed
      description: Opening a pipeline no longer flashes every step open; the wheel over the timeline reaches the page; labels at the right edge are no longer cut off
    - kind: changed
      description: The architecture document shows the components and namespaces as a diagram
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (third-party
# archives checked against pinned sha256 sums).
dependencies:
  - name: buildkit
    version: 0.2.5
    repository: file://../buildkit
  - name: console
    version: 0.2.5
    repository: file://../console
    condition: console.enabled
  - name: gitlab-runner
    version: 0.93.0
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
