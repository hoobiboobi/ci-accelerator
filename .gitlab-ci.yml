# The project's own builds, on its own build farm.
#
# GitHub Actions (.github/workflows/mirror.yml) pushes every branch of
# github.com/hoobiboobi/ci-accelerator to the read-only mirror
# gitlab.com/ci-accelerator/ci-accelerator. Its runner is a ci-accelerator
# box: this pipeline builds the ci-accelerator image with the CI component
# in this repository, through the box's build router and daemons, and the
# box's console explains each build. The job pushes the image to this
# mirror's registry with the job's own token, as any project using the
# component would: :<commit> for every commit, :edge for main. These are
# unsigned development builds; releases are built, signed and published to
# ghcr.io by GitHub Actions. The registry keeps the last 10 tags of up to
# 14 days, and :edge.
#
# Next to the image, two jobs build the checks of the sources
# (ci/showcase/test.Dockerfile): go test and go vet, run as builds on the
# box. The three start together and share their first steps (the base image,
# the Go modules), which BuildKit runs once for all of them; the Go caches
# are cache mounts on the daemon. The console shows each job's steps: run,
# from cache, or received from another job.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        EDGE_IMAGE: $CI_REGISTRY_IMAGE:edge
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"

stages: [build]

include:
  - local: ci/gitlab/build.yml
    inputs:
      runner-tags: [ci-accelerator]
      dockerfile: cmd/ci-accelerator/Dockerfile
      platform: linux/amd64,linux/arm64
      # An empty line (EDGE_IMAGE off main) names no image.
      images: |
        $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
        $EDGE_IMAGE
  - local: ci/gitlab/build.yml
    inputs:
      job-name: go-test
      runner-tags: [ci-accelerator]
      dockerfile: ci/showcase/test.Dockerfile
      target: test
      push: false
      timeout-minutes: 30
  - local: ci/gitlab/build.yml
    inputs:
      job-name: go-vet
      runner-tags: [ci-accelerator]
      dockerfile: ci/showcase/test.Dockerfile
      target: vet
      push: false
      timeout-minutes: 30
