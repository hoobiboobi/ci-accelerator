suite: disk probe in the box
templates:
  - validate.yaml
  - charts/control-plane/templates/controller.yaml
  - charts/buildkit/templates/daemonset.yaml
  - charts/buildkit/templates/configmap.yaml
  - charts/buildkit/templates/priorityclass.yaml
values:
  - values/required.yaml
release:
  name: box
  namespace: ci-accelerator
capabilities:
  apiVersions:
    - cert-manager.io/v1
tests:
  - it: runs the probe next to each daemon, from the ci-accelerator image, and the controller reads it
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: disk-probe
        template: charts/buildkit/templates/daemonset.yaml
      - matchRegex:
          path: spec.template.spec.containers[1].image
          pattern: '^ghcr\.io/hoobiboobi/ci-accelerator:v'
        template: charts/buildkit/templates/daemonset.yaml
      # The daemons tell the controller the probe's port.
      - contains:
          path: spec.template.spec.containers[0].args
          content: ci-accelerator.io/disk-probe-port=9180
        template: charts/buildkit/templates/daemonset.yaml

  - it: gives the daemons their PriorityClass
    asserts:
      - equal:
          path: metadata.name
          value: ci-accelerator-box-buildkit
        template: charts/buildkit/templates/priorityclass.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: ci-accelerator-box-buildkit
        template: charts/buildkit/templates/daemonset.yaml

  - it: accepts a probe image that differs from the control plane's (the probe has its own pin)
    template: validate.yaml
    set:
      control-plane.image.repository: mirror.example/ci-accelerator
    asserts:
      - hasDocuments:
          count: 0
