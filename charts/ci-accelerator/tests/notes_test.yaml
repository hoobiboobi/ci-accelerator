suite: NOTES
templates:
  - NOTES.txt
values:
  - values/required.yaml
release:
  name: box
  namespace: ci-accelerator
tests:
  - it: names the daemons, the jobs namespace and how to build
    asserts:
      - matchRegexRaw:
          pattern: 'DaemonSet box-buildkit'
      - matchRegexRaw:
          pattern: 'CI jobs run in namespace ci-accelerator-jobs \(created by this release, Pod Security baseline; deleted with it\)'
      - matchRegexRaw:
          pattern: 'buildctl --addr "\$BUILDKIT_REMOTE_ADDR" --tlsdir "\$BUILDKIT_TLS_DIR"'

  # The build job's image is the BuildKit release the daemons run, not the
  # box's own version (0.2.0 and 0.2.1 printed moby/buildkit:<box version>).
  - it: gives the build job the daemons' BuildKit image
    asserts:
      - matchRegexRaw:
          pattern: 'image: moby/buildkit:v\d+\.\d+\.\d+\n'
      - notMatchRegexRaw:
          pattern: 'image: moby/buildkit:\d'

  - it: points to the fragment without its own runner
    set:
      gitlab-runner.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: 'No runner is installed: configure yours with integrations/gitlab-runner/values.yaml\n\(BUILDKIT_REMOTE_ADDR=tcp://box-router.ci-accelerator.svc:1234\)'

  - it: says nothing about metrics storage by default
    asserts:
      - notMatchRegexRaw:
          pattern: Victoria

  - it: warns that the storage of 0.1.0 is gone when its values remain
    set:
      victoria-metrics-single.enabled: true
      buildkit.otel.metricsEndpoint: 'http://{{ include "ci-accelerator.vmService" . }}.{{ .Release.Namespace }}.svc:8428/opentelemetry/v1/metrics'
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: VictoriaMetrics and VictoriaTraces are no longer part of the box'
      - matchRegexRaw:
          pattern: 'set them to ""'

  - it: says the console without sign-in stays inside the cluster
    set:
      control-plane.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: 'Sign-in is off \(control-plane\.signIn\): the console shows everything to\nwhoever reaches it, so keep it inside the cluster:\n  kubectl -n ci-accelerator port-forward svc/box-web 8080'
      - matchRegexRaw:
          pattern: 'The console explains each build: the controller \(box-controller\)\ncollects the daemons. history, the web \(box-web\) serves the pages\.'
      - notMatchRegexRaw:
          pattern: 'preview'
      - matchRegexRaw:
          pattern: 'Without GitLab access it shows image builds, their steps and cache\nverdicts, but no job results or runner waits\. More \(README, "The console"\):\n  - a GitLab token with read_api \(control-plane\.gitlab\.token\.existingSecret\):'
      # Without global.console.url the redirect URI shows where the address goes.
      - matchRegexRaw:
          pattern: '      <global\.console\.url>/auth/callback/051b90\n'

  - it: does not ask for a token the console already has
    set:
      control-plane.enabled: true
      control-plane.gitlab.token.existingSecret: console-gitlab-token
    asserts:
      - matchRegexRaw:
          pattern: 'Sign-in is off'
      - notMatchRegexRaw:
          pattern: 'control-plane\.gitlab\.token\.existingSecret'
      - matchRegexRaw:
          pattern: 'With its GitLab token it also shows job results and runner waits'

  - it: prints the redirect URI of the runner's GitLab for sign-in
    set:
      control-plane.enabled: true
      global.console.url: https://ci.example.com/
      control-plane.signIn: { enabled: true, sessionKey: { existingSecret: s }, gitlab: [{ existingSecret: o }] }
    asserts:
      - matchRegexRaw:
          pattern: 'People sign in through GitLab at https://ci\.example\.com/ and see the projects whose jobs'
      - matchRegexRaw:
          pattern: '  https://gitlab\.example\.com/: https://ci\.example\.com/auth/callback/051b90\n'
      - notMatchRegexRaw:
          pattern: 'Sign-in is off'
      - notMatchRegexRaw:
          pattern: 'control-plane\.gitlab\.token\.existingSecret'

  - it: gives the port-forward for a console on this machine
    set:
      control-plane.enabled: true
      global.console.url: http://localhost:18081
      control-plane.signIn: { enabled: true, sessionKey: { existingSecret: s }, gitlab: [{ existingSecret: o }] }
    asserts:
      - matchRegexRaw:
          pattern: 'http://localhost:18081 is this machine: reach the console with\n  kubectl -n ci-accelerator port-forward svc/box-web 18081:8080'
      - notMatchRegexRaw:
          pattern: 'Ingress or gateway with TLS for http://'

  - it: says nothing of the console when the control plane is off
    set:
      control-plane.enabled: false
    asserts:
      - notFailedTemplate: {}
      - notMatchRegexRaw:
          pattern: 'The console explains'

  - it: says where the cache lives while it is an emptyDir
    asserts:
      - matchRegexRaw:
          pattern: 'The build cache is an emptyDir on each build node.s root disk: every rollout\nstarts with an empty cache\. For production, point the daemons at a dedicated\ndisk \(buildkit\.storage\.type=hostPath; README, "Where the cache lives"\)\.'

  - it: is quiet about the cache on a dedicated disk
    set:
      buildkit.storage.type: hostPath
      buildkit.storage.hostPath.path: /var/mnt/nvme/buildkit
    asserts:
      - notMatchRegexRaw:
          pattern: 'The build cache is an emptyDir'

