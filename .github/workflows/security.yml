# Weekly: known vulnerabilities reachable from the Go code on main,
# in the published ci-accelerator images the charts run by default (the
# latest, and the disk probe's while it stays on an earlier release), and in
# the third-party images they run by default (BuildKit, gitlab-runner). Pull requests run the same
# checks against their own code and image (checks.yml); this catches what
# is published after a quiet week.
name: security

on:
  schedule:
    - cron: '20 6 * * 1' # Mondays 06:20 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: govulncheck (main)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Go
        run: make go-tools

      - name: govulncheck, both release targets
        run: make vulncheck

  image:
    name: trivy (published ci-accelerator images)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # The control plane's image and, while it lags behind, the disk
      # probe's (every daemon pod runs it): each is scanned, one finding
      # fails the job.
      - name: Scan the published images the charts run by default
        run: |
          tags=$(scripts/default-images.sh) # fails the step when it cannot tell
          failed=0
          for tag in $tags; do
            echo "==> ci-accelerator:$tag"
            make image-scan IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-accelerator:$tag" || failed=1
          done
          exit "$failed"

  third-party:
    name: trivy (default third-party images)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # The daemons' BuildKit (privileged, every build runs in it) and the
      # box's gitlab-runner: findings without a release to move to are
      # granted a while in .trivyignore-third-party.yaml; a new one, or an
      # expired grant, fails the job.
      - name: Scan the third-party images the charts run by default
        run: make third-party-scan
