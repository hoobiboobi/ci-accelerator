apiVersion: v2
name: control-plane
description: >-
  The ci-accelerator control plane: a controller that collects the build
  history of BuildKit daemons and the CI jobs around it, and a web that
  serves the console, which explains every build: what came from cache,
  what came from another job, and why a step was rebuilt.
type: application
version: 0.3.6
# The image is released with the charts and tagged v<appVersion>.
appVersion: "0.3.6"
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - ci
  - build-cache
  - control-plane
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: ci-accelerator
      image: ghcr.io/hoobiboobi/ci-accelerator:v0.3.6
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
