{{- if include "console.signIn" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "console.fullname" . }}-sign-in
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
data:
  # Names of the mounted Secrets' files; no secret is written here.
  sign-in.json: {{ include "console.signInConfig" . | quote }}
{{- end }}
