{{- $web := default (dict) .Values.web }}
# The pages. They keep nothing (the controller holds the store and the
# sessions), so any number of pods can serve them and a rollout is a
# rolling one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.webName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.webLabels" . | nindent 4 }}
spec:
  replicas: {{ int (dig "replicas" 2 $web) }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "console.webSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "console.webPodLabels" . | nindent 8 }}
      {{- with (dig "podAnnotations" (dict) $web) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "console.webName" . }}
      # No Kubernetes API access: the web's only token is the projected one
      # the controller accepts.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "console.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - web
            - -listen=:{{ .Values.service.port }}
            - -controller=https://{{ include "console.apiName" . }}.{{ .Release.Namespace }}.svc:{{ include "console.apiPort" . }}
            - -controller-ca=/api-tls/ca.crt
            - -token-file=/var/run/secrets/ci-accelerator/token
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with (dig "resources" (dict "requests" (dict "cpu" "20m" "memory" "48Mi") "limits" (dict "memory" "256Mi")) $web) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: api-ca
              mountPath: /api-tls
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/ci-accelerator
              readOnly: true
      volumes:
        # Only the CA the controller's certificate chains to: the web never
        # sees a key.
        - name: api-ca
          secret:
            secretName: {{ include "console.apiSecretName" . }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        # Proof of who the web is, for the controller only (its audience);
        # the kubelet renews it in place.
        - name: token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  audience: ci-accelerator-console
                  expirationSeconds: 3600
                  path: token
      {{- with (include "console.webValue" (dict "root" . "key" "nodeSelector")) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "console.webValue" (dict "root" . "key" "tolerations")) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "console.webValue" (dict "root" . "key" "affinity")) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "console.webName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.webLabels" . | nindent 4 }}
automountServiceAccountToken: false
