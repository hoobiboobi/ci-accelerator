apiVersion: v2
name: buildkit
description: >-
  Persistent BuildKit daemons as a shared build service for CI, with probe
  and garbage-collection defaults derived from a production setup.
type: application
version: 0.1.0
# Upstream moby/buildkit release; the default image tag is derived from it.
appVersion: "v0.33.1"
# >=1.34 for Service trafficDistribution: PreferSameNode (GA in 1.35).
kubeVersion: ">=1.34.0-0"
home: https://github.com/hoobiboobi/ci-accelerator
sources:
  - https://github.com/hoobiboobi/ci-accelerator
  - https://github.com/moby/buildkit
keywords:
  - buildkit
  - ci
  - docker
  - build-cache
annotations:
  artifacthub.io/license: Apache-2.0
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
