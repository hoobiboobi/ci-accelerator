suite: observability
templates:
  - charts/buildkit/templates/daemonset.yaml
  - charts/buildkit/templates/networkpolicy.yaml
values:
  - values/required.yaml
release:
  name: box
  namespace: ci-accelerator
capabilities:
  apiVersions:
    - cert-manager.io/v1
tests:
  # The box keeps no metrics or traces: the daemons send them only where
  # the user points them.
  - it: sends no metrics or traces by default
    template: charts/buildkit/templates/daemonset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
          any: true

  - it: sends them to the user's OTLP backend
    template: charts/buildkit/templates/daemonset.yaml
    set:
      buildkit.otel.metricsEndpoint: http://collector.obs:4318/v1/metrics
      buildkit.otel.tracesEndpoint: http://collector.obs:4318/v1/traces
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://collector.obs:4318/v1/metrics"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://collector.obs:4318/v1/traces"}

  # helm upgrade --reuse-values from 0.1.0 brings its storage endpoints and
  # values along: they still render (the install notes say they lead
  # nowhere).
  - it: renders the values of 0.1.0
    template: charts/buildkit/templates/daemonset.yaml
    set:
      buildkit.otel.metricsEndpoint: 'http://{{ include "ci-accelerator.vmService" . }}.{{ .Release.Namespace }}.svc:8428/opentelemetry/v1/metrics'
      buildkit.otel.tracesEndpoint: 'http://{{ include "ci-accelerator.vtService" . }}.{{ .Release.Namespace }}.svc:10428/insert/opentelemetry/v1/traces'
      victoria-metrics-single.enabled: true
      victoria-traces-single.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://box-victoria-metrics-single-server.ci-accelerator.svc:8428/opentelemetry/v1/metrics"}

  - it: lets the daemons reach no storage of the release any more
    template: charts/buildkit/templates/networkpolicy.yaml
    asserts:
      - notMatchRegex:
          path: spec.egress[2]
          pattern: victoria
