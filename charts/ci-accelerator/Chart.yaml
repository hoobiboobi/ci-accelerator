apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 0.2.1
# The box's own version (its console); the daemons' BuildKit version is in charts/buildkit.
appVersion: "0.2.1"
kubeVersion: ">=1.34.0-0"
home: https://github.com/hoobiboobi/ci-accelerator
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.33.1
    - name: console
      image: ghcr.io/hoobiboobi/ci-accelerator-console:v0.2.1
      platforms:
        - linux/amd64
        - linux/arm64
    - name: gitlab-runner
      image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.4.1
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/hoobiboobi/ci-accelerator#readme
    - name: Try it on one machine
      url: https://github.com/hoobiboobi/ci-accelerator#try-it-on-one-machine
    - name: GitOps (Flux, Argo CD)
      url: https://github.com/hoobiboobi/ci-accelerator/blob/main/docs/gitops.md
    - name: Changelog
      url: https://github.com/hoobiboobi/ci-accelerator/blob/main/CHANGELOG.md
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
  # The release's changes, for Artifact Hub's version page; rewrite with each release (docs/releasing.md).
  artifacthub.io/changes: |
    - kind: fixed
      description: The pipeline timeline's "Critical path" toggle fades what is off the path
    - kind: fixed
      description: quickstart.sh keeps an existing values.yaml on a second run
    - kind: added
      description: Chart READMEs and Artifact Hub metadata (icon, images, links)
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (third-party
# archives checked against pinned sha256 sums).
dependencies:
  - name: buildkit
    version: 0.2.1
    repository: file://../buildkit
  - name: console
    version: 0.2.1
    repository: file://../console
    condition: console.enabled
  - name: gitlab-runner
    version: 0.93.0
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
