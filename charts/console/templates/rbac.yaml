{{- $jobs := include "console.jobsNamespace" . }}
{{- if and $jobs .Values.jobs.rbac.create }}
# Read-only access to the CI job pods, for their jobs' names, pipelines and
# commits. Nothing else, and only in the jobs namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "console.fullname" . }}-jobs
  namespace: {{ $jobs }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "console.fullname" . }}-jobs
  namespace: {{ $jobs }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "console.fullname" . }}-jobs
subjects:
  - kind: ServiceAccount
    name: {{ include "console.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
