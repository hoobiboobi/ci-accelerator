suite: NOTES
templates:
  - NOTES.txt
values:
  - values/tls.yaml
release:
  name: bk
  namespace: builds
kubernetesProvider:
  scheme:
    "v1/Namespace":
      gvr:
        version: v1
        resource: namespaces
      namespaced: false
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
tests:
  - it: prints the in-cluster address and a probe-safe check command
    asserts:
      - matchRegexRaw:
          pattern: 'tcp://bk-buildkit\.builds\.svc:1234\n  \(routing: PreferSameNode\)'
      - matchRegexRaw:
          pattern: 'kubectl exec -n builds ds/bk-buildkit -- env -i OTEL_TRACES_EXPORTER=none /usr/bin/buildctl debug workers'
      - matchRegexRaw:
          pattern: 'DESIRED 0 means no node matches'

  - it: explains how clients connect with mutual TLS and how to restart after a renewal
    asserts:
      - matchRegexRaw:
          pattern: 'signed by the CA in Secret bk-tls:\n\n  buildctl --addr tcp://bk-buildkit\.builds\.svc:1234 --tlsdir <dir> debug workers'
      - matchRegexRaw:
          pattern: 'Any certificate from that CA can control the daemons: use a dedicated CA\.'
      - matchRegexRaw:
          pattern: 'Stakater Reloader \(if installed\) restarts the daemons; otherwise run:\n  kubectl rollout restart ds/bk-buildkit -n builds'
      - notMatchRegexRaw:
          pattern: 'TLS is not configured'
      # Offline (helm template, GitOps) nothing can be known about the Secret.
      - notMatchRegexRaw:
          pattern: does not exist yet

  - it: does not mention Reloader when its annotation is off
    set:
      tls.reloader: false
    asserts:
      - matchRegexRaw:
          pattern: 'After the Secret is renewed,\nrestart the daemons:\n  kubectl rollout restart ds/bk-buildkit -n builds'
      - notMatchRegexRaw:
          pattern: Reloader

  # On a live install (the namespace is visible) a missing Secret leaves the
  # pods in ContainerCreating; say so instead of a silent hang.
  - it: warns on a live install when the TLS Secret does not exist yet
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: builds
            labels:
              pod-security.kubernetes.io/enforce: privileged
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: Secret builds/bk-tls does not exist yet; the daemon pods\nwait in ContainerCreating until it does\.'

  - it: does not warn about the Secret when it exists
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: builds
            labels:
              pod-security.kubernetes.io/enforce: privileged
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bk-tls
            namespace: builds
          data:
            tls.crt: eA==
            tls.key: eA==
            ca.crt: eA==
    asserts:
      - notMatchRegexRaw:
          pattern: does not exist yet

  - it: names the node port in the warning for NodePort
    set:
      service.type: NodePort
      service.nodePort: 31234
    asserts:
      - matchRegexRaw:
          pattern: 'From outside the cluster: tcp://<any-node-ip>:31234'
      - matchRegexRaw:
          pattern: 'add --tlsservername bk-buildkit\.builds\.svc unless the server\n  certificate covers that address'

  - it: lists what is missing for production with the defaults
    asserts:
      - matchRegexRaw:
          pattern: 'Before production:\n  - storage.type=emptyDir: every rollout'
      - matchRegexRaw:
          pattern: "  - resources are the chart's minimum"
      - matchRegexRaw:
          pattern: '  - config.maxParallelism is 0 \(unlimited\)'

  - it: says so when resources are emptied
    set:
      resources: null
    asserts:
      - matchRegexRaw:
          pattern: '  - resources is empty: the daemon runs BestEffort'

  - it: drops the items that are configured
    set:
      storage.type: hostPath
      storage.hostPath.path: /var/mnt/nvme/buildkit
      resources:
        requests:
          cpu: "8"
      config.maxParallelism: 16
    asserts:
      - matchRegexRaw:
          pattern: 'Before production:\n  - storage.type=hostPath: the cache in /var/mnt/nvme/buildkit stays on the nodes after helm uninstall'
      - notMatchRegexRaw:
          pattern: 'resources is empty'
      - notMatchRegexRaw:
          pattern: 'maxParallelism is 0'

  - it: warns when the namespace has no Pod Security enforce label
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: builds
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: namespace builds has no pod-security.kubernetes.io/enforce label'

  # helm install --create-namespace renders before the namespace exists.
  - it: warns when the namespace did not exist at render time
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: namespace builds has no pod-security.kubernetes.io/enforce label \(it did not exist yet when the chart was rendered, e.g. --create-namespace\),'

  - it: does not warn about a privileged namespace
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: builds
            labels:
              pod-security.kubernetes.io/enforce: privileged
    asserts:
      - notMatchRegexRaw:
          pattern: 'has no pod-security.kubernetes.io/enforce label'

  - it: warns that builds reach metadata and the cluster without a NetworkPolicy
    asserts:
      - matchRegexRaw:
          pattern: 'networkPolicy.enabled is false: RUN steps share the daemon''s network, so every build can reach cloud instance metadata'

  - it: drops that warning with a NetworkPolicy
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.namespaces: [ci-jobs]
    asserts:
      - notMatchRegexRaw:
          pattern: networkPolicy.enabled is false
