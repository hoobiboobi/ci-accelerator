{{- $role := include "control-plane.fleetRole" . }}
{{- $np := default (dict) .Values.networkPolicy }}
{{- if dig "enabled" false $np }}
{{- /* The console's pages: the web's, or a fleet hub's (a member has none). */}}
{{- $console := ternary "hub" "web" (eq $role "hub") }}
{{- if ne $role "member" }}
{{- $denied := list .Release.Namespace }}
{{- with include "control-plane.jobsNamespace" . }}{{ $denied = append $denied . }}{{ end }}
{{- /* Every namespace of CI jobs (the router's clients) and of the daemons,
whose network every RUN step shares. */}}
{{- range (dig "router" "clientNamespaces" (list) .Values.AsMap) }}{{ $denied = append $denied (tpl . $) }}{{ end }}
{{- if include "control-plane.discover" . }}{{ $denied = append $denied (include "control-plane.daemonsService" . | fromJson).namespace }}{{ end }}
{{- range (dig "deniedNamespaces" (list) $np) }}{{ $denied = append $denied (tpl . $) }}{{ end }}
# Who may open the console's pages. CI jobs and their builds run untrusted
# code in the same cluster, and without sign-in the console shows every
# project to whoever reaches it: the jobs namespaces, the router's client
# namespaces, the daemons' namespace (RUN steps share their network) and
# job pods in this namespace are kept out; Ingress controllers and other
# namespaces, and kubectl port-forward (it enters the pod from the node),
# still reach it. Only ingress is limited. On a fleet hub the same holds
# for its pages; its members reach it through the Ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "control-plane.webName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" (dict "root" . "role" $console) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "control-plane.selectorLabels" (dict "root" . "role" $console) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        # Every namespace but this one and the denied ones.
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  {{- toYaml (uniq $denied) | nindent 18 }}
        # This namespace, but not the denied components.
        - podSelector:
            {{- with (dig "deniedComponents" (list "buildkit" "ci-job") $np) }}
            matchExpressions:
              - key: ci-accelerator.io/component
                operator: NotIn
                values:
                  {{- toYaml . | nindent 18 }}
            {{- else }}
            {}
            {{- end }}
        {{- with (dig "extraFrom" (list) $np) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- if ne $role "hub" }}
{{- $callers := list }}
{{- if ne $role "member" }}{{ $callers = append $callers "web" }}{{ end }}
{{- if include "control-plane.router" . }}{{ $callers = append $callers "router" }}{{ end }}
{{- if ne $role "member" }}
---
{{- end }}
# Who may call the controller: the web's and the routers' pods, nothing
# else (the kubelet's probes come from the node, which a NetworkPolicy does
# not limit; a fleet member's hub calls it over the link the controller
# dials). Its own connections (daemons, the API server, GitLab, S3, the
# hub) stay open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "control-plane.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" (dict "root" . "role" "controller") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "control-plane.selectorLabels" (dict "root" . "role" "controller") | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if $callers }}
  ingress:
    - ports:
        - port: api
          protocol: TCP
      from:
        {{- range $callers }}
        - podSelector:
            matchLabels:
              {{- include "control-plane.selectorLabels" (dict "root" $ "role" .) | nindent 14 }}
        {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- if include "control-plane.router" . }}
---
# Who may connect to the routers: the CI jobs' namespaces. Their daemons
# check each job's certificate through the router.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "control-plane.routerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" (dict "root" . "role" "router") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "control-plane.selectorLabels" (dict "root" . "role" "router") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: tcp
          protocol: TCP
      from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- include "control-plane.routerClients" . | fromJsonArray | toYaml | nindent 18 }}
{{- end }}
{{- end }}
{{- end }}
