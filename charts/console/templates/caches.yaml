{{- $stores := dig "stores" (list) (default (dict) .Values.caches) }}
{{- if $stores }}
{{- $secrets := list }}
{{- range $stores }}{{ $secrets = append $secrets .existingSecret }}{{ end }}
# The runners' cache folders the console lists (no keys here).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "console.fullname" . }}-caches
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
data:
  caches.json: {{ include "console.cachesJson" . | quote }}
---
# Read access to the Secrets with the folders' keys, and to nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "console.fullname" . }}-caches
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ toJson (uniq $secrets) }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "console.fullname" . }}-caches
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "console.fullname" . }}-caches
subjects:
  - kind: ServiceAccount
    name: {{ include "console.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
