{{- if ne (include "control-plane.fleetRole" .) "hub" }}
{{- /* A fleet hub runs none of this: hub.yaml. */}}
{{- include "control-plane.validate" . }}
{{- $jobs := include "control-plane.jobsNamespace" . }}
{{- $urlsFrom := include "control-plane.urlsConfigMap" . }}
{{- $token := .Values.gitlab.token.existingSecret }}
{{- $signIn := include "control-plane.signIn" . }}
{{- $caches := include "control-plane.cachesConfigMap" . }}
{{- $member := eq (include "control-plane.fleetRole" .) "member" }}
{{- $fleet := dig "fleet" (dict) .Values.AsMap }}
{{- $join := and $member (dig "join" "existingSecret" "" $fleet) }}
{{- $c := dict "root" . "role" "controller" }}
{{- $v := .Values.controller }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-plane.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" $c | nindent 4 }}
spec:
  # The controller. One writer: SQLite on a ReadWriteOnce volume. Recreate,
  # so the old pod is gone before the new one opens the store.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "control-plane.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "control-plane.podLabels" $c | nindent 8 }}
      {{- if or $v.podAnnotations $signIn $member }}
      annotations:
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $member }}
        # The controller reads the hub's address and keys at start.
        ci-accelerator.io/fleet-checksum: {{ printf "%s|%s|%s|%s|%s" (dig "hub" "url" "" $fleet) (dig "name" "" $fleet) (dig "hub" "publicKeys" "" $fleet) (dig "hub" "caCert" "" $fleet) (dig "join" "existingSecret" "" $fleet) | sha256sum | trunc 16 }}
        {{- end }}
        {{- if $signIn }}
        # The controller reads its sign-in file at start.
        ci-accelerator.io/sign-in-checksum: {{ include "control-plane.signInConfig" . | sha256sum | trunc 16 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "control-plane.controllerName" . }}
      # The token checks the web's tokens (TokenReview), watches the job
      # pods and reads the caches' keys.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "control-plane.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - -data=/data
            - -tls-dir=/certs
            - -api-listen=:{{ int $v.api.port }}
            - -api-tls-dir=/api-tls
            {{- if not $member }}
            # A member has no web: its hub calls the API over the link.
            - -api-allow={{ .Release.Namespace }}/{{ include "control-plane.webName" . }}
            {{- end }}
            {{- if include "control-plane.router" . }}
            - -api-allow-router={{ .Release.Namespace }}/{{ include "control-plane.routerName" . }}
            - -warm-for={{ mul (int .Values.router.warmDays) 24 }}h
            {{- end }}
            - -discover={{ include "control-plane.discover" . }}
            {{- with .Values.daemons.serverName }}
            - -server-name={{ tpl . $ }}
            {{- end }}
            {{- range .Values.gitlab.urls }}
            - -gitlab-url={{ . }}
            {{- end }}
            {{- if $urlsFrom }}
            # A file, not an environment variable: the controller starts
            # again when the URLs change, which the pod template does not show.
            - -gitlab-urls-file=/gitlab-urls/urls
            {{- end }}
            {{- with $jobs }}
            - -jobs-namespace={{ . }}
            {{- end }}
            - -keep-days={{ int .Values.retention.days }}
            - -keep-output-days={{ int .Values.retention.outputDays }}
            - -release={{ .Release.Name }}
            {{- include "control-plane.logArgs" (dict "root" $ "role" .Values.controller) | nindent 12 }}
            {{- if $token }}
            - -gitlab-token-file=/gitlab/token
            {{- end }}
            {{- if $signIn }}
            - -sign-in=/sign-in/config/sign-in.json
            {{- end }}
            {{- if $member }}
            # A fleet member: the controller dials the hub and serves it its
            # API over that connection.
            - -fleet-hub={{ trimSuffix "/" (dig "hub" "url" "" $fleet) }}
            - -fleet-name={{ dig "name" "" $fleet }}
            - -fleet-key-file=/fleet/key/key
            - -fleet-hub-keys-file=/fleet/hub/keys.pem
            {{- if dig "hub" "caCert" "" $fleet }}
            - -fleet-hub-ca-file=/fleet/hub/ca.pem
            {{- end }}
            {{- if $join }}
            # Joining with a token: the controller makes the key, keeps it
            # in this Secret first, then trades the token.
            - -fleet-join-file=/fleet/join/token
            - -fleet-key-secret={{ include "control-plane.fleetKeySecret" . }}
            {{- end }}
            {{- end }}
            {{- if $caches }}
            - -caches=/caches/{{ .Values.caches.key }}
            - -cache-every={{ default "10m" .Values.caches.every }}
            {{- end }}
          {{- $trustGit := dig "reasons" "trustGitComparison" false .Values.AsMap }}
          {{- if or $caches $trustGit $member }}
          env:
            {{- if or $caches $member }}
            # Where the Secrets with the caches' keys are, and where a fleet
            # member writes the Secrets its hub delivers (and keeps a key it
            # makes).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- if $trustGit }}
            # In the environment, so an older image that knows no such
            # setting still starts.
            - name: CI_ACCELERATOR_TRUST_GIT_COMPARISON
              value: "true"
            {{- end }}
          {{- end }}
          ports:
            - name: api
              containerPort: {{ int $v.api.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
              scheme: HTTPS
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with $v.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: api-tls
              mountPath: /api-tls
              readOnly: true
            # SQLite's temporary files.
            - name: tmp
              mountPath: /tmp
            {{- if $token }}
            - name: gitlab-token
              mountPath: /gitlab
              readOnly: true
            {{- end }}
            {{- if $caches }}
            - name: caches
              mountPath: /caches
              readOnly: true
            {{- end }}
            {{- if $urlsFrom }}
            - name: gitlab-urls
              mountPath: /gitlab-urls
              readOnly: true
            {{- end }}
            {{- if $member }}
            - name: fleet-key
              mountPath: /fleet/key
              readOnly: true
            - name: fleet-hub
              mountPath: /fleet/hub
              readOnly: true
            {{- if $join }}
            - name: fleet-join
              mountPath: /fleet/join
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $signIn }}
            - name: sign-in
              mountPath: /sign-in/config
              readOnly: true
            - name: sign-in-key
              mountPath: /sign-in/key
              readOnly: true
            {{- range $i, $g := .Values.signIn.gitlab }}
            - name: sign-in-gitlab-{{ $i }}
              mountPath: /sign-in/gitlab-{{ $i }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "control-plane.pvcName" . }}
        - name: certs
          secret:
            secretName: {{ include "control-plane.clientSecretName" . }}
            defaultMode: 0440
        - name: api-tls
          secret:
            secretName: {{ include "control-plane.apiSecretName" . }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tmp
          emptyDir: {}
        {{- if $token }}
        - name: gitlab-token
          secret:
            secretName: {{ $token }}
            defaultMode: 0440
            {{- if $member }}
            # A fleet hub may deliver it after the controller started: read
            # at every use, so it counts once it is there.
            optional: true
            {{- end }}
            items:
              - key: {{ default "token" .Values.gitlab.token.key }}
                path: token
        {{- end }}
        {{- if $caches }}
        - name: caches
          configMap:
            name: {{ $caches }}
        {{- end }}
        {{- if $urlsFrom }}
        - name: gitlab-urls
          configMap:
            name: {{ $urlsFrom }}
            items:
              - key: {{ .Values.gitlab.urlsFrom.key }}
                path: urls
        {{- end }}
        {{- if $member }}
        - name: fleet-key
          secret:
            secretName: {{ include "control-plane.fleetKeySecret" . }}
            defaultMode: 0440
            {{- if $join }}
            # Filled by the controller at its first start: empty before.
            optional: true
            {{- end }}
            items:
              - key: {{ if dig "key" "existingSecret" "" $fleet }}{{ dig "key" "key" "key" $fleet }}{{ else }}key{{ end }}
                path: key
        {{- if $join }}
        - name: fleet-join
          secret:
            secretName: {{ dig "join" "existingSecret" "" $fleet }}
            defaultMode: 0440
            optional: true
            items:
              - key: {{ dig "join" "key" "token" $fleet }}
                path: token
        {{- end }}
        - name: fleet-hub
          configMap:
            name: {{ include "control-plane.controllerName" . }}-fleet
        {{- end }}
        {{- if $signIn }}
        - name: sign-in
          configMap:
            name: {{ include "control-plane.controllerName" . }}-sign-in
        - name: sign-in-key
          secret:
            secretName: {{ .Values.signIn.sessionKey.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ default "key" .Values.signIn.sessionKey.key }}
                path: key
        {{- range $i, $g := .Values.signIn.gitlab }}
        - name: sign-in-gitlab-{{ $i }}
          secret:
            secretName: {{ $g.existingSecret }}
            defaultMode: 0440
            items:
              - key: client-id
                path: client-id
              - key: client-secret
                path: client-secret
        {{- end }}
        {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
