suite: box
templates:
  - jobs-namespace.yaml
  - charts/buildkit/templates/configmap.yaml
  - validate.yaml
  - charts/gitlab-runner/templates/configmap.yaml
  - charts/buildkit/templates/certificates.yaml
  - charts/buildkit/templates/networkpolicy.yaml
values:
  - values/required.yaml
release:
  name: box
  namespace: ci-accelerator
capabilities:
  apiVersions:
    - cert-manager.io/v1
tests:
  # Job pods run untrusted code: their own namespace, Pod Security baseline.
  - it: creates the jobs namespace with Pod Security baseline
    template: jobs-namespace.yaml
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: ci-accelerator-jobs
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: baseline

  - it: can leave the jobs namespace to someone else
    template: jobs-namespace.yaml
    set:
      jobsNamespace.create: false
    asserts:
      - hasDocuments:
          count: 0

  # The contract with the CI component, filled in from this release.
  - it: points the runner's jobs at this release's router and client certificate
    template: charts/gitlab-runner/templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"BUILDKIT_REMOTE_ADDR=tcp://box-router\.ci-accelerator\.svc:1234"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: 'namespace = "ci-accelerator-jobs"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: 'name = "box-buildkit-client"\n\s+mount_path = "/certs"\n\s+read_only = true'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: 'automount_service_account_token = false'

  # Every job gets its own trace without changes to .gitlab-ci.yml: one
  # trace per pipeline made BuildKit attach every concurrent job's spans to
  # each build record of that pipeline.
  - it: gives every job its own trace, named by the GitLab, the pipeline and the job
    template: charts/gitlab-runner/templates/configmap.yaml
    set:
      gitlab-runner.gitlabUrl: https://gitlab.example.com/
    asserts:
      - matchRegex:
          path: data["config.template.toml"]
          pattern: 'export TRACEPARENT="00-01[0-9a-f]{6}\$\(printf ''%012x%012x'' "\$CI_PIPELINE_ID" "\$CI_JOB_ID"\)-\$\(printf ''%016x'' "\$CI_JOB_ID"\)-01"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: 'if \[ -z "\$\{TRACEPARENT:-\}" \] && \[ "\$\{CI_PIPELINE_ID:-x\}" -gt 0 \] 2>/dev/null && \[ "\$\{CI_JOB_ID:-x\}" -gt 0 \] 2>/dev/null && \[ "\$CI_PIPELINE_ID" -le 281474976710655 \] && \[ "\$CI_JOB_ID" -le 281474976710655 \]; then'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"ci-accelerator.io/pipeline-id" = "\$CI_PIPELINE_ID"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"ci-accelerator.io/pipeline-source" = "\$CI_PIPELINE_SOURCE"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"ci-accelerator.io/pipeline-created-at" = "\$CI_PIPELINE_CREATED_AT"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"ci-accelerator.io/project-path" = "\$CI_PROJECT_PATH"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"ci-accelerator.io/job-stage" = "\$CI_JOB_STAGE"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"ci-accelerator.io/job-started-at" = "\$CI_JOB_STARTED_AT"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"ci-accelerator.io/commit-title" = "\$CI_COMMIT_TITLE"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"ci-accelerator.io/commit-author" = "\$CI_COMMIT_AUTHOR"'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"ci-accelerator.io/merge-request-iid" = "\$CI_MERGE_REQUEST_IID"'

  # The prefix identifies the GitLab instance: ids repeat across them.
  - it: derives the trace-id prefix from the GitLab URL, after the scheme version
    template: charts/gitlab-runner/templates/configmap.yaml
    set:
      gitlab-runner.gitlabUrl: https://gitlab.example.com/
    asserts:
      - matchRegex:
          path: data["config.template.toml"]
          pattern: 'TRACEPARENT="00-01051b90\$'

  # buildkit's own name rule: a release name containing "buildkit" is used as is.
  - it: follows buildkit's naming when the release name contains buildkit
    template: charts/gitlab-runner/templates/configmap.yaml
    release:
      name: my-buildkit
    set:
      global.router.enabled: false
    asserts:
      - matchRegex:
          path: data["config.template.toml"]
          pattern: 'tcp://my-buildkit\.ci-accelerator\.svc:1234'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: 'name = "my-buildkit-client"'

  # Helm merges maps: the selector extends the default, as for the daemons.
  - it: places jobs where global.buildNodes puts the daemons, with the helper image's architecture
    template: charts/gitlab-runner/templates/configmap.yaml
    set:
      global.buildNodes.selector: {pool: ci}
      global.buildNodes.tolerations:
        - {key: dedicated, operator: Exists, effect: NoSchedule}
        - {key: pool, operator: Equal, value: ci, effect: NoExecute}
      global.jobs.architecture: arm64
    asserts:
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '\[runners.kubernetes.node_selector\]\n\s+"ci-accelerator.io/node-role" = "build"\n\s+"kubernetes.io/arch" = "arm64"\n\s+"pool" = "ci"\n'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '\[runners.kubernetes.node_tolerations\]\n\s+"dedicated" = "NoSchedule"\n\s+"pool=ci" = "NoExecute"'

  # TOML refuses a key defined twice: the runner would start with no
  # [[runners]] and take no jobs, with the reason only in its log.
  - it: writes kubernetes.io/arch once when the build-node selector has it too
    template: charts/gitlab-runner/templates/configmap.yaml
    set:
      global.buildNodes.selector: {ci-accelerator.io/node-role: build, kubernetes.io/arch: arm64}
      global.jobs.architecture: arm64
    asserts:
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '\[runners.kubernetes.node_selector\]\n\s+"ci-accelerator.io/node-role" = "build"\n\s+"kubernetes.io/arch" = "arm64"\n\s+\[runners.kubernetes.node_tolerations\]'

  - it: refuses a build-node architecture that differs from the jobs' architecture
    template: validate.yaml
    set:
      global.buildNodes.selector: {kubernetes.io/arch: arm64}
    asserts:
      - failedTemplate:
          errorPattern: 'global.buildNodes.selector has kubernetes.io/arch=arm64 but global.jobs.architecture is amd64'

  - it: merges tolerations that map to the same runner key
    template: charts/gitlab-runner/templates/configmap.yaml
    set:
      global.buildNodes.tolerations:
        - {key: ci-accelerator.io/node-role, operator: Equal, value: build, effect: NoSchedule}
        - {key: ci-accelerator.io/node-role, operator: Equal, value: build, effect: NoExecute}
        - {key: dedicated, operator: Exists, effect: NoSchedule}
        - {key: dedicated, operator: Exists, effect: NoSchedule}
        - {operator: Exists}
    asserts:
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '\[runners.kubernetes.node_tolerations\]\n\s+"" = ""\n\s+"ci-accelerator.io/node-role=build" = ""\n\s+"dedicated" = "NoSchedule"\n\s+\[runners.kubernetes.pod_labels\]'

  - it: refuses a runner configuration that is not valid TOML
    template: validate.yaml
    set:
      gitlab-runner.runners.config: |
        [[runners]]
          name = "a"
          name = "b"
    asserts:
      - failedTemplate:
          errorPattern: 'gitlab-runner.runners.config does not render to valid TOML: .*already been defined'

  - it: drops the build-node placement with build nodes switched off
    template: charts/gitlab-runner/templates/configmap.yaml
    set:
      global.buildNodes.enabled: false
    asserts:
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '\[runners.kubernetes.node_selector\]\n\s+"kubernetes.io/arch" = "amd64"\n\s+\[runners.kubernetes.node_tolerations\]\n\s+\[runners.kubernetes.pod_labels\]'

  - it: issues the client certificate into the jobs namespace
    template: charts/buildkit/templates/certificates.yaml
    set:
      global.jobs.namespace: team-jobs
      gitlab-runner.runners.jobNamespace: team-jobs
    asserts:
      - containsDocument:
          any: true
          apiVersion: cert-manager.io/v1
          kind: Certificate
          name: box-buildkit-client
          namespace: team-jobs

  # Through the router only (charts/ci-accelerator/tests/router_test.yaml
  # covers the box without it).
  - it: admits no namespace of clients to the daemons
    template: charts/buildkit/templates/networkpolicy.yaml
    asserts:
      - notExists:
          path: spec.ingress[0].from[0].namespaceSelector

  - it: requires the GitLab URL
    template: validate.yaml
    set:
      gitlab-runner.gitlabUrl: ""
    asserts:
      - failedTemplate:
          errorPattern: 'gitlab-runner.gitlabUrl is required'

  - it: requires the runner token Secret and shows how to make it
    template: validate.yaml
    set:
      gitlab-runner.runners.secret: ""
    asserts:
      - failedTemplate:
          errorPattern: 'gitlab-runner.runners.secret is required: .*kubectl -n ci-accelerator create secret generic gitlab-runner-token --from-literal=runner-token=glrt-'

  - it: needs neither without its own runner
    template: validate.yaml
    set:
      gitlab-runner.enabled: false
      gitlab-runner.gitlabUrl: ""
      gitlab-runner.runners.secret: ""
    asserts:
      - hasDocuments:
          count: 0

  # The runner chart creates its Role in runners.jobNamespace.
  - it: refuses a runner job namespace other than global.jobs.namespace
    template: validate.yaml
    set:
      global.jobs.namespace: team-jobs
    asserts:
      - failedTemplate:
          errorPattern: 'gitlab-runner.runners.jobNamespace \(ci-accelerator-jobs\) must equal global.jobs.namespace \(team-jobs\)'

  - it: refuses running jobs in the release namespace
    template: validate.yaml
    set:
      global.jobs.namespace: ci-accelerator
      gitlab-runner.runners.jobNamespace: ci-accelerator
    asserts:
      - failedTemplate:
          errorPattern: 'global.jobs.namespace is the release namespace'

  - it: refuses buildkit name overrides the runner address cannot follow
    template: validate.yaml
    set:
      buildkit.fullnameOverride: other
    asserts:
      - failedTemplate:
          errorPattern: 'buildkit.fullnameOverride and buildkit.nameOverride are not supported'

  # The console's address in the job environment makes every job print the
  # link to its page; without it, nothing is printed and nothing is set.
  - it: prints each job's console page when the console's address is set
    template: charts/gitlab-runner/templates/configmap.yaml
    set:
      global.console.url: https://console.example.com/
    asserts:
      - matchRegex:
          path: data["config.template.toml"]
          pattern: '"CI_ACCELERATOR_CONSOLE_URL=https://console.example.com/",'
      - matchRegex:
          path: data["config.template.toml"]
          pattern: 'echo "ci-accelerator: why this job.s builds take their time: \$\{CI_ACCELERATOR_CONSOLE_URL%/\}/jobs/[0-9a-f]{6}/\$CI_JOB_ID"'
  - it: sets no console address by default
    template: charts/gitlab-runner/templates/configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.template.toml"]
          pattern: CI_ACCELERATOR_CONSOLE_URL=
  - it: refuses a console address that could break the runner configuration
    template: jobs-namespace.yaml
    set:
      global.console.url: 'https://x/"]'
    asserts:
      - failedTemplate: {}
  # The console reads the history again after a restart.
  - it: keeps 1000 build records per daemon for the console
    template: charts/buildkit/templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["buildkitd.toml"]
          pattern: '\[history\]\n  maxAge = "48h"\n  maxEntries = 1000'
