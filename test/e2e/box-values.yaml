# e2e-only values for charts/ci-accelerator. gitlabUrl, the token Secret, the
# jobs namespace and the build nodes' architecture come from run.sh.
gitlab-runner:
  # Every kind worker is a tainted build node: the manager runs on the
  # control-plane node.
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  checkInterval: 1
  concurrent: 2
buildkit:
  # Push often, so the scenario sees metrics within seconds.
  otel:
    metricsIntervalSeconds: 10
# The storage runs on the control-plane node too (with its default
# persistent volumes from kind's local-path provisioner).
victoria-metrics-single:
  server:
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
victoria-traces-single:
  server:
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
