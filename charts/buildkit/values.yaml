# Default values for the buildkit chart.
# Every key here is validated by values.schema.json; unknown keys are rejected.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name (<release>-<chart> by default).
fullnameOverride: ""

image:
  repository: moby/buildkit
  # -- Defaults to the chart appVersion.
  tag: ""
  # -- Pin by digest (sha256:...); takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

# -- Image pull secrets for private mirrors of the buildkit image.
imagePullSecrets: []

# -- Labels added to every resource the chart creates.
commonLabels: {}

preflight:
  # -- Fail the install if the namespace's Pod Security `enforce` level is
  # not privileged (otherwise no daemon pod is ever created). Needs read
  # access to the Namespace object; set false if the installer lacks it.
  podSecurity: true

# Shared with other ci-accelerator charts when installed via the umbrella.
global:
  # Dedicated build nodes (see docs: label and taint them before install).
  buildNodes:
    # -- false: ignore selector/tolerations below and run on any node.
    # (A switch, because Helm merges `selector: {}` with the default
    # instead of clearing it.)
    enabled: true
    selector:
      ci-accelerator.io/node-role: build
    tolerations:
      - key: ci-accelerator.io/node-role
        operator: Equal
        value: build
        effect: NoSchedule

# Client-facing Service on :1234. A headless Service
# (<fullname>-headless) is always created for in-cluster discovery.
service:
  # -- ClusterIP for CI jobs in the cluster; NodePort to reach daemons from
  # outside (kind, debugging).
  type: ClusterIP
  port: 1234
  # -- Fixed node port when type is NodePort; empty lets Kubernetes pick.
  nodePort: ""
  # -- How in-cluster clients reach a daemon. The cache is per daemon, so
  # staying on the client's node keeps it warm.
  #   PreferSameNode: own node's daemon; falls back to another node when it
  #                   is not ready (cold cache, build still succeeds).
  #   Local:          own node's daemon only; no daemon ready = no endpoints.
  #   Cluster:        any daemon.
  routing: PreferSameNode
  # -- externalTrafficPolicy for NodePort (Cluster or Local).
  externalTrafficPolicy: Cluster
  annotations: {}

# Where the daemon keeps its state (/var/lib/buildkit): the build cache.
storage:
  # -- emptyDir: cache lives as long as the pod (kind, CI).
  # hostPath: cache survives restarts; point it at a local NVMe mount.
  type: emptyDir
  emptyDir:
    # -- e.g. "50Gi"; empty means no limit. Exceeding it evicts the pod.
    sizeLimit: ""
  hostPath:
    path: /var/lib/ci-accelerator/buildkit

# Rendered into /etc/buildkit/buildkitd.toml.
config:
  # -- Max parallel build steps per daemon; 0 keeps the buildkit default
  # (number of CPUs). Production example: 28 on a 48-CPU daemon.
  maxParallelism: 0

  # Garbage collection. Sizes: bytes, "512MB"/"2TB", or "N%" of the disk.
  # Units are binary: buildkit reads "10GB" as 10 GiB.
  # Durations: seconds or Go durations ("48h", "336h"; no "d" unit).
  # The chart always renders the full policy set itself; buildkit ignores
  # worker-level caps once any explicit policy exists.
  gc:
    # -- Never reclaim below this much cache.
    reservedSpace: "10GB"
    # -- Reclaim when the cache grows above this.
    maxUsedSpace: "75%"
    # -- Reclaim when free disk space drops below this.
    minFreeSpace: "15%"
    cacheMounts:
      # -- Keep RUN --mount=type=cache contents this long after last use.
      # buildkit's default is 48h, which makes package caches cold after a
      # weekend.
      keepDuration: "336h"
      # -- Expire cache mounts only while the WHOLE cache is above this size
      # (buildkit compares policy caps with total usage, not with the
      # filtered records). Empty: expire after keepDuration unconditionally.
      maxUsedSpace: ""

  # -- Replace the chart's GC policies entirely. Each item: filters, all,
  # keepDuration, reservedSpace, maxUsedSpace, minFreeSpace.
  gcPolicy: []

  # -- Build history API (used by the console in later releases).
  # Keys: maxAge (duration), maxEntries (int; 0 disables recording).
  # Empty keeps buildkit defaults (48h / 50).
  history: {}

  # -- Container Device Interface (GPUs and other devices for RUN steps).
  # Off by default: CI builds need no devices, and it removes an attack
  # surface (see GHSA-r456-g3gm-cvxf, fixed in v0.33.1).
  cdi:
    enabled: false

  # -- Max concurrent connections per registry; 0 keeps the buildkit
  # default. See moby/buildkit#7275 before raising it.
  maxRegistryConcurrency: 0

  # -- Raw TOML appended verbatim. Must not repeat tables the chart renders
  # ([grpc], [worker.oci], [worker.containerd], [history], [system], [cdi]).
  extraConfig: ""

# Probes call `buildctl debug workers` on the local unix socket, with OTEL
# disabled. A busy daemon can take seconds to answer; the Kubernetes default
# timeout (1s) restarts healthy daemons under load.
probes:
  # -- Polls often until the daemon answers, then hands over to readiness
  # (run immediately by kubelet) and liveness. Liveness is off meanwhile, so
  # a slow start on a large cache is not killed. Budget: 2s x 150 = 5 min.
  startup:
    initialDelaySeconds: 2
    periodSeconds: 2
    timeoutSeconds: 10
    failureThreshold: 150
  readiness:
    # -- Keep 0: kubelet triggers readiness right after startup succeeds,
    # but skips that run if it falls inside initialDelaySeconds — the pod
    # then waits a full period (seen on kind: 34s instead of ~4s).
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 6

# -- Daemon resources. Do not let it take the whole node: kubelet and
# containerd need headroom. A hard CPU limit throttles builds; prefer
# requests close to the expected load. Production example:
#   requests: {cpu: "48", memory: 128Gi}
#   limits:   {memory: 128Gi}
resources: {}

# -- Seconds a stopping daemon gets to finish in-flight requests.
terminationGracePeriodSeconds: 300

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# -- Merged over global.buildNodes.selector.
nodeSelector: {}
# -- Appended to global.buildNodes.tolerations.
tolerations: []
affinity: {}
priorityClassName: ""

podLabels: {}
podAnnotations: {}

# -- Extra environment variables for the daemon container.
extraEnv: []
