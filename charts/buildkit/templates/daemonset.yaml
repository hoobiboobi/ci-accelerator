{{- include "buildkit.validate" . }}
{{- include "buildkit.preflight" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "buildkit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkit.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "buildkit.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
    {{- /* Helm merges a user's {type: OnDelete} with the default
           rollingUpdate block, which the API rejects for OnDelete. */}}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    {{- with .Values.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  minReadySeconds: {{ int64 .Values.minReadySeconds }}
  template:
    metadata:
      labels:
        {{- include "buildkit.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "buildkit.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The daemon never talks to the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ int64 .Values.terminationGracePeriodSeconds }}
      nodeSelector:
        {{- include "buildkit.nodeSelector" . | nindent 8 }}
      {{- with (include "buildkit.tolerations" .) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: buildkitd
          image: {{ include "buildkit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - {{ include "buildkit.configDir" . }}/buildkitd.toml
          securityContext:
            # Rootful daemon: RUN steps run in runc sandboxes inside it. The
            # rootless variant is not supported yet.
            privileged: true
          ports:
            - name: grpc
              containerPort: 1234
              protocol: TCP
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.preStopSleepSeconds }}
          lifecycle:
            # Keep accepting connections while the endpoint is withdrawn;
            # buildkitd closes its listener at once on SIGTERM.
            preStop:
              sleep:
                seconds: {{ int64 . }}
          {{- end }}
          startupProbe:
            {{- include "buildkit.probeExec" . | nindent 12 }}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            {{- include "buildkit.probeExec" . | nindent 12 }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- include "buildkit.probeExec" . | nindent 12 }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ include "buildkit.configDir" . }}
              readOnly: true
            - name: state
              mountPath: /var/lib/buildkit
      volumes:
        - name: config
          configMap:
            name: {{ include "buildkit.fullname" . }}-config
        - name: state
          {{- if eq .Values.storage.type "hostPath" }}
          hostPath:
            path: {{ .Values.storage.hostPath.path | quote }}
            type: {{ .Values.storage.hostPath.type }}
          {{- else }}
          {{- with .Values.storage.emptyDir.sizeLimit }}
          emptyDir:
            sizeLimit: {{ . | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
