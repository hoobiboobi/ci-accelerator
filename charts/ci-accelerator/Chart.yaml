apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 0.3.3
# The box's own version (its control plane's image); the daemons' BuildKit version is in charts/buildkit.
appVersion: "0.3.3"
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.34.1
    - name: ci-accelerator
      image: ghcr.io/hoobiboobi/ci-accelerator:v0.3.3
      platforms:
        - linux/amd64
        - linux/arm64
    - name: gitlab-runner
      image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.4.2
  artifacthub.io/links: |
    - name: Website and documentation
      url: https://ci-accelerator.io/docs/
    - name: Try it on one machine
      url: https://ci-accelerator.io/docs/#try-it-on-one-machine
    - name: GitOps (Flux, Argo CD)
      url: https://ci-accelerator.io/docs/gitops/
    - name: Changelog
      url: https://ci-accelerator.io/changelog/
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
  # The release's changes, for Artifact Hub's version page; rewrite with each release (docs/releasing.md).
  artifacthub.io/changes: |
    - kind: added
      description: A build's page has a Resources tab - the executed steps by CPU time with the cores each used, their memory and disk writes, and a chart of the cores the running steps wanted together against the node's cores
    - kind: added
      description: The Nodes page shows each node's CPU and memory over the last hour, and a daemon's page splits the node into the daemon's pod, the rest and what is free, with the kernel's pressure figures
    - kind: added
      description: The disk probe next to each daemon reports the node's and the daemon pod's CPU and memory (GET /load); the daemons restart once on upgrade
    - kind: added
      description: The Builds list's image column can be widened by its border, fitted to the longest name, and is remembered
    - kind: fixed
      description: A pipeline that built one image no longer says "All 1 image were rebuilt"
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (third-party
# archives checked against pinned sha256 sums).
dependencies:
  - name: buildkit
    version: 0.3.3
    repository: file://../buildkit
  - name: control-plane
    version: 0.3.3
    repository: file://../control-plane
    condition: control-plane.enabled
  - name: gitlab-runner
    version: 0.93.0
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
