# e2e-only: the box's console, from the image `make console-image` loads
# into kind (tag e2e: a run never replaces the :dev image of a local
# install), on the control-plane node like the storage.
console:
  enabled: true
  image:
    repository: ci-accelerator-console
    tag: e2e
    pullPolicy: Never
  persistence:
    size: 1Gi
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
# The disk probe next to each daemon runs the console's image too.
buildkit:
  diskProbe:
    image:
      repository: ci-accelerator-console
      tag: e2e
      pullPolicy: Never
