apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 0.2.3
# The box's own version (its console); the daemons' BuildKit version is in charts/buildkit.
appVersion: "0.2.3"
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.33.1
    - name: console
      image: ghcr.io/hoobiboobi/ci-accelerator-console:v0.2.3
      platforms:
        - linux/amd64
        - linux/arm64
    - name: gitlab-runner
      image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.4.1
  artifacthub.io/links: |
    - name: Website and documentation
      url: https://ci-accelerator.io/docs/
    - name: Try it on one machine
      url: https://ci-accelerator.io/docs/#try-it-on-one-machine
    - name: GitOps (Flux, Argo CD)
      url: https://ci-accelerator.io/docs/gitops/
    - name: Changelog
      url: https://ci-accelerator.io/changelog/
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
  # The release's changes, for Artifact Hub's version page; rewrite with each release (docs/releasing.md).
  artifacthub.io/changes: |
    - kind: added
      description: A GitLab CI component that builds and pushes an image on the build farm (ci/gitlab/build.yml), included by URL with an integrity hash
    - kind: added
      description: The daemons get their own PriorityClass and default resource requests, so the kubelet evicts CI jobs before them under node pressure
    - kind: added
      description: The console shows each build node's disk against the garbage collection and eviction limits (a disk probe next to each daemon)
    - kind: added
      description: The console's pipelines page searches by number, commit, title, branch, author and job name, within a period
    - kind: fixed
      description: The console's live mark no longer flashes between pages; Nodes updates itself; replaced daemons no longer stay "Unreachable"
    - kind: fixed
      description: An image's page opened with another project chosen switches to the image's project
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (third-party
# archives checked against pinned sha256 sums).
dependencies:
  - name: buildkit
    version: 0.2.3
    repository: file://../buildkit
  - name: console
    version: 0.2.3
    repository: file://../console
    condition: console.enabled
  - name: gitlab-runner
    version: 0.93.0
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
