apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 0.3.9
# The box's own version (its control plane's image); the daemons' BuildKit version is in charts/buildkit.
appVersion: "0.3.9"
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.34.1
    - name: ci-accelerator
      image: ghcr.io/hoobiboobi/ci-accelerator:v0.3.9
      platforms:
        - linux/amd64
        - linux/arm64
    - name: gitlab-runner
      image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.4.2
  artifacthub.io/links: |
    - name: Website and documentation
      url: https://ci-accelerator.io/docs/
    - name: Try it on one machine
      url: https://ci-accelerator.io/docs/#try-it-on-one-machine
    - name: GitOps (Flux, Argo CD)
      url: https://ci-accelerator.io/docs/gitops/
    - name: Changelog
      url: https://ci-accelerator.io/changelog/
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
  # The release's changes, for Artifact Hub's version page; rewrite with each release (docs/releasing.md).
  artifacthub.io/changes: |
    - kind: fixed
      description: The router passes over a daemon it cannot reach (a lost node) instead of failing the jobs sent to it, and starts a node's new router before the old one drains
    - kind: security
      description: A step's live output no longer shows part of a secret in a redrawn line; multi-line secret build arguments and PGP private keys are masked
    - kind: security
      description: The standalone control plane refuses one GitLab token for several GitLab instances (it was sent to each of them)
    - kind: fixed
      description: Saving a build no longer walks every cached run of its steps under the store's write lock (1.4 s per save at 60,000 builds)
    - kind: fixed
      description: Two sign-ins in one browser at once, and live pages behind an ended session starting sign-ins at GitLab
    - kind: fixed
      description: Pipelines skipped at a page's edge, the CI component failing a job after a successful build with a git context, and more (see the changelog)
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (third-party
# archives checked against pinned sha256 sums).
dependencies:
  - name: buildkit
    version: 0.3.9
    repository: file://../buildkit
  - name: control-plane
    version: 0.3.9
    repository: file://../control-plane
    condition: control-plane.enabled
  - name: gitlab-runner
    version: 0.93.0
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
