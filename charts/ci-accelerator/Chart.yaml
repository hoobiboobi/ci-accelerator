apiVersion: v2
name: ci-accelerator
description: >-
  A self-hosted fast CI runner for GitLab: persistent BuildKit daemons with a
  shared cache on dedicated build nodes, and a gitlab-runner that sends CI
  jobs to them.
type: application
version: 1.0.0-alpha.1
# The box's own version (its control plane's image); the daemons' BuildKit version is in charts/buildkit.
appVersion: "1.0.0-alpha.1"
kubeVersion: ">=1.34.0-0"
home: https://ci-accelerator.io
sources:
  - https://github.com/hoobiboobi/ci-accelerator
keywords:
  - buildkit
  - gitlab
  - gitlab-runner
  - ci
  - build-cache
icon: https://raw.githubusercontent.com/hoobiboobi/ci-accelerator/main/docs/icon.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/images: |
    - name: buildkit
      image: moby/buildkit:v0.34.2
    - name: ci-accelerator
      image: ghcr.io/hoobiboobi/ci-accelerator:v1.0.0-alpha.1
      platforms:
        - linux/amd64
        - linux/arm64
    - name: gitlab-runner
      image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.6.0
  artifacthub.io/links: |
    - name: Website and documentation
      url: https://ci-accelerator.io/docs/
    - name: Try it on one machine
      url: https://ci-accelerator.io/docs/#try-it-on-one-machine
    - name: GitOps (Flux, Argo CD)
      url: https://ci-accelerator.io/docs/gitops/
    - name: Changelog
      url: https://ci-accelerator.io/changelog/
    - name: support
      url: https://github.com/hoobiboobi/ci-accelerator/issues
  # The release's changes, for Artifact Hub's version page; rewrite with each release (docs/releasing.md).
  artifacthub.io/changes: |
    - kind: added
      description: "Alpha pre-release; 0.6.0 stays the latest stable release"
    - kind: added
      description: "A fleet (experimental): several boxes under one console, a hub that members dial out to, with roles, API tokens, an audit log and clusters added from the console"
    - kind: added
      description: "Console: the order speed-up says when dependencies were installed again only because the whole context is copied before the install"
    - kind: changed
      description: "Console: the compare page shows every step difference, the live forecast counts the steps still to run, and failed builds differ by more than colour"
    - kind: security
      description: "With several GitLabs and sign-in, a person's GitLab token goes only to the GitLab that issued it; wider secret masking; the controller checks TokenReview audiences; the router bounds connections"
    - kind: security
      description: "golang.org/x/net v0.62.0"
maintainers:
  - name: hoobiboobi
    url: https://github.com/hoobiboobi
# Exact versions: `make deps` vendors them into charts/ (third-party
# archives checked against pinned sha256 sums).
dependencies:
  - name: buildkit
    version: 1.0.0-alpha.1
    repository: file://../buildkit
  - name: control-plane
    version: 1.0.0-alpha.1
    repository: file://../control-plane
    condition: control-plane.enabled
  - name: gitlab-runner
    version: 0.94.3
    repository: https://charts.gitlab.io
    condition: gitlab-runner.enabled
