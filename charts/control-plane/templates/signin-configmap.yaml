{{- if include "control-plane.signIn" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "control-plane.controllerName" . }}-sign-in
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-plane.labels" (dict "root" . "role" "controller") | nindent 4 }}
data:
  # Names of the mounted Secrets' files; no secret is written here.
  sign-in.json: {{ include "control-plane.signInConfig" . | quote }}
{{- end }}
