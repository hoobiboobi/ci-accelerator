# cert-manager for the e2e cluster (a prerequisite of the chart, installed by
# run.sh when missing). Images pinned to the v1.21.3 index digests on
# quay.io (2026-10-24); bump together with CERT_MANAGER_VERSION and the chart
# checksum in run.sh.
#
# Every worker of the e2e cluster is a tainted build node, so cert-manager
# runs on the control-plane node (kind only; real clusters have other nodes).
crds:
  enabled: true
image:
  digest: sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
tolerations: &cp
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
webhook:
  tolerations: *cp
  image:
    digest: sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
cainjector:
  tolerations: *cp
  image:
    digest: sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
startupapicheck:
  tolerations: *cp
  image:
    digest: sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1
