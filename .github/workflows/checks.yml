# Checks that need no cluster: the charts on Helm 3 and Helm 4, the Go
# code, and the console's pages in a browser. The same `make` targets run
# locally. Each job runs when the change touches what it checks
# (changes.yml); a skipped job counts as passed. Not on pushes to main: a
# pull request must be up to date with main before it merges, so the
# merged tree is the one its checks ran on.
name: checks

on:
  push:
    branches: ["wip/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  checks:
    name: lint, unittest, validate (Helm ${{ matrix.helm }})
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # renovate: datasource=github-releases depName=helm/helm
        helm: [v3.22.1, v4.3.1]
    env:
      CI_HELM_VERSION: ${{ matrix.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned tools and chart archives (sha256-checked on download).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ matrix.helm }}-${{ hashFiles('Makefile') }}

      - name: Install helm, kind, kubectl
        run: |
          make ci-tools
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Lint, unit tests, schema validation
        run: make lint unittest validate

  go:
    name: go test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Install Go
        run: |
          make go-tools
          echo "$PWD/.tools/go-$(awk '/^GO_VERSION/ {print $3}' Makefile)/bin" >> "$GITHUB_PATH"

      - name: gofmt, go vet, go test
        run: make go-test

      - name: govulncheck, both release targets
        run: make vulncheck

  # The ci-accelerator image builds for both platforms exactly as a release
  # builds it (without pushing), so a release cannot fail there first.
  image:
    name: ci-accelerator image (amd64, arm64)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build
        run: SCAN_TAR="$RUNNER_TEMP/image.tar" scripts/build-image.sh ci-accelerator:check check

      - name: trivy over the built image
        run: make image-scan IMAGE_TAR="$RUNNER_TEMP/image.tar"

  component:
    name: GitLab CI component
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The job's script in its own image against a fake buildctl, and the
      # README, the box's notes and the daemons' pin kept in step with it.
      - name: Component tests
        run: make component-test

  # GitLab itself reads the component: CI lint and pipeline simulation of
  # includes with every kind of input, and inputs it must refuse. A GitLab
  # boots for minutes, so only when the component's own files changed.
  component-gitlab:
    name: GitLab CI component in GitLab ${{ matrix.gitlab }}
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The oldest GitLab the component claims (17.9) and the runner's minor.
        gitlab: [min, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The component in a real GitLab
        env:
          GITLAB: ${{ matrix.gitlab }}
        run: make component-gitlab-test

  ui:
    name: browser checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            ~/go/pkg/mod
          key: ui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Install Go and Node
        run: |
          make go-tools ui-tools
          echo "$PWD/.tools/go-$(awk '/^GO_VERSION/ {print $3}' Makefile)/bin" >> "$GITHUB_PATH"

      # The runner image's Chrome: the checks print its version.
      - name: Browser checks of the console's pages
        run: make ui-test

  # Renovate's configs are valid and see every pin (a dry run of its own
  # image over the tree), and the checksums next to the pins are the ones
  # their projects publish.
  renovate:
    name: Renovate config and pins
    needs: changes
    if: needs.changes.outputs.renovate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Renovate's view of the tree
        run: make renovate-check

      - name: The checksums against upstream
        run: make pins-check

  # One result for branch protection, whatever ran: red when a job failed
  # or when it could not be told what to run.
  passed:
    name: checks passed
    needs: [changes, checks, go, image, component, component-gitlab, ui, renovate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Nothing failed
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: $CHANGES; jobs: $RESULTS"
          test "$CHANGES" = success
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
