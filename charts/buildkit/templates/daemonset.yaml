{{- include "buildkit.validate" . }}
{{- include "buildkit.preflight" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "buildkit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkit.labels" . | nindent 4 }}
  {{- if .Values.tls.reloader }}
  annotations:
    # Stakater Reloader rolls the daemons when the Secret changes: buildkitd
    # reads its certificates only at start. The value is an anchored regex.
    secret.reloader.stakater.com/reload: {{ regexQuoteMeta (include "buildkit.tlsSecretName" .) | quote }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "buildkit.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
    {{- /* Helm merges a user's {type: OnDelete} with the default
           rollingUpdate block, which the API rejects for OnDelete. */}}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    {{- with .Values.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  minReadySeconds: {{ int64 .Values.minReadySeconds }}
  template:
    metadata:
      labels:
        {{- include "buildkit.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "buildkit.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The daemon never talks to the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "buildkit.priorityClassName" .) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ int64 .Values.terminationGracePeriodSeconds }}
      nodeSelector:
        {{- include "buildkit.nodeSelector" . | nindent 8 }}
      {{- with (include "buildkit.tolerations" .) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: buildkitd
          image: {{ include "buildkit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - {{ include "buildkit.configDir" . }}/buildkitd.toml
            # The node, as a worker label: tools that read the daemons
            # (the console) show which node each one runs on.
            - --oci-worker-labels
            - ci-accelerator.io/node=$(CI_ACCELERATOR_NODE_NAME)
          securityContext:
            # Rootful daemon: RUN steps run in runc sandboxes inside it. The
            # rootless variant is not supported yet.
            privileged: true
          ports:
            - name: grpc
              containerPort: 1234
              protocol: TCP
          env:
            {{- include "buildkit.otelEnv" . | trim | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.preStopSleepSeconds }}
          lifecycle:
            # Keep accepting connections while the endpoint is withdrawn;
            # buildkitd closes its listener at once on SIGTERM.
            preStop:
              sleep:
                seconds: {{ int64 . }}
          {{- end }}
          startupProbe:
            {{- include "buildkit.probeExec" . | nindent 12 }}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            {{- include "buildkit.probeExec" . | nindent 12 }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- include "buildkit.probeExec" . | nindent 12 }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ include "buildkit.configDir" . }}
              readOnly: true
            - name: state
              mountPath: /var/lib/buildkit
            - name: tls
              mountPath: {{ include "buildkit.tlsDir" . }}
              readOnly: true
        {{- $probe := (.Values.diskProbe | default dict) }}
        {{- if $probe.enabled }}
        # Reports the free space of the cache's filesystem (statfs), which
        # BuildKit's API does not; numbers only, read-only.
        - name: disk-probe
          image: {{ include "buildkit.diskProbeImage" . | quote }}
          imagePullPolicy: {{ dig "image" "pullPolicy" "IfNotPresent" $probe }}
          args:
            - disk-probe
            - -dir=/var/lib/buildkit
            - -listen=:{{ int64 (default 9180 $probe.port) }}
          ports:
            - name: disk
              containerPort: {{ int64 (default 9180 $probe.port) }}
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # No readiness probe: a pod is ready only when all its containers
          # are, and a probe that stops answering must not take the daemon
          # out of the Service (the console reports it instead).
          {{- with $probe.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/buildkit
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "buildkit.fullname" . }}-config
        # Explicit items: a Secret without one of the keys fails the mount
        # with the key's name in the pod events, before buildkitd starts.
        - name: tls
          secret:
            secretName: {{ include "buildkit.tlsSecretName" . | quote }}
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: state
          {{- if eq .Values.storage.type "hostPath" }}
          hostPath:
            path: {{ .Values.storage.hostPath.path | quote }}
            type: {{ .Values.storage.hostPath.type }}
          {{- else }}
          {{- with .Values.storage.emptyDir.sizeLimit }}
          emptyDir:
            sizeLimit: {{ . | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
